tool_id: attestations.by_schema
g1: attestations
description: Deep metrics for a specific EAS schema — daily check-ins, quest completions,
  any custom schema.
g2: schema
g3: by_schema
g4: Attestation analytics by schema
g5: EAS attestations by schema
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: schema_uid
  type: schema_uid
  label: Schema UID
  required: true
  placeholder: 0x57fe1f84...
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
