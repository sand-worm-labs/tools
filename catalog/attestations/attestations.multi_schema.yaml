tool_id: attestations.multi_schema
g1: attestations
description: Compare metrics across multiple EAS schemas simultaneously.
g2: schema
g3: multi_schema
g4: Multi-schema attestation dashboard
g5: EAS multi-schema comparison
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: schema_uids
  type: address[]
  label: Schema UIDs
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
