tool_id: attestations.gitcoin_passport
g1: attestations
description: Score distribution and stamp breakdown for Gitcoin Passport holders.
g2: passport
g3: gitcoin_passport
g4: Gitcoin Passport score distribution
g5: Gitcoin Passport stamps
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  options:
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: zkSync Era
    value: zksync
    icon: https://icons.llamao.fi/icons/chains/rsz_zksync_era.jpg
  - label: Linea
    value: linea
    icon: https://icons.llamao.fi/icons/chains/rsz_linea.jpg
  required: true
- key: schema_uid
  type: schema_uid
  label: Gitcoin Passport schema UID (varies by chain — see Gitcoin's docs for the deployment on your selected chain)
  required: true
  placeholder: 0x...
- key: wallet
  type: address
  label: Wallet address (optional — leave empty for aggregate view)
  required: false
  placeholder: 0x...
