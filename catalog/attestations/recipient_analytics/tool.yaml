tool_id: attestations.recipient_analytics
g1: attestations
description: All attestations received by a wallet — schema breakdown and full timeline.
g2: recipient
g3: recipient_analytics
g4: Recipient analytics
g5: EAS attestations by recipient
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  options:
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: zkSync Era
    value: zksync
    icon: https://icons.llamao.fi/icons/chains/rsz_zksync_era.jpg
  - label: Linea
    value: linea
    icon: https://icons.llamao.fi/icons/chains/rsz_linea.jpg
  required: true
- key: recipient_address
  type: address
  label: Recipient address
  required: true
  placeholder: 0x...
- key: limit
  type: number
  label: Row limit (blank for no limit)
  default: '100'
  required: false
