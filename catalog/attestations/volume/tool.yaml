tool_id: attestations.volume
g1: attestations
description: Daily attestation counts on EAS — total volume and per-schema breakdown.
g2: volume
g3: volume
g4: Attestation volume
g5: EAS attestation volume
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
