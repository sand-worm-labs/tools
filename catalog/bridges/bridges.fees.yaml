tool_id: bridges.fees
g1: bridges
description: Protocol fees, relayer fees, and effective fee rate on bridges.
g2: fees
g3: fees
g4: Bridge fee analysis
g5: Bridge protocol fees
scope: generic
inputs:
- key: protocol
  type: select
  label: Bridge protocol
  default: across
  options:
  - label: All bridges
    value: all
  - label: Optimism Bridge
    value: optimism_bridge
  - label: Arbitrum Bridge
    value: arbitrum_bridge
  - label: Base Bridge
    value: base_bridge
  - label: Across
    value: across
  - label: Stargate
    value: stargate
  - label: Hop
    value: hop
  - label: Synapse
    value: synapse
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
