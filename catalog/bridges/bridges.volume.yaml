tool_id: bridges.volume
g1: bridges
description: Daily cross-chain bridge volume broken down by token and protocol.
g2: volume
g3: volume
g4: Bridge volume by token
g5: Cross-chain bridge volume
scope: generic
inputs:
- key: source_chain
  type: chain
  label: Source chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: dest_chain
  type: chain
  label: Destination chain
  default: base
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol
  type: select
  label: Bridge protocol
  default: all
  options:
  - label: All bridges
    value: all
  - label: Optimism Bridge
    value: optimism_bridge
  - label: Arbitrum Bridge
    value: arbitrum_bridge
  - label: Base Bridge
    value: base_bridge
  - label: Across
    value: across
  - label: Stargate
    value: stargate
  - label: Hop
    value: hop
  - label: Synapse
    value: synapse
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
