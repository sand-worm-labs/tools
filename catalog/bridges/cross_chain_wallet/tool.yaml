tool_id: bridges.cross_chain_wallet
g1: bridges
description: All bridge activity for a wallet across all supported chains.
g2: wallet
g3: cross_chain_wallet
g4: Cross-chain wallet tracker
g5: Wallet bridge activity
scope: generic
inputs:
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
