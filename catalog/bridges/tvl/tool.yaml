tool_id: bridges.tvl
g1: bridges
description: Assets locked in bridge contracts — a proxy for bridge security risk.
g2: tvl
g3: tvl
g4: Bridge TVL by protocol
g5: Bridge contract TVL
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol
  type: select
  label: Bridge protocol
  default: all
  options:
  - label: All bridges
    value: all
  - label: Optimism Bridge
    value: optimism_bridge
  - label: Arbitrum Bridge
    value: arbitrum_bridge
  - label: Base Bridge
    value: base_bridge
  - label: Across
    value: across
  - label: Stargate
    value: stargate
  - label: Hop
    value: hop
  - label: Synapse
    value: synapse
  required: true
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
