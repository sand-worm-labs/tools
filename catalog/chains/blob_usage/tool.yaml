tool_id: chains.blob_usage
g1: chains
description: Blob transaction volume, fees, and top blob-submitting addresses since Dencun.
g2: blob
g3: blob_usage
g4: Blob usage (EIP-4844)
g5: L2 blob submission (EIP-4844)
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: limit
  type: number
  label: Row limit (blank for no limit)
  default: '100'
  required: false
