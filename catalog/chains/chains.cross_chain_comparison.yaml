tool_id: chains.cross_chain_comparison
g1: chains
description: DAU, TPS, and fees side-by-side across multiple chains.
g2: comparison
g3: cross_chain_comparison
g4: Cross-chain activity comparison
g5: Multi-chain DAU/TPS comparison
scope: generic
inputs:
- key: chains
  type: chain[]
  label: Chains to compare
  default:
  - ethereum
  - base
  - arbitrum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
