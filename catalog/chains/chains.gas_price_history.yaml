tool_id: chains.gas_price_history
g1: chains
description: Base fee, priority fee percentiles, and gas price distribution over time.
g2: gas
g3: gas_price_history
g4: Gas price history & percentiles
g5: Base fee and gas price history
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: granularity
  type: select
  label: Granularity
  default: hour
  options:
  - label: Hourly
    value: hour
  - label: Daily
    value: day
  - label: Weekly
    value: week
  required: true
