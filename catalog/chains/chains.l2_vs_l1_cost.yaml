tool_id: chains.l2_vs_l1_cost
g1: chains
description: Transaction cost savings on L2 compared to Ethereum mainnet over time.
g2: gas
g3: l2_vs_l1_cost
g4: L2 vs L1 cost comparison
g5: L2 vs L1 cost savings
scope: generic
inputs:
- key: l2_chain
  type: chain
  label: L2 chain
  default: base
  options:
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
