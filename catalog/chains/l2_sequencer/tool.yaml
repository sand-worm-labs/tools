tool_id: chains.l2_sequencer
g1: chains
description: Batch submission frequency, batch size, and compression ratio for an
  L2 sequencer.
g2: sequencer
g3: l2_sequencer
g4: L2 sequencer activity
g5: L2 sequencer batch submissions
scope: generic
inputs:
- key: chain
  type: chain
  label: L2 chain
  default: base
  options:
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Scroll
    value: scroll
  - label: Linea
    value: linea
  - label: zkSync Era
    value: zksync
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
