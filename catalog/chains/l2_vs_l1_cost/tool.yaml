tool_id: chains.l2_vs_l1_cost
g1: chains
description: Average transaction cost on an L2 compared to Ethereum mainnet over time.
g2: gas
g3: l2_vs_l1_cost
g4: L2 vs L1 cost comparison
g5: L2 vs L1 cost savings
scope: generic
inputs:
- key: l2_chain
  type: chain
  label: L2 chain
  default: base
  options:
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: Scroll
    value: scroll
    icon: https://icons.llamao.fi/icons/chains/rsz_scroll.jpg
  - label: Linea
    value: linea
    icon: https://icons.llamao.fi/icons/chains/rsz_linea.jpg
  - label: zkSync Era
    value: zksync
    icon: https://icons.llamao.fi/icons/chains/rsz_zksync_era.jpg
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: limit
  type: number
  label: Row limit (blank for no limit)
  default: '100'
  required: false
