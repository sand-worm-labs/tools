tool_id: chains.market_share
g1: chains
description: Relative share of total L2 transaction volume and TVL across the ecosystem.
g2: comparison
g3: market_share
g4: Chain market share over time
g5: L2 ecosystem market share
scope: generic
inputs:
- key: days
  type: select
  label: Time range
  default: '180'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: granularity
  type: select
  label: Granularity
  default: week
  options:
  - label: Hourly
    value: hour
  - label: Daily
    value: day
  - label: Weekly
    value: week
  required: true
