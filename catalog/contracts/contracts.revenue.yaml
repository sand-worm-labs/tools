tool_id: contracts.revenue
g1: contracts
description: ETH and token inflows to a contract — protocol revenue tracking.
g2: revenue
g3: revenue
g4: Contract revenue
g5: Contract ETH/token revenue inflows
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
