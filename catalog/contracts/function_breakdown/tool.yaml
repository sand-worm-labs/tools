tool_id: contracts.function_breakdown
g1: contracts
description: Which functions are called most frequently — usage distribution for any
  contract.
g2: events
g3: function_breakdown
g4: Function call breakdown
g5: Contract function call breakdown
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
