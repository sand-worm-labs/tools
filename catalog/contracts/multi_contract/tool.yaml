tool_id: contracts.multi_contract
g1: contracts
description: Unified metrics across multiple contracts — the P2E / quest contract
  use case.
g2: events
g3: multi_contract
g4: Multi-contract analytics
g5: Multi-contract unified metrics
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_addresses
  type: address[]
  label: Contract addresses
  required: true
  placeholder: 0x...
- key: event_name
  type: text
  label: Event name to track
  required: true
  placeholder: e.g. QuestCompleted, Transfer
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
