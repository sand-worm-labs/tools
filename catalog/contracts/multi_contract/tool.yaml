tool_id: contracts.multi_contract
g1: contracts
description: Unified metrics across multiple contracts — the P2E / quest contract
  use case.
g2: events
g3: multi_contract
g4: Multi-contract analytics
g5: Multi-contract unified metrics
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  - label: Fantom
    value: fantom
    icon: https://icons.llamao.fi/icons/chains/rsz_fantom.jpg
  - label: Gnosis
    value: gnosis
    icon: https://icons.llamao.fi/icons/chains/rsz_gnosis.jpg
  - label: Linea
    value: linea
    icon: https://icons.llamao.fi/icons/chains/rsz_linea.jpg
  - label: Scroll
    value: scroll
    icon: https://icons.llamao.fi/icons/chains/rsz_scroll.jpg
  - label: Blast
    value: blast
    icon: https://icons.llamao.fi/icons/chains/rsz_blast.jpg
  - label: zkSync Era
    value: zksync
    icon: https://icons.llamao.fi/icons/chains/rsz_zksync_era.jpg
  required: true
- key: contract_addresses
  type: address[]
  label: Contract addresses
  required: true
  placeholder: 0x...
- key: event_name
  type: event_signature
  label: Event to track
  dependsOn: [chain, contract_addresses]
  required: true
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: limit
  type: number
  label: Row limit (blank for no limit)
  default: '100'
  required: false
