tool_id: defi.active_wallet_pnl_calculator
g1: defi
description: Calculates realized PNL for wallets with minimum trades in lookback period.
g2: wallet
g3: active_wallet_pnl_calculator
g4: PNL for Active Traders
g5: dex_solana.trades multi-CTE PNL
scope: protocol:pumpdotfun
returns:
- name: wallet
  type: string
- name: total_pnl
  type: number
- name: buy_usd
  type: number
- name: sell_usd
  type: number
- name: trade_count
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_trades
  type: number
  label: Min Trades
  default: '10'
  required: false
