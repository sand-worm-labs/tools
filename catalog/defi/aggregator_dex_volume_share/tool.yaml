tool_id: defi.aggregator_dex_volume_share
g1: defi
description: Computes aggregator-routed share of DEX volume.
g2: dex
g3: aggregator_dex_volume_share
g4: Aggregator Share
g5: Dune dex.trades
scope: generic
returns:
- name: period
  type: string
- name: dex
  type: string
- name: agg_share
  type: number
- name: direct_share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  required: true
