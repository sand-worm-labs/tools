tool_id: defi.aggregator_protocol_share
g1: defi
description: Measures aggregator volume as share of protocol's total.
g2: dex
g3: aggregator_protocol_share
g4: Aggregator Share
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: period
  type: string
- name: dex_vol
  type: number
- name: agg_vol
  type: number
- name: agg_share
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: Uniswap
  required: true
- key: frequency
  type: select
  label: Frequency
  default: day
  required: true
  options:
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
- key: history_length
  type: number
  label: History Length
  default: '30'
  required: true
