tool_id: defi.aggregator_volume_share
g1: defi
description: Computes aggregator-routed percentage of protocol trades.
g2: dex
g3: aggregator_volume_share
g4: Aggregator Share
g5: dex.trades subquery
scope: protocol:uniswap
returns:
- name: time
  type: timestamp
- name: aggregator_volume
  type: number
- name: total_volume
  type: number
- name: share
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
