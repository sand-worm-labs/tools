tool_id: defi.arbitrage_txn_detector
g1: defi
description: Detects arbitrage transactions via multi-trade txs.
g2: dex
g3: arbitrage_txn_detector
g4: Arb Txn Stats
g5: dex.trades CTEs
scope: generic
returns:
- name: tx_hash
  type: string
- name: trade_count
  type: number
- name: profit_usd
  type: number
- name: projects
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_trades
  type: number
  label: Min Trades
  default: '2'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
