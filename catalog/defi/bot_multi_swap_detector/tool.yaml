tool_id: defi.bot_multi_swap_detector
g1: defi
description: Detects wallets with high transaction counts performing rapid consecutive
  swaps across different pairs indicating bot or multi-swap activity.
g2: wallet
g3: bot_multi_swap_detector
g4: Consecutive swap patterns
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: swap_count
  type: number
- name: consecutive_swaps
  type: number
- name: signals
  type: string
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: bot_threshold
  type: number
  label: Min tx count
  default: '100'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
