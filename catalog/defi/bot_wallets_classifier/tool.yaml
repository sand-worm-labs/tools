tool_id: defi.bot_wallets_classifier
g1: defi
description: Classifies trader wallets as bots if exceeding monthly swap threshold.
g2: wallet
g3: bot_wallets_classifier
g4: Bot vs Human
g5: Monthly swap threshold
scope: protocol:uniswap
returns:
- name: wallet
  type: string
- name: label
  type: string
- name: swaps
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: true
- key: threshold
  type: number
  label: Bot Threshold
  default: '300'
  required: false
