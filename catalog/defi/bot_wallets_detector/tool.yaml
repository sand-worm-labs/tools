tool_id: defi.bot_wallets_detector
g1: defi
description: Detects bots by average daily transaction frequency.
g2: wallet
g3: bot_wallets_detector
g4: Bot Classification
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: avg_daily_txs
  type: number
- name: is_bot
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: bot_threshold
  type: number
  label: Bot Threshold
  default: '20'
  required: true
