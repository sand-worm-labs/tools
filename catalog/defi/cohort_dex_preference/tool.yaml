tool_id: defi.cohort_dex_preference
g1: defi
description: Ranks DEXes used by specific holder cohort (e.g. imBTC depositors).
g2: dex
g3: cohort_dex_preference
g4: Cohort DEX Usage
g5: Dune dex.trades + holders
scope: generic
returns:
- name: project
  type: string
- name: trade_count
  type: number
inputs:
- key: cohort_query
  type: text
  label: Cohort query ID
  default: '3987882'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '60'
  required: false
