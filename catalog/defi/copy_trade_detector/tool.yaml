tool_id: defi.copy_trade_detector
g1: defi
description: Detects copycat trades on new tokens.
g2: dex
g3: copy_trade_detector
g4: Copycat Patterns
g5: Ethereum new tokens
scope: generic
returns:
- name: leader_wallet
  type: string
- name: copycats
  type: number
- name: avg_delay
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '1'
  required: true
- key: min_trades
  type: number
  label: Min Copies
  default: '5'
  required: false
