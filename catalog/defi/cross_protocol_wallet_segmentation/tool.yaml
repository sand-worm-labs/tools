tool_id: defi.cross_protocol_wallet_segmentation
g1: defi
description: Segments wallets by trades, days active, and volume split across protocols.
g2: wallet
g3: cross_protocol_wallet_segmentation
g4: Multi-DEX Activity
g5: Dune dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: trade_count
  type: number
- name: days_active
  type: number
- name: pumpfun_volume
  type: number
- name: pumpswap_volume
  type: number
- name: activity_density
  type: number
inputs:
- key: protocols
  type: text
  label: Protocols
  default: pumpdotfun,pumpswap
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
