tool_id: defi.dao_stablecoin_flows
g1: defi
description: Measures stablecoin (USDC/USDT/DAI) inflows to DAO addresses.
g2: dao
g3: dao_stablecoin_flows
g4: DAO Stablecoin Inflows
g5: DAO addresses + ERC20 transfers
scope: protocol:dao
returns:
- name: dao
  type: string
- name: total_volume
  type: number
- name: avg_tx
  type: number
inputs:
- key: stablecoins
  type: text
  label: Stablecoins
  default: USDC,USDT,DAI
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
