tool_id: defi.airdrop_potential_scorer
g1: defi
description: Ranks protocols by 30d users and tx volume.
g2: protocol
g3: airdrop_potential_scorer
g4: Airdrop Potential
g5: Ethereum Transactions
scope: generic
returns:
- name: contract_address
  type: string
- name: total_users_30d
  type: number
- name: total_tx_30d
  type: number
- name: airdrop_potential
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '30'
  required: false
- key: min_users
  type: number
  label: Min Users
  default: '500'
  required: false
