tool_id: defi.amm_pool_tvl_timeseries
g1: defi
description: Computes TVL, LP supply, and LP price for AMM pools over daily intervals.
g2: amm
g3: amm_pool_tvl_timeseries
g4: AMM pool TVL
g5: CoW AMM metrics
scope: protocol:CoW
returns:
- name: day
  type: date
- name: tvl
  type: number
- name: lp_supply
  type: number
- name: lp_price
  type: number
inputs:
- key: token_a
  type: text
  label: Token A symbol
  required: true
- key: token_b
  type: text
  label: Token B symbol
  required: true
- key: start
  type: date
  label: Start date
  required: true
