tool_id: defi.approval_spender_ranking
g1: defi
g2: wallet
g3: approval_spender_ranking
g4: Top Spenders by Approvals
g5: Approval Event Analysis
description: Ranks spenders by unique users approving specific tokens.
scope: generic
returns:
- name: token
  type: string
- name: spender
  type: string
- name: user_count
  type: number
- name: rank
  type: number
inputs:
- key: date_from
  label: Start Date
  type: date
  required: true
  default: '2023-12-01'
- key: top_n
  label: Top N
  type: number
  required: false
  default: '100'
