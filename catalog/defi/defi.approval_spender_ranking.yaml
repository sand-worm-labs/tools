tool_id: defi.approval_spender_ranking
g1: defi
description: Ranks spenders by unique users approving specific tokens.
g2: wallet
g3: approval_spender_ranking
g4: Top Spenders by Approvals
g5: Approval Event Analysis
scope: generic
returns:
- name: token
  type: string
- name: spender
  type: string
- name: user_count
  type: number
- name: rank
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '2023-12-01'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
