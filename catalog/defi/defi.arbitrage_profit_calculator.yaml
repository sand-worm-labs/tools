tool_id: defi.arbitrage_profit_calculator
g1: defi
description: Detects arbitrage profits from circular trades in same transaction.
g2: arb
g3: arbitrage_profit_calculator
g4: Arb Profit Detection
g5: dex.trades self-join
scope: generic
returns:
- name: tx_hash
  type: string
- name: profit
  type: number
- name: block_time
  type: timestamp
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
- key: min_profit
  type: number
  label: Min Profit USD
  default: '0'
  required: false
