tool_id: defi.arbitrage_txn_detector
g1: defi
g2: dex
g3: arbitrage_txn_detector
g4: Arb Txn Stats
g5: dex.trades CTEs
description: Detects arbitrage transactions via multi-trade txs.
scope: generic
returns:
- name: tx_hash
  type: string
- name: trade_count
  type: number
- name: profit_usd
  type: number
- name: projects
  type: string
inputs:
- key: chain
  label: Chain
  type: chain
  required: true
- key: min_trades
  label: Min Trades
  type: number
  required: false
  default: '2'
- key: date_from
  label: Start Date
  type: date
  required: true
