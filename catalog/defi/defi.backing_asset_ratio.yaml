tool_id: defi.backing_asset_ratio
g1: defi
description: Calculates price ratio from deposits to backing asset vs minted tokens.
g2: token
g3: backing_asset_ratio
g4: Mint vs deposit ratio
g5: ERC20 transfers + mint logs
scope: protocol:openeden
returns:
- name: datetime
  type: timestamp
- name: backing_deposit
  type: number
- name: minted
  type: number
- name: price_ratio
  type: number
inputs:
- key: deposit_address
  type: address
  label: Deposit address
  required: true
- key: mint_contract
  type: address
  label: Mint contract
  required: true
- key: backing_token
  type: address
  label: Backing token
  required: true
