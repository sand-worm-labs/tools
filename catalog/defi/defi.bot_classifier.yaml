tool_id: defi.bot_classifier
g1: defi
description: Classifies wallets as bots based on high swap frequency threshold.
g2: wallet
g3: bot_classifier
g4: Bot vs Human Traders
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: swaps
  type: number
- name: is_bot
  type: boolean
- name: bot_score
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: threshold_swaps
  type: number
  label: Bot Threshold
  default: '300'
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
