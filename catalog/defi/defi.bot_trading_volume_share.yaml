tool_id: defi.bot_trading_volume_share
g1: defi
description: Classifies trading volume as bot or non-bot based on monthly swap thresholds.
g2: bot
g3: bot_trading_volume_share
g4: Bot vs Human Volume
g5: Polygon Uniswap Trades
scope: protocol:uniswap
returns:
- name: day
  type: date
- name: bot_volume
  type: number
- name: human_volume
  type: number
- name: bot_share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: threshold
  type: number
  label: Bot Threshold
  default: '300'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
