tool_id: defi.bot_wallet_classifier
g1: defi
description: Classifies wallets as bots by average daily transactions.
g2: wallet
g3: bot_wallet_classifier
g4: Bot Detection Score
g5: Cumulative tx analysis
scope: generic
returns:
- name: wallet
  type: string
- name: avg_daily_txs
  type: number
- name: tx_count
  type: number
- name: is_bot
  type: boolean
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
- key: threshold
  type: number
  label: Bot Threshold
  default: '20'
  required: false
