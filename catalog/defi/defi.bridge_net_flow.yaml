tool_id: defi.bridge_net_flow
g1: defi
g2: bridge
g3: bridge_net_flow
g4: Bridge TVL Tracker
g5: Cumulative net token flow
description: Computes daily net inflows/outflows and cumulative TVL for bridge.
scope: generic
returns:
- name: date
  type: string
- name: net_flow
  type: number
- name: cumulative
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: bridge_address
  label: Bridge Address
  type: address
  required: true
- key: interval
  label: Interval
  type: text
  required: false
  default: day
