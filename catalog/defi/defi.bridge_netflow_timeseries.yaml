tool_id: defi.bridge_netflow_timeseries
g1: defi
description: Computes cumulative bridge deposits/withdrawals.
g2: bridge
g3: bridge_netflow_timeseries
g4: Bridge Flows
g5: ERC20 Transfers
scope: generic
returns:
- name: day
  type: date
- name: netflow
  type: number
- name: deposited
  type: number
- name: withdrawn
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: bridge_address
  type: address
  label: Bridge Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
