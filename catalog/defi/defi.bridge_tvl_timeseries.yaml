tool_id: defi.bridge_tvl_timeseries
g1: defi
description: Tracks cumulative net USD stablecoin TVL bridged via deposit/withdrawal
  flows.
g2: bridge
g3: bridge_tvl_timeseries
g4: Bridge TVL
g5: Bridge Deposit/Withdraw Flows
scope: generic
returns:
- name: date
  type: date
- name: deposits
  type: number
- name: withdrawals
  type: number
- name: net_tvl
  type: number
inputs:
- key: bridge_address
  type: address
  label: Bridge Address
  required: true
- key: contract_address
  type: address
  label: Contract Address
  default: USDC
  required: false
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
