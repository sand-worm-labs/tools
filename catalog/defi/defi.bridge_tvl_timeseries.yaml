tool_id: defi.bridge_tvl_timeseries
g1: defi
g2: bridge
g3: bridge_tvl_timeseries
g4: Bridge TVL
g5: Bridge Deposit/Withdraw Flows
description: Tracks cumulative net USD stablecoin TVL bridged via deposit/withdrawal flows.
scope: generic
returns:
- name: date
  type: string
- name: deposits
  type: number
- name: withdrawals
  type: number
- name: net_tvl
  type: number
inputs:
- key: bridge_address
  label: Bridge Address
  type: address
  required: true
- key: contract_address
  label: Contract Address
  type: address
  required: false
  default: USDC
- key: interval
  label: Interval
  type: text
  required: false
  default: day
