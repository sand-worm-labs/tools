tool_id: defi.closed_loop_arb_ratio
g1: defi
description: Measures closed-loop arbitrage ratio on targeted DEX trades.
g2: arb
g3: closed_loop_arb_ratio
g4: Arb ratio specific pool
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: tx_hash
  type: string
- name: cnt
  type: number
- name: arb_ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
