tool_id: defi.cohort_retention_churn
g1: defi
g2: dex
g3: cohort_retention_churn
g4: Monthly churn rate
g5: Dune dex.trades cohorts
description: Calculates cohort retention and churn rates for DEX users.
scope: protocol:0x
returns:
- name: cohort
  type: month
- name: retention_rate
  type: number
- name: churn_rate
  type: number
- name: cohort_size
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
  default: 0x
- key: chain
  label: Chain
  type: chain
  required: true
  default: ethereum
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
