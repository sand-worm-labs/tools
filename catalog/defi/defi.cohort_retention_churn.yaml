tool_id: defi.cohort_retention_churn
g1: defi
description: Calculates cohort retention and churn rates for DEX users.
g2: dex
g3: cohort_retention_churn
g4: Monthly churn rate
g5: Dune dex.trades cohorts
scope: protocol:0x
returns:
- name: cohort
  type: month
- name: retention_rate
  type: number
- name: churn_rate
  type: number
- name: cohort_size
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: 0x
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
