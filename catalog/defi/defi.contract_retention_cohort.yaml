tool_id: defi.contract_retention_cohort
g1: defi
description: Tracks cohort retention for contract-interacting users over periods.
g2: wallet
g3: contract_retention_cohort
g4: User Retention Rates
g5: Transaction cohorts
scope: generic
returns:
- name: cohort_date
  type: date
- name: retention_rate
  type: number
- name: retained_users
  type: number
- name: total_cohort
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: true
