tool_id: defi.copy_trade_detector
g1: defi
g2: dex
g3: copy_trade_detector
g4: Copycat Patterns
g5: Ethereum new tokens
description: Detects copycat trades on new tokens.
scope: generic
returns:
- name: leader_wallet
  type: string
- name: copycats
  type: number
- name: avg_delay
  type: number
inputs:
- key: chain
  label: Chain
  type: chain
  required: true
  default: ethereum
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '1'
- key: min_trades
  label: Min Copies
  type: number
  required: false
  default: '5'
