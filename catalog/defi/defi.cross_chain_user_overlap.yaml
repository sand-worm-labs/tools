tool_id: defi.cross_chain_user_overlap
g1: defi
description: Counts users trading on primary chain also on others.
g2: dex
g3: cross_chain_user_overlap
g4: Multi-Chain Users
g5: Dune dex.trades join
scope: protocol:uniswap
returns:
- name: chain_combination
  type: string
- name: total_users
  type: number
inputs:
- key: primary_chain
  type: chain
  label: Primary Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
