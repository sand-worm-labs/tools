tool_id: defi.cumulative_staker_count
g1: defi
description: Counts first-time depositors to beacon chain and cumulative total.
g2: staking
g3: cumulative_staker_count
g4: Unique stakers
g5: Beacon deposit traces
scope: protocol:BeaconChain
returns:
- name: time
  type: timestamp
- name: unique_stakers
  type: number
- name: cum_validators
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
