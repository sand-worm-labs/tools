tool_id: defi.daily_net_flow
g1: defi
description: Computes daily net SOL inflow/outflow for protocol.
g2: wallet
g3: daily_net_flow
g4: Daily Net SOL Flow
g5: Deposits minus withdrawals
scope: generic
returns:
- name: day
  type: date
- name: net_sol
  type: number
- name: deposits
  type: number
- name: withdrawals
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
