tool_id: defi.dao_app_events_count
g1: defi
description: Counts DAO app events by app name and month.
g2: dao
g3: dao_app_events_count
g4: App Events Monthly
g5: Aragon Client Polygon
scope: protocol:aragon
returns:
- name: dao_address
  type: string
- name: app_name
  type: string
- name: month
  type: date
- name: event_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: polygon
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: dao_address
  type: address
  label: DAO Address
  required: false
- key: app_name
  type: text
  label: App Name
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
