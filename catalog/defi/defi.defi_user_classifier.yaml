tool_id: defi.defi_user_classifier
g1: defi
description: Classifies wallets as defi_user or normal based on volume and tx count.
g2: wallet
g3: defi_user_classifier
g4: User Activity Segments
g5: Dune dex.trades
scope: generic
returns:
- name: label
  type: string
- name: total_volume
  type: number
- name: tx_cnt
  type: number
- name: bot_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  default: '2024-01-01'
  required: true
- key: volume_threshold
  type: number
  label: Volume Threshold USD
  default: '100000'
  required: false
