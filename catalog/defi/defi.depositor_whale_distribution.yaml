tool_id: defi.depositor_whale_distribution
g1: defi
g2: bridge
g3: depositor_whale_distribution
g4: Bridge Whale Buckets
g5: Depositor Size Ranges
description: Distributes bridge depositors into ETH value buckets for whale analysis.
scope: protocol:bridge
returns:
- name: bucket
  type: string
- name: wallet_count
  type: number
- name: total_eth
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: min_usd
  label: Min USD
  type: number
  required: false
  default: '100'
