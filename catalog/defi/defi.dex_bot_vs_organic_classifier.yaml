tool_id: defi.dex_bot_vs_organic_classifier
g1: defi
description: Classifies trades as bot or organic with volume and count breakdown.
g2: dex
g3: dex_bot_vs_organic_classifier
g4: Bot vs Organic Volume
g5: Dune dex.trades + bot labels
scope: generic
returns:
- name: label
  type: string
- name: number_of_trades
  type: number
- name: total_trade_volume_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: pool_address
  type: address
  label: Pool Address
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
