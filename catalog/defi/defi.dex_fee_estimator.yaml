tool_id: defi.dex_fee_estimator
g1: defi
description: Estimates daily fees for DEX protocols by applying known fee rates to
  trade volumes.
g2: dex
g3: dex_fee_estimator
g4: Protocol fee estimation
g5: Dune dex.trades
scope: generic
returns:
- name: block_date
  type: date
- name: project
  type: string
- name: total_daily_fees_usd
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: days_back
  type: number
  label: Days back
  default: '7'
  required: false
