tool_id: defi.dex_high_turnover_median_trades
g1: defi
description: Median trade sizes for wallets exceeding turnover threshold.
g2: dex
g3: dex_high_turnover_median_trades
g4: High Turnover Medians
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: median_usd
  type: number
- name: bucket
  type: string
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '10000'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
