tool_id: defi.dex_internalization_rate
g1: defi
description: Ranks top pools by volume and computes internalization ratios.
g2: dex
g3: dex_internalization_rate
g4: Internal vs External Volume
g5: dex.trades pool ranking
scope: generic
returns:
- name: pool_address
  type: string
- name: total_volume
  type: number
- name: internalization_rate
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_date
  type: date
  label: Start Date
  required: false
