tool_id: defi.dex_lp_activity
g1: defi
description: Aggregates LP mint/burn events across DEX protocols.
g2: dex
g3: dex_lp_activity
g4: LP Events
g5: Balancer Curve logs
scope: generic
returns:
- name: date
  type: date
- name: lp_mints
  type: number
- name: lp_burns
  type: number
- name: unique_lpers
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: balancer
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
