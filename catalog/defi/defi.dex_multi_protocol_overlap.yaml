tool_id: defi.dex_multi_protocol_overlap
g1: defi
description: Counts unique traders across multiple DEX protocols with overlaps.
g2: dex
g3: dex_multi_protocol_overlap
g4: Multi-DEX User Overlap
g5: Dune dex.trades
scope: generic
returns:
- name: total_traders
  type: number
- name: protocol1_traders
  type: number
- name: protocol2_traders
  type: number
- name: protocol3_traders
  type: number
- name: protocol4_traders
  type: number
inputs:
- key: protocols
  type: text
  label: Protocols
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
