tool_id: defi.dex_new_returning_mau
g1: defi
description: Classifies monthly new vs returning active users for DEX.
g2: dex
g3: dex_new_returning_mau
g4: New Returning MAU
g5: Cohort user analysis
scope: generic
returns:
- name: month
  type: date
- name: new_users
  type: number
- name: returning_users
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
