tool_id: defi.dex_new_returning_traders
g1: defi
description: Computes daily new and returning traders.
g2: dex
g3: dex_new_returning_traders
g4: New vs Returning
g5: dex.trades CTEs
scope: generic
returns:
- name: time
  type: timestamp
- name: new
  type: number
- name: returning
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
