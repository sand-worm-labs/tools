tool_id: defi.dex_new_returning_users
g1: defi
description: Computes new versus returning users over time.
g2: wallet
g3: dex_new_returning_users
g4: User Cohort Breakdown
g5: Dune query 626817
scope: generic
returns:
- name: period
  type: string
- name: new_users
  type: number
- name: returning_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: false
