tool_id: defi.dex_new_traders_daily
g1: defi
description: Counts daily new traders by DEX using first trade detection.
g2: dex
g3: dex_new_traders_daily
g4: New traders by DEX
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: project
  type: string
- name: new_traders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '180'
  required: true
