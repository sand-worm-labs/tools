tool_id: defi.dex_new_user_cohort
g1: defi
description: Counts new users per period by first trade date and protocol.
g2: dex
g3: dex_new_user_cohort
g4: New User Onboarding
g5: Dune dex.trades CTEs
scope: generic
returns:
- name: time
  type: timestamp
- name: protocol
  type: string
- name: new_user_count
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: protocol
  type: text
  label: Protocol
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
