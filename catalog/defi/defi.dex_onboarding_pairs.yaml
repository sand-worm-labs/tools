tool_id: defi.dex_onboarding_pairs
g1: defi
description: Identifies pairs used in users' first trades.
g2: dex
g3: dex_onboarding_pairs
g4: First Trade Pairs
g5: Dune dex.trades
scope: generic
returns:
- name: token_pair
  type: string
- name: num_users
  type: number
- name: avg_size
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: true
