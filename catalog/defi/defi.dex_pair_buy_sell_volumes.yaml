tool_id: defi.dex_pair_buy_sell_volumes
g1: defi
description: Aggregates buy and sell volumes for top token pairs.
g2: dex
g3: dex_pair_buy_sell_volumes
g4: Pair buy/sell volumes
g5: Dune dex.trades pairs
scope: generic
returns:
- name: pair
  type: string
- name: buy_vol
  type: number
- name: sell_vol
  type: number
- name: total_vol
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: false
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
