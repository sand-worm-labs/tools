tool_id: defi.dex_project_chain_market_share
g1: defi
description: Computes project transaction count and volume market shares within each
  chain.
g2: dex
g3: dex_project_chain_market_share
g4: Project Shares
g5: dex.trades CTE window
scope: generic
returns:
- name: blockchain
  type: string
- name: project
  type: string
- name: txn_share
  type: number
- name: volume_share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
