tool_id: defi.dex_protocol_benchmark
g1: defi
description: Benchmarks DEX protocols by trades, volume, avg size, pairs.
g2: dex
g3: dex_protocol_benchmark
g4: DEX Performance Metrics
g5: Dune dex.trades
scope: generic
returns:
- name: project
  type: string
- name: total_trades
  type: number
- name: total_volume
  type: number
- name: avg_trade
  type: number
- name: token_pairs
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '1825'
  required: false
