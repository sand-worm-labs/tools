tool_id: defi.dex_token_category_flows
g1: defi
description: Classifies DEX buys into narrative cohorts like restaking or bitcoin.
g2: token
g3: dex_token_category_flows
g4: Narrative Token Flows
g5: Dune dex.trades
scope: generic
returns:
- name: narrative
  type: string
- name: new_users
  type: number
- name: returning_users
  type: number
- name: volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
