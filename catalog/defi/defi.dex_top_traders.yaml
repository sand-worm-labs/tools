tool_id: defi.dex_top_traders
g1: defi
description: Ranks traders by total volume with relative shares.
g2: dex
g3: dex_top_traders
g4: Trader Volume Ranking
g5: Uniswap V2 trades
scope: protocol:Uniswap
returns:
- name: trader
  type: string
- name: num_fills
  type: number
- name: total_volume
  type: number
- name: rank
  type: number
- name: relative_share
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: Uniswap
  required: true
- key: version
  type: text
  label: Version
  default: v2
  required: false
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: true
- key: date_to
  type: date
  label: End Date
  required: false
