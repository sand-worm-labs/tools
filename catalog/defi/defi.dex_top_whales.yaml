tool_id: defi.dex_top_whales
g1: defi
description: Ranks top whale traders by transaction volume.
g2: dex
g3: dex_top_whales
g4: Top Whale Traders
g5: Dune dex.trades
scope: generic
returns:
- name: address
  type: string
- name: tx_count
  type: number
- name: volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '100000'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: true
- key: protocol
  type: text
  label: Protocol
  required: false
