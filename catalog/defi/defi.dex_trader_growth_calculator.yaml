tool_id: defi.dex_trader_growth_calculator
g1: defi
description: Computes % growth in unique active traders.
g2: dex
g3: dex_trader_growth_calculator
g4: Active trader growth
g5: dex.trades multi-period
scope: generic
returns:
- name: project
  type: string
- name: growth_pct
  type: number
- name: active_traders_current
  type: number
- name: active_traders_previous
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_months
  type: number
  label: Lookback months
  default: '12'
  required: true
