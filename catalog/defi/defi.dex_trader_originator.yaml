tool_id: defi.dex_trader_originator
g1: defi
description: Classifies traders by aggregator or direct origin.
g2: dex
g3: dex_trader_originator
g4: Trader Aggregator Share
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: originator
  type: string
- name: traders
  type: number
- name: trader_pct
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
