tool_id: defi.dex_trader_size_classification
g1: defi
g2: dex
g3: dex_trader_size_classification
g4: Trader Size Distribution
g5: Dune dex.trades
description: Classifies traders by daily volume into small, medium, whale with volume shares.
scope: generic
returns:
- name: time
  type: string
- name: small_trader_volume
  type: number
- name: medium_trader_volume
  type: number
- name: whale_volume
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
- key: threshold_small
  label: Small Threshold USD
  type: number
  required: false
  default: '10000'
- key: threshold_medium
  label: Medium Threshold USD
  type: number
  required: false
  default: '100000'
