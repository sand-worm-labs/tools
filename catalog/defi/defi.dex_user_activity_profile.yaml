tool_id: defi.dex_user_activity_profile
g1: defi
description: Profiles users by daily tx count, success, power users.
g2: dex
g3: dex_user_activity_profile
g4: User Activity Metrics
g5: DEX Transactions
scope: protocol:orca
returns:
- name: day
  type: date
- name: tx_count
  type: number
- name: unique_users
  type: number
- name: power_user_count
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: orca
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
