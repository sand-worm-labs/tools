tool_id: defi.dex_user_churn
g1: defi
g2: dex
g3: dex_user_churn
g4: Churn to Competitors
g5: Dune dex.trades churn
description: Detects users lost to competitor protocols.
scope: generic
returns:
- name: lost_users
  type: number
- name: competitor_activity
  type: number
- name: churn_rate
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
- key: chain
  label: Chain
  type: chain
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '30'
