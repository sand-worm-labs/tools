tool_id: defi.dex_user_cohort
g1: defi
description: Computes new and returning traders over time periods.
g2: dex
g3: dex_user_cohort
g4: New/Returning Users
g5: Dune dex.trades
scope: generic
returns:
- name: period
  type: string
- name: new_users
  type: number
- name: returning_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: contract_address
  type: address
  label: Contract Address
  required: false
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
