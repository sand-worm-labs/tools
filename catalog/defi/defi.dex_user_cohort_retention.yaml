tool_id: defi.dex_user_cohort_retention
g1: defi
description: Computes retention rates for user cohorts by first trade period.
g2: wallet
g3: dex_user_cohort_retention
g4: User retention cohorts
g5: First-trade cohort analysis
scope: generic
returns:
- name: cohort
  type: string
- name: period
  type: string
- name: retention_rate
  type: number
- name: active_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: cohort_interval
  type: select
  label: Cohort Interval
  default: month
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
