tool_id: defi.dex_user_protocol_overlap
g1: defi
description: Computes overlap of users between source and target DEX, flagging prior
  experience.
g2: dex
g3: dex_user_protocol_overlap
g4: User Overlap %
g5: Cross-DEX cohort join
scope: generic
returns:
- name: overlap_pct
  type: number
- name: source_users
  type: number
- name: target_users
  type: number
inputs:
- key: source_protocol
  type: text
  label: Source DEX
  required: true
- key: target_protocol
  type: text
  label: Target DEX
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
