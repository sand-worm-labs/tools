tool_id: defi.dex_volume_growth
g1: defi
description: Calculates daily/weekly volume with WoW/DoD growth rates.
g2: dex
g3: dex_volume_growth
g4: Volume Growth Metrics
g5: Dune dex.trades
scope: generic
returns:
- name: time
  type: timestamp
- name: volume
  type: number
- name: growth_pct
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: false
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
