tool_id: defi.dex_volume_market_share
g1: defi
description: Computes volume and market share between DEX protocols over time.
g2: dex
g3: dex_volume_market_share
g4: DEX Volume Share
g5: Multi-chain trades
scope: generic
returns:
- name: period
  type: string
- name: volume_protocol1
  type: number
- name: volume_protocol2
  type: number
- name: pct
  type: number
inputs:
- key: protocol1
  type: text
  label: First Protocol
  default: sushiswap
  required: true
- key: protocol2
  type: text
  label: Second Protocol
  default: uniswap
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
