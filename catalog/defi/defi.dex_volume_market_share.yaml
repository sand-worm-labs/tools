tool_id: defi.dex_volume_market_share
g1: defi
g2: dex
g3: dex_volume_market_share
g4: DEX Volume Share
g5: Multi-chain trades
description: Computes volume and market share between DEX protocols over time.
scope: generic
returns:
- name: period
  type: string
- name: volume_protocol1
  type: number
- name: volume_protocol2
  type: number
- name: pct
  type: number
inputs:
- key: protocol1
  label: First Protocol
  type: text
  required: true
  default: sushiswap
- key: protocol2
  label: Second Protocol
  type: text
  required: true
  default: uniswap
- key: chain
  label: Chain
  type: chain
  required: true
  default: ethereum
- key: date
  label: Date
  type: date_range
  required: false
