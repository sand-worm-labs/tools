tool_id: defi.dex_volume_moving_average
g1: defi
description: Computes daily volume with 7/14/28-day moving averages for trends.
g2: dex
g3: dex_volume_moving_average
g4: Volume Moving Averages
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: daily_volume
  type: number
- name: ma7
  type: number
- name: ma14
  type: number
- name: ma28
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
