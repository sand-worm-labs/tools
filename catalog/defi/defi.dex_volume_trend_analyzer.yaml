tool_id: defi.dex_volume_trend_analyzer
g1: defi
description: Detects volume trends using rolling averages.
g2: dex
g3: dex_volume_trend_analyzer
g4: Volume Trends
g5: dex_solana.trades
scope: generic
returns:
- name: day
  type: date
- name: total_volume
  type: number
- name: rolling_7d_avg
  type: number
- name: rolling_30d_avg
  type: number
inputs:
- key: lookback_months
  type: number
  label: Lookback Months
  default: '12'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
