tool_id: defi.dex_volume_volatility
g1: defi
description: Calculates annualized volatility of daily trading volume for pair.
g2: dex
g3: dex_volume_volatility
g4: Trading Volume Volatility
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: daily_volume
  type: number
- name: volatility
  type: number
inputs:
- key: token_pair
  type: text
  label: Token Pair
  default: WBTC-USDC
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
