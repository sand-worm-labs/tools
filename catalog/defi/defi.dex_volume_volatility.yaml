tool_id: defi.dex_volume_volatility
g1: defi
g2: dex
g3: dex_volume_volatility
g4: Trading Volume Volatility
g5: Dune dex.trades
description: Calculates annualized volatility of daily trading volume for pair.
scope: generic
returns:
- name: day
  type: string
- name: daily_volume
  type: number
- name: volatility
  type: number
inputs:
- key: token_pair
  label: Token Pair
  type: text
  required: true
  default: WBTC-USDC
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
