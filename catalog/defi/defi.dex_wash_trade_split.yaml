tool_id: defi.dex_wash_trade_split
g1: defi
description: Splits trader volume into wash (multi-swaps per tx/token) vs clean using
  threshold.
g2: dex
g3: dex_wash_trade_split
g4: Wash vs Clean Volume
g5: dex.trades celo
scope: generic
returns:
- name: tx_from
  type: string
- name: volume
  type: number
- name: wash_label
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  default: celo
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: threshold
  type: number
  label: Wash Threshold
  default: '1'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
