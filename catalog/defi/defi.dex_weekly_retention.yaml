tool_id: defi.dex_weekly_retention
g1: defi
g2: dex
g3: dex_weekly_retention
g4: Weekly User Retention
g5: Dune dex.trades
description: Measures weekly new user retention to next week on DEX.
scope: protocol:pancakeswap
returns:
- name: week
  type: string
- name: retention_rate
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
  default: pancakeswap
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
