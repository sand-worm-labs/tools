tool_id: defi.dex_whale_leaderboard
g1: defi
g2: dex
g3: dex_whale_leaderboard
g4: Whale Transaction Ranks
g5: High-value trade leaders
description: Ranks top wallets by large trade count and volume.
scope: generic
returns:
- name: wallet_address
  type: string
- name: trade_count
  type: number
- name: total_volume_usd
  type: number
- name: avg_trade_usd
  type: number
inputs:
- key: chain
  label: Chain
  type: chain
  required: false
- key: min_usd
  label: Min USD
  type: number
  required: false
  default: '1000000'
- key: top_n
  label: Top N
  type: number
  required: false
  default: '20'
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '30'
