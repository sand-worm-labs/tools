tool_id: defi.dex_whale_volume_share
g1: defi
description: Measures whale (top volume traders) share of total DEX volume.
g2: dex
g3: dex_whale_volume_share
g4: Whale Volume Percentage
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: period
  type: string
- name: whale_pct
  type: number
- name: whale_volume
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
