tool_id: defi.first_interaction_cohort
g1: defi
description: Weekly new users by first tx date to contract with cumulative.
g2: holders
g3: first_interaction_cohort
g4: New user cohorts
g5: First tx analysis
scope: generic
returns:
- name: week
  type: date
- name: new_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: method_id
  type: text
  label: Method sig
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
