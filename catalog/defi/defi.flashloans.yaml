scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol
  type: select
  label: Protocol
  default: all
  options:
  - label: All
    value: all
  - label: Aave V3
    value: aave_v3
  - label: Aave V2
    value: aave_v2
  - label: Balancer
    value: balancer
  - label: dYdX
    value: dydx
  required: true
- key: days
  type: select
  label: Time range
  default: '7'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
