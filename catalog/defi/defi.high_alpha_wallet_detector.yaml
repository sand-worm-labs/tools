tool_id: defi.high_alpha_wallet_detector
g1: defi
description: Detects wallets with high trade frequency, activity days, volume, and
  token diversity.
g2: wallet
g3: high_alpha_wallet_detector
g4: Active High-Volume Wallets
g5: dex_solana.trades HAVING filters
scope: generic
returns:
- name: wallet_address
  type: string
- name: trade_count
  type: number
- name: active_days
  type: number
- name: volume_usd
  type: number
- name: token_diversity
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: true
- key: min_trades
  type: number
  label: Min Trades
  default: '100'
  required: false
- key: min_volume_usd
  type: number
  label: Min Volume USD
  default: '10000'
  required: false
