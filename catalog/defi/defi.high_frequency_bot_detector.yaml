tool_id: defi.high_frequency_bot_detector
g1: defi
g2: wallet
g3: high_frequency_bot_detector
g4: Bot Activity Score
g5: dex_solana.trades
description: Detects potential bots by high trade counts and volume in short periods.
scope: generic
returns:
- name: trader_id
  type: string
- name: trade_count
  type: number
- name: total_volume
  type: number
- name: bot_score
  type: number
inputs:
- key: date_from
  label: Start Date
  type: date
  required: true
- key: threshold_count
  label: Min Trades
  type: number
  required: false
  default: '100'
