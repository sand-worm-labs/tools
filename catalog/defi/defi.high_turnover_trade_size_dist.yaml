tool_id: defi.high_turnover_trade_size_dist
g1: defi
description: Buckets avg trade sizes for high-turnover wallets on pool.
g2: dex
g3: high_turnover_trade_size_dist
g4: Trade Size Dist
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: bucket_size
  type: number
- name: trader_count
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: true
