tool_id: defi.hold_time_distribution
g1: defi
g2: wallet
g3: hold_time_distribution
g4: Average Hold Duration
g5: Dune dex.trades
description: Calculates average hold time from first buy to first sell per wallet per token.
scope: generic
returns:
- name: avg_hold_days
  type: number
- name: median_hold_days
  type: number
- name: wallet_count
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: chain
  label: Chain
  type: chain
  required: true
  default: ethereum
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '90'
