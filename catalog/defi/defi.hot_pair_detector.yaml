tool_id: defi.hot_pair_detector
g1: defi
description: Identifies newly launched pairs with rapid multi-user trading within
  hours.
g2: dex
g3: hot_pair_detector
g4: Hot Pairs Activity
g5: dex.trades window analysis
scope: generic
returns:
- name: project_contract_address
  type: string
- name: min_block_time
  type: timestamp
- name: unique_takers
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_hours
  type: number
  label: Activity Window (hours)
  default: '5'
  required: false
