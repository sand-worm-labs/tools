tool_id: defi.hourly_volume_anomaly_detector
g1: defi
g2: dex
g3: hourly_volume_anomaly_detector
g4: Hourly Volume vs Avg
g5: dex_solana.trades
description: Compares current hourly volume to 3-month weekday average.
scope: protocol:raydium
returns:
- name: hour
  type: number
- name: avg_hourly_volume
  type: number
- name: today_volume
  type: number
- name: anomaly_ratio
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
  default: raydium
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '90'
