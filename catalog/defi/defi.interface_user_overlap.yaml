tool_id: defi.interface_user_overlap
g1: defi
description: Compares unique users across DEX routers/interfaces.
g2: dex
g3: interface_user_overlap
g4: User Overlap Metrics
g5: DEX trades table
scope: generic
returns:
- name: router
  type: string
- name: unique_users
  type: number
- name: overlap
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
