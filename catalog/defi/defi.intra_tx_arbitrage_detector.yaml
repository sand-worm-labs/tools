tool_id: defi.intra_tx_arbitrage_detector
g1: defi
description: Identifies arbitrage cycles within transactions.
g2: mev
g3: intra_tx_arbitrage_detector
g4: Arbitrage Trades
g5: Dune dex.trades self-join
scope: generic
returns:
- name: tx_hash
  type: string
- name: projects
  type: string
- name: token_flow
  type: string
- name: arb_profit
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: false
