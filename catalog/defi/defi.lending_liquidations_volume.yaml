tool_id: defi.lending_liquidations_volume
g1: defi
description: Sums liquidation volume by token and protocol.
g2: lending
g3: lending_liquidations_volume
g4: Lending Liquidations Volume
g5: Protocol liq. by token
scope: protocol:solend
returns:
- name: token_mint
  type: string
- name: volume
  type: number
- name: tx_count
  type: number
inputs:
- key: protocol
  type: text
