tool_id: defi.lp_action_classifier
g1: defi
g2: lp
g3: lp_action_classifier
g4: Liquidity Provider Actions
g5: tokens_solana.transfers
description: Classifies wallet interactions as add/remove liquidity based on instruction indices.
scope: protocol:meteora
returns:
- name: wallet
  type: string
- name: action_type
  type: string
- name: amount
  type: number
- name: count
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
  default: meteora
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '7'
