tool_id: defi.lp_pool_asset_proportions
g1: defi
description: Tracks asset balances and proportions in LP pool over time.
g2: lp
g3: lp_pool_asset_proportions
g4: Asset Proportions
g5: ERC20 transfers
scope: generic
returns:
- name: time
  type: timestamp
- name: asset
  type: string
- name: balance
  type: number
- name: proportion
  type: number
- name: total
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: asset_addresses
  type: address[]
  label: Asset Addresses
  default: []
  required: false
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
