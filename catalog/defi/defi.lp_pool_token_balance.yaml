tool_id: defi.lp_pool_token_balance
g1: defi
g2: lp
g3: lp_pool_token_balance
g4: Pool Token Flows
g5: Inflow outflow tracking
description: Tracks net token flows into LP pools over time.
scope: generic
returns:
- name: time
  type: datetime
- name: token
  type: string
- name: netflow
  type: number
- name: cumulative
  type: number
inputs:
- key: pool_address
  label: Pool Address
  type: address
  required: true
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: interval
  label: Interval
  type: text
  required: false
  default: day
