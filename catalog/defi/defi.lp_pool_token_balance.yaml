tool_id: defi.lp_pool_token_balance
g1: defi
description: Tracks net token flows into LP pools over time.
g2: lp
g3: lp_pool_token_balance
g4: Pool Token Flows
g5: Inflow outflow tracking
scope: generic
returns:
- name: time
  type: datetime
- name: token
  type: string
- name: netflow
  type: number
- name: cumulative
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
