tool_id: defi.mev_sandwich
g1: defi
description: Sandwich attack events — victim transactions, attacker addresses, and
  profit.
g2: sandwich
g3: mev_sandwich
g4: MEV — sandwich attacks
g5: Sandwich attack detection
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: victim_address
  type: address
  label: Filter by victim (optional)
  required: false
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '7'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
