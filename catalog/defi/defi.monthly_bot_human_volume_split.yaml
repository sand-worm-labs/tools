tool_id: defi.monthly_bot_human_volume_split
g1: defi
description: Splits monthly DEX volume by bot (>1000 trades/month) vs human.
g2: wallet
g3: monthly_bot_human_volume_split
g4: Bot/Human Volume
g5: Dune dex.trades
scope: generic
returns:
- name: month
  type: date
- name: bot_volume
  type: number
- name: human_volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
