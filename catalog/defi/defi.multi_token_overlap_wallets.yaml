tool_id: defi.multi_token_overlap_wallets
g1: defi
description: Finds wallets buying multiple tokens in specified time windows.
g2: identity
g3: multi_token_overlap_wallets
g4: Overlapping Token Traders
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: overlap_count
  type: number
- name: tokens
  type: string
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: start_time
  type: date
  label: Window Start
  required: true
- key: end_time
  type: date
  label: Window End
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '0'
  required: false
