tool_id: defi.narrative_volume_rank
g1: defi
description: Ranks trading volume by narrative categories using symbol mappings.
g2: dex
g3: narrative_volume_rank
g4: Narrative ranks
g5: dex_solana.trades
scope: generic
returns:
- name: narrative
  type: string
- name: week
  type: date
- name: volume_usd
  type: number
- name: rank
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
