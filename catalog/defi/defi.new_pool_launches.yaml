tool_id: defi.new_pool_launches
g1: defi
description: Counts new liquidity pools launched weekly by project.
g2: dex
g3: new_pool_launches
g4: Weekly New Pools
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: week
  type: date
- name: project
  type: string
- name: new_pools
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: chain
  type: chain
  label: Chain
  default: base
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
