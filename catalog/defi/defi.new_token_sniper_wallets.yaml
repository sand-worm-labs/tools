tool_id: defi.new_token_sniper_wallets
g1: defi
description: Detects wallets buying/selling new tokens above volume threshold post-launch.
g2: dex
g3: new_token_sniper_wallets
g4: Launch Snipers & Volumes
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: tokens_bought
  type: number
- name: usd_bought
  type: number
- name: tokens_sold
  type: number
- name: usd_sold
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: day_ago
  type: number
  label: Days Since Launch
  default: '1'
  required: true
- key: min_volume_usd
  type: number
  label: Min Launch Volume
  default: '30000'
  required: true
