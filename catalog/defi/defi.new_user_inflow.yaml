tool_id: defi.new_user_inflow
g1: defi
description: Identifies new protocol users with prior activity on competitors.
g2: dex
g3: new_user_inflow
g4: Competitor Inflow
g5: Prior activity check
scope: protocol:pancakeswap
returns:
- name: tx_from
  type: string
- name: prior_project
  type: string
- name: prior_tx_count
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  default: base
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: false
