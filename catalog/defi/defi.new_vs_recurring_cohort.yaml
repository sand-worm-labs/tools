tool_id: defi.new_vs_recurring_cohort
g1: defi
description: Classifies new vs recurring users by first trade date with cohort volumes.
g2: wallet
g3: new_vs_recurring_cohort
g4: user retention cohorts
g5: first trade join analysis
scope: protocol:pumpdotfun
returns:
- name: day
  type: date
- name: new_users
  type: number
- name: recurring_users
  type: number
- name: total_volume
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
