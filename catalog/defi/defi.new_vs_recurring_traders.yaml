tool_id: defi.new_vs_recurring_traders
g1: defi
description: Classifies hourly trader activity as new or recurring based on first
  trade timestamp.
g2: wallet
g3: new_vs_recurring_traders
g4: Trader Cohort Metrics
g5: dex_solana.trades
scope: generic
returns:
- name: hour
  type: timestamp
- name: trader_id
  type: string
- name: first_trade_hour
  type: timestamp
- name: buy_usd_vol
  type: number
- name: num_transactions
  type: number
- name: is_new
  type: boolean
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
