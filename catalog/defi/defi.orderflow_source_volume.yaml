tool_id: defi.orderflow_source_volume
g1: defi
description: Aggregates volume by classified orderflow sources.
g2: dex
g3: orderflow_source_volume
g4: Source Aggregated Volume
g5: Dune queries 2552495,2970509
scope: generic
returns:
- name: source
  type: string
- name: volume
  type: number
- name: trade_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: false
