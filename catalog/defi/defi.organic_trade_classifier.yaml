tool_id: defi.organic_trade_classifier
g1: defi
description: Classifies trades as organic or bot/HFT using flip windows, trade frequency,
  and speed.
g2: wallet
g3: organic_trade_classifier
g4: Bot vs organic
g5: Dune dex_solana.trades
scope: generic
returns:
- name: trader_id
  type: string
- name: bot_score
  type: number
- name: classification
  type: string
- name: flip_count
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: true
- key: min_trade_usd
  type: number
  label: Min trade USD
  default: '1.0'
  required: false
