tool_id: defi.perp_trader_stats
g1: defi
description: Aggregates volume and tx count per trader to derive average trade size.
g2: perp
g3: perp_trader_stats
g4: Trader Metrics
g5: GMX Position Events
scope: protocol:gmx
returns:
- name: trader
  type: string
- name: avg_trade_size
  type: number
- name: total_txns
  type: number
- name: total_volume
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: gmx
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
