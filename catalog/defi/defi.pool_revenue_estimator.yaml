tool_id: defi.pool_revenue_estimator
g1: defi
g2: lp
g3: pool_revenue_estimator
g4: LP Revenue Projection
g5: Dune dex.trades fee calc
description: Estimates daily and cumulative pool revenue from volume and fee rate.
scope: generic
returns:
- name: day
  type: string
- name: daily_volume
  type: number
- name: daily_revenue
  type: number
- name: cumulative_revenue
  type: number
inputs:
- key: pool_address
  label: Pool Address
  type: address
  required: true
- key: fee_rate
  label: Fee Rate
  type: number
  required: true
  default: '0.0005'
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '90'
