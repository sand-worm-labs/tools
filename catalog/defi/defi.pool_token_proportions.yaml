tool_id: defi.pool_token_proportions
g1: defi
description: Computes cumulative balances and ratios for LP pool tokens over time.
g2: lp
g3: pool_token_proportions
g4: LP token ratios
g5: Cumulative pool balances
scope: generic
returns:
- name: time
  type: timestamp
- name: ratio
  type: number
- name: ideal
  type: number
inputs:
