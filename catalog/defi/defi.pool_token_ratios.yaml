tool_id: defi.pool_token_ratios
g1: defi
description: Tracks cumulative balances and ratios for multi-token pools.
g2: lp
g3: pool_token_ratios
g4: Pool balance composition
g5: ERC20 transfers
scope: protocol:curve
returns:
- name: time
  type: date
- name: token1
  type: number
- name: token2
  type: number
- name: token1_pct
  type: number
- name: token2_pct
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: token1_address
  type: address
  label: Token1 Address
  required: true
- key: token2_address
  type: address
  label: Token2 Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
