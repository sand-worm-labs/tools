tool_id: defi.pool_tvl
g1: defi
description: Total value locked in a specific liquidity pool over time.
g2: lp
g3: pool_tvl
g4: Pool TVL history
g5: Pool deposit/withdraw flows
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: pool_address
  type: address
  label: Pool address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
