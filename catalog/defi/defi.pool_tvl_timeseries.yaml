tool_id: defi.pool_tvl_timeseries
g1: defi
description: Tracks liquidity pool TVL via deposit/withdrawal flows over time.
g2: lp
g3: pool_tvl_timeseries
g4: Pool TVL
g5: ERC20 Transfers
scope: protocol:Gearbox
returns:
- name: day
  type: timestamp
- name: total_deposit
  type: number
- name: total_withdrawal
  type: number
- name: net_tvl
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
