tool_id: defi.post_launch_lp_withdrawals
g1: defi
description: Identifies LP withdrawals from DEXes after token launch time.
g2: lp
g3: post_launch_lp_withdrawals
g4: Post-Launch LP Withdrawals
g5: Solana Transactions + Queries
scope: generic
returns:
- name: block_time
  type: timestamp
- name: signer
  type: string
- name: pool_address
  type: string
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: dex_protocol
  type: text
  label: DEX Protocol
  default: raydium
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
