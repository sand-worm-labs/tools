tool_id: defi.profitable_trader_discovery
g1: defi
description: Discovers wallets with high win rate and profit thresholds.
g2: wallet
g3: profitable_trader_discovery
g4: Profitable Traders
g5: dex_solana.trades PNL
scope: generic
returns:
- name: wallet_address
  type: string
- name: win_rate
  type: number
- name: total_profit
  type: number
- name: trade_count
  type: number
- name: bot_score
  type: number
inputs:
- key: time_window_days
  type: number
  label: Time Window Days
  default: '7'
  required: true
- key: min_win_rate
  type: number
  label: Min Win Rate
  default: '0.4'
  required: true
- key: min_profit_usd
  type: number
  label: Min Profit USD
  default: '100'
  required: true
