tool_id: defi.profitable_trader_ranker
g1: defi
description: Ranks traders by PnL, win rate, hold time, and trade filters.
g2: wallet
g3: profitable_trader_ranker
g4: Top Profitable Traders
g5: Dune dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: pnl
  type: number
- name: win_rate
  type: number
- name: unique_tokens
  type: number
- name: swap_count
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_pnl
  type: number
  label: Min PnL USD
  default: '1000'
  required: false
- key: min_winrate
  type: number
  label: Min Win Rate
  default: '0.7'
  required: false
