tool_id: defi.protocol_cumulative_users
g1: defi
description: Computes daily new users and cumulative total for protocols.
g2: wallet
g3: protocol_cumulative_users
g4: Cumulative User Growth
g5: Solana Transactions
scope: generic
returns:
- name: date
  type: date
- name: new_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
