tool_id: defi.protocol_new_returning_users
g1: defi
description: Computes new and returning active users by configurable time interval.
g2: wallet
g3: protocol_new_returning_users
g4: New vs Returning
g5: solana instructions
scope: generic
returns:
- name: time
  type: timestamp
- name: new
  type: number
- name: old
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
