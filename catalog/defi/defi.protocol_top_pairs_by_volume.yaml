tool_id: defi.protocol_top_pairs_by_volume
g1: defi
description: Ranks top pairs per protocol by trade volume, count, and average size.
g2: dex
g3: protocol_top_pairs_by_volume
g4: Top Pairs Composition
g5: Latest month volume
scope: generic
returns:
- name: project
  type: string
- name: token_pair
  type: string
- name: total_volume
  type: number
- name: total_trades
  type: number
- name: avg_trade_vol
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocols
  type: text
  label: Protocols (comma sep)
  default: uniswap,curve,balancer
  required: true
- key: top_n
  type: number
  label: Top N
  default: '6'
  required: false
