tool_id: defi.pump_trader_pnl
g1: defi
description: Calculates realized PnL for active pump.fun traders across launched tokens.
g2: dex
g3: pump_trader_pnl
g4: Realized PnL Table
g5: Pump.fun Traders
scope: protocol:pumpdotfun
returns:
- name: wallet
  type: string
- name: trade_count
  type: number
- name: total_pnl
  type: number
- name: avg_roi
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '300'
  required: true
- key: min_trades
  type: number
  label: Min Trades
  default: '10'
  required: false
