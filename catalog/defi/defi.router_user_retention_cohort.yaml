tool_id: defi.router_user_retention_cohort
g1: defi
g2: wallet
g3: router_user_retention_cohort
g4: Monthly Retention
g5: First-month cohort analysis
description: Tracks monthly retention cohorts from first interaction with router.
scope: generic
returns:
- name: cohort_month
  type: string
- name: retention_month
  type: number
- name: retained_users
  type: number
- name: retention_rate
  type: number
inputs:
- key: router_address
  label: Router Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
