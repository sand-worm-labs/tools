tool_id: defi.router_user_retention_cohort
g1: defi
description: Tracks monthly retention cohorts from first interaction with router.
g2: wallet
g3: router_user_retention_cohort
g4: Monthly Retention
g5: First-month cohort analysis
scope: generic
returns:
- name: cohort_month
  type: date
- name: retention_month
  type: number
- name: retained_users
  type: number
- name: retention_rate
  type: number
inputs:
- key: router_address
  type: address
  label: Router Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
