tool_id: defi.sandwich_attack_detector
g1: defi
description: Identifies potential sandwich attacks in same-block trade sequences.
g2: sandwich
g3: sandwich_attack_detector
g4: Sandwich attack sequences
g5: Block-level trade patterns
scope: generic
returns:
- name: block_number
  type: number
- name: block_time
  type: timestamp
- name: front_tx
  type: string
- name: sandwich_tx
  type: string
- name: back_tx
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_trades
  type: number
  label: Min sequence length
  default: '3'
  required: false
