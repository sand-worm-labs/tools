tool_id: defi.sandwich_attack_detector
g1: defi
g2: sandwich
g3: sandwich_attack_detector
g4: Sandwich attack sequences
g5: Block-level trade patterns
description: Identifies potential sandwich attacks in same-block trade sequences.
scope: generic
returns:
- name: block_number
  type: number
- name: block_time
  type: string
- name: front_tx
  type: string
- name: sandwich_tx
  type: string
- name: back_tx
  type: string
inputs:
- key: chain
  label: Chain
  type: chain
  required: true
- key: protocol
  label: Protocol
  type: text
  required: false
- key: date_from
  label: Start Date
  type: date
  required: true
- key: min_trades
  label: Min sequence length
  type: number
  required: false
  default: '3'
