tool_id: defi.stable_swap_liquidity_percentile
g1: defi
g2: dex
g3: stable_swap_liquidity_percentile
g4: Optimal Liquidity Level
g5: BNB stable swaps
description: Computes percentile capturing optimal liquidity for stablecoin swaps.
scope: generic
returns:
- name: block_time
  type: string
- name: volume
  type: number
- name: swaps
  type: number
- name: optimal_liq
  type: number
inputs:
- key: percentile
  label: Percentile
  type: number
