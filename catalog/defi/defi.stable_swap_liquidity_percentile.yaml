tool_id: defi.stable_swap_liquidity_percentile
g1: defi
description: Computes percentile capturing optimal liquidity for stablecoin swaps.
g2: dex
g3: stable_swap_liquidity_percentile
g4: Optimal Liquidity Level
g5: BNB stable swaps
scope: generic
returns:
- name: block_time
  type: timestamp
- name: volume
  type: number
- name: swaps
  type: number
- name: optimal_liq
  type: number
inputs:
- key: percentile
  type: number
  label: Percentile
  default: '0.95'
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
