tool_id: defi.stablecoin_trade_share
g1: defi
description: Calculates percentage of DEX trades involving USDC or USDT.
g2: dex
g3: stablecoin_trade_share
g4: USDC/USDT Trade %
g5: dex.trades ethereum
scope: generic
returns:
- name: percentage
  type: number
- name: usdc_usdt_count
  type: number
- name: total_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
