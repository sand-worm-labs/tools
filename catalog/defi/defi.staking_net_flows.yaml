tool_id: defi.staking_net_flows
g1: defi
description: Computes net staking inflows minus outflows by direction.
g2: staking
g3: staking_net_flows
g4: Net Staking Flows
g5: tokens_solana.transfers
scope: generic
returns:
- name: week
  type: date
- name: stake_flow
  type: number
- name: unstake_flow
  type: number
- name: net_flow
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
