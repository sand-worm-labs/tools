tool_id: defi.swap_volume_distribution
g1: defi
description: Buckets swap volumes logarithmically for distribution analysis.
g2: dex
g3: swap_volume_distribution
g4: Log volume buckets
g5: Dune dex.trades
scope: protocol:metamask
returns:
- name: volume_from
  type: number
- name: volume_to
  type: number
- name: swaps
  type: number
- name: percent_of_all_volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: tx_to
  type: address
  label: Router address
  required: true
