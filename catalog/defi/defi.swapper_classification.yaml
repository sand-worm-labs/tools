tool_id: defi.swapper_classification
g1: defi
description: Classifies swappers by trade frequency.
g2: wallet
g3: swapper_classification
g4: User Type Breakdown
g5: Dune dex.trades buckets
scope: generic
returns:
- name: classification
  type: string
- name: swapper_count
  type: number
- name: volume_share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
