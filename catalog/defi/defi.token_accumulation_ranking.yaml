tool_id: defi.token_accumulation_ranking
g1: defi
description: Ranks wallets by buy-to-sell volume ratio across accumulation and dispersion
  periods.
g2: dex
g3: token_accumulation_ranking
g4: Whale accumulation score
g5: Dune dex.trades periods
scope: generic
returns:
- name: wallet_address
  type: string
- name: buy_volume
  type: number
- name: sell_volume
  type: number
- name: accumulation_ratio
  type: number
- name: rank
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: date_range_1
  type: date_range
  label: Date Range 1
  default:
    to: ''
    from: ''
  required: true
- key: date_range_2
  type: date_range
  label: Date Range 2
  default:
    to: ''
    from: ''
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
