tool_id: defi.token_accumulation_ranking
g1: defi
g2: dex
g3: token_accumulation_ranking
g4: Whale accumulation score
g5: Dune dex.trades periods
description: Ranks wallets by buy-to-sell volume ratio across accumulation and dispersion periods.
scope: generic
returns:
- name: wallet_address
  type: string
- name: buy_volume
  type: number
- name: sell_volume
  type: number
- name: accumulation_ratio
  type: number
- name: rank
  type: number
inputs:
- key: token_symbol
  label: Token Symbol
  type: text
  required: true
- key: accumulation
  label: Accumulation
  type: date_range
  required: true
- key: dispersion
  label: Dispersion
  type: date_range
  required: true
- key: chain
  label: Chain
  type: chain
  required: true
  default: ethereum
