tool_id: defi.top_depositors_leaderboard
g1: defi
description: Ranks wallets by total deposited SOL volume.
g2: wallet
g3: top_depositors_leaderboard
g4: Deposit Leaderboard
g5: SOL Deposits
scope: generic
returns:
- name: address
  type: string
- name: deposited_sol
  type: number
- name: percent_of_total
  type: number
inputs:
- key: protocol_address
  type: address
  label: '"Protocol Address"'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
