tool_id: defi.top_net_holders
g1: defi
description: Ranks top net depositors after withdrawals.
g2: holders
g3: top_net_holders
g4: Net Balance
g5: ethereum.traces flows
scope: protocol
returns:
- name: depositor
  type: string
- name: total_eth
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '20'
  required: false
- key: min_eth
  type: number
  label: Min Net ETH
  default: '0'
  required: false
