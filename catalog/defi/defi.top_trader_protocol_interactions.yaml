tool_id: defi.top_trader_protocol_interactions
g1: defi
description: Ranks top traders by volume and their protocol interactions.
g2: wallet
g3: top_trader_protocol_interactions
g4: Trader Diversification
g5: Top volume trader protocols
scope: generic
returns:
- name: trader
  type: string
- name: protocol
  type: string
- name: interactions
  type: number
inputs:
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: false
