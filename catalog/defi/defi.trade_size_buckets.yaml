tool_id: defi.trade_size_buckets
g1: defi
description: Buckets trades by USD size with counts and averages for comparison across
  versions.
g2: dex
g3: trade_size_buckets
g4: Trade Size Percentiles
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: bucket
  type: string
- name: avg_trade_usd
  type: number
- name: num_trades
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: version
  type: text
  label: Version
  default: v2
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
