tool_id: defi.trader_activity_segments
g1: defi
description: Segments and ranks traders by volume and frequency.
g2: wallet
g3: trader_activity_segments
g4: Trader Segments Leaderboard
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: taker
  type: string
- name: num_trades
  type: number
- name: total_volume_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  default: sushiswap
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
