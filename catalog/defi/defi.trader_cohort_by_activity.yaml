tool_id: defi.trader_cohort_by_activity
g1: defi
description: Cohorts traders by days between first and last trade (one-shot vs multi-day).
g2: wallet
g3: trader_cohort_by_activity
g4: Activity Span Cohorts
g5: Cow Protocol Traders
scope: protocol:cow
returns:
- name: month
  type: date
- name: cohort
  type: string
- name: traders
  type: number
- name: trades
  type: number
- name: volume
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: cow
  required: true
- key: date_from
  type: date
  label: Start Date
  default: '2022-01-01'
  required: true
