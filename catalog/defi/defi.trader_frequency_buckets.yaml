tool_id: defi.trader_frequency_buckets
g1: defi
description: Buckets traders by daily trade frequency and aggregates volume.
g2: wallet
g3: trader_frequency_buckets
g4: Volume by Frequency
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: frequency_bucket
  type: string
- name: volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: category
  type: select
  label: Category
  default: Aggregator
  required: false
  options:
  - label: DEX
    value: DEX
  - label: Aggregator
    value: Aggregator
- key: date_from
  type: date
  label: Start Date
  required: true
