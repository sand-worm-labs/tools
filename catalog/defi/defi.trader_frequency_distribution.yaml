tool_id: defi.trader_frequency_distribution
g1: defi
description: Classifies traders by daily trade frequency.
g2: wallet
g3: trader_frequency_distribution
g4: Frequency Trader Counts
g5: Dune query 459702
scope: generic
returns:
- name: day
  type: date
- name: frequency
  type: string
- name: trader_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
