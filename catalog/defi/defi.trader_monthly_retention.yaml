tool_id: defi.trader_monthly_retention
g1: defi
description: Computes trader cohort retention rates by month.
g2: wallet
g3: trader_monthly_retention
g4: Monthly retention rates
g5: Dune dex.trades
scope: generic
returns:
- name: first_trade_month
  type: date
- name: traders_onboarded
  type: number
- name: month_1_retention
  type: number
- name: month_2_retention
  type: number
- name: month_3_retention
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: arbitrum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
