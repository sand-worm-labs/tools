tool_id: defi.trader_token_diversity_classifier
g1: defi
description: Classifies traders by token diversity and meme coin focus score.
g2: wallet
g3: trader_token_diversity_classifier
g4: Meme Specialist Traders
g5: Dune dex.trades
scope: generic
returns:
- name: taker
  type: string
- name: meme_count
  type: number
- name: diversity_score
  type: number
- name: classification
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: base
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
