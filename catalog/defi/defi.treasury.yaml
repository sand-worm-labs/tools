tool_id: defi.treasury
g1: defi
description: Token balances and historical USD value for a DAO treasury wallet.
g2: treasury
g3: treasury
g4: Treasury tracker
g5: Treasury wallet balances
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: treasury_address
  type: address
  label: Treasury address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '180'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
