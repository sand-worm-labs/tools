tool_id: defi.treasury_multi_token_balances
g1: defi
g2: treasury
g3: treasury_multi_token_balances
g4: Multi-asset treasury
g5: Treasury token balances
description: Computes daily net balances for multiple tokens in treasury.
scope: generic
returns:
- name: day
  type: string
- name: token1
  type: number
- name: token2
  type: number
inputs:
- key: treasury_address
  label: Treasury Address
  type: address
  required: true
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
