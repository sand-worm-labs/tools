tool_id: defi.two_token_pool_ratios
g1: defi
description: Computes cumulative balances and percentages for two tokens in LP pool.
g2: lp
g3: two_token_pool_ratios
g4: Pool token ratios
g5: ERC20 transfers
scope: generic
returns:
- name: date
  type: date
- name: token1_balance
  type: number
- name: token2_balance
  type: number
- name: token1_pct
  type: number
- name: token2_pct
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: token1_address
  type: address
  label: Token 1 Address
  required: true
- key: token2_address
  type: address
  label: Token 2 Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
