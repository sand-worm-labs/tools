tool_id: defi.volume_cohort_retention
g1: defi
description: Computes retention rates by user volume cohorts.
g2: dex
g3: volume_cohort_retention
g4: Retention by Volume
g5: DEX trades table
scope: generic
returns:
- name: cohort_week
  type: number
- name: retention_rate
  type: number
- name: volume_tier
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
