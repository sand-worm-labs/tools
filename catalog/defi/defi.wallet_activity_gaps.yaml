tool_id: defi.wallet_activity_gaps
g1: defi
description: Detects prolonged inactivity gaps in wallet trading activity.
g2: wallet
g3: wallet_activity_gaps
g4: Inactivity Periods
g5: Dune dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: max_silence
  type: number
- name: start_again
  type: string
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: threshold_days
  type: number
  label: Min Gap Days
  default: '3'
  required: false
