tool_id: defi.wallet_behavior_classifier
g1: defi
description: Classifies wallets by swap count, volume, and diversity into user tiers.
g2: wallet
g3: wallet_behavior_classifier
g4: User Activity Classification
g5: Dune dex.trades
scope: generic
returns:
- name: user_address
  type: string
- name: classification
  type: string
- name: total_swaps
  type: number
- name: total_volume
  type: number
- name: bot_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
