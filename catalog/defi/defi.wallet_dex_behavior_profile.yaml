tool_id: defi.wallet_dex_behavior_profile
g1: defi
description: Computes lifetime metrics like activity span, volume, and trade frequency.
g2: wallet
g3: wallet_dex_behavior_profile
g4: Wallet Trading Metrics
g5: Dune dex.trades
scope: generic
returns:
- name: first_tx
  type: string
- name: last_tx
  type: string
- name: days_active
  type: number
- name: total_volume
  type: number
- name: avg_trade_size
  type: number
- name: trade_count
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
