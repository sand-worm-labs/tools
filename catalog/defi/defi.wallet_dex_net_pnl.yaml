tool_id: defi.wallet_dex_net_pnl
g1: defi
g2: wallet
g3: wallet_dex_net_pnl
g4: Wallet Net PnL USD
g5: Dune dex.trades
description: Calculates net profit/loss in USD from DEX trades for wallet.
scope: generic
returns:
- name: day
  type: string
- name: net_pnl_usd
  type: number
inputs:
- key: wallet_address
  label: Wallet Address
  type: address
  required: true
- key: date_from
  label: Start Date
  type: date
  required: true
- key: chain
  label: Chain
  type: chain
  required: false
  default: ethereum
