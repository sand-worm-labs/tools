tool_id: defi.wallet_net_accumulation
g1: defi
description: Calculates net token accumulation per wallet.
g2: wallet
g3: wallet_net_accumulation
g4: Net position
g5: Buys sells join
scope: generic
returns:
- name: net_position
  type: number
- name: buy_volume
  type: number
- name: sell_volume
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
