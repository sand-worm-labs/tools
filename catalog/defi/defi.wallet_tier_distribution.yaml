tool_id: defi.wallet_tier_distribution
g1: defi
description: Buckets wallets into volume tiers and counts distribution.
g2: wallet
g3: wallet_tier_distribution
g4: Volume Tiers
g5: Dune dex.trades
scope: generic
returns:
- name: tier
  type: string
- name: wallet_count
  type: number
- name: total_volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
