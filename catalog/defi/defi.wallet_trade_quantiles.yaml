tool_id: defi.wallet_trade_quantiles
g1: defi
description: Distributes wallets by trade count quantiles.
g2: wallet
g3: wallet_trade_quantiles
g4: Activity Distribution
g5: Dune dex.trades NTILE
scope: generic
returns:
- name: quantile
  type: number
- name: wallet_count
  type: number
- name: min_trades
  type: number
- name: max_trades
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: quantiles
  type: number
  label: Quantiles
  default: '10'
  required: false
