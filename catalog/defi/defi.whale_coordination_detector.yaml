tool_id: defi.whale_coordination_detector
g1: defi
description: Detects coordinated large trades by whales in time buckets.
g2: wallet
g3: whale_coordination_detector
g4: Whale Clustering
g5: Dune dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: coordination_score
  type: number
- name: clustered_trades
  type: number
- name: hour_bucket
  type: string
inputs:
- key: token_mint
  type: address
  label: Token Address
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '5000'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '14'
  required: true
