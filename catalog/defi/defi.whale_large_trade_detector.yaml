tool_id: defi.whale_large_trade_detector
g1: defi
description: Identifies whale trades exceeding USD thresholds with hourly bucketing.
g2: dex
g3: whale_large_trade_detector
g4: Whale Trade Alerts
g5: dex_solana.trades
scope: generic
returns:
- name: hour
  type: timestamp
- name: trader_id
  type: string
- name: amount_usd
  type: number
- name: token_bought
  type: string
inputs:
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '100000'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
