tool_id: defi.whale_trader_distribution
g1: defi
description: Counts whale traders (high-volume) per DEX project.
g2: dex
g3: whale_trader_distribution
g4: Whale Trader Counts
g5: Dune dex.trades
scope: generic
returns:
- name: project
  type: string
- name: whale_count
  type: number
- name: total_trader_count
  type: number
inputs:
- key: min_usd
  type: number
  label: Min USD
  default: '100000'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '180'
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
