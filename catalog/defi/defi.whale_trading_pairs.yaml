tool_id: defi.whale_trading_pairs
g1: defi
g2: dex
g3: whale_trading_pairs
g4: Whale Top Pairs
g5: Dune dex.trades
description: Identifies whales by cumulative volume threshold then ranks their top traded pairs.
scope: generic
returns:
- name: token_pair
  type: string
- name: trade_count
  type: number
- name: total_volume
  type: number
inputs:
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '30'
- key: threshold_usd
  label: Min USD Threshold
  type: number
  required: true
  default: '1000000'
