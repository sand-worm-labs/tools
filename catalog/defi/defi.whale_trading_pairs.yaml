tool_id: defi.whale_trading_pairs
g1: defi
description: Identifies whales by cumulative volume threshold then ranks their top
  traded pairs.
g2: dex
g3: whale_trading_pairs
g4: Whale Top Pairs
g5: Dune dex.trades
scope: generic
returns:
- name: token_pair
  type: string
- name: trade_count
  type: number
- name: total_volume
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '1000000'
  required: true
