tool_id: defi.whale_volume_classifier
g1: defi
description: Classifies whales by trade volume percentiles.
g2: wallet
g3: whale_volume_classifier
g4: Whale Percentile Ranks
g5: High-value trade filter
scope: generic
returns:
- name: trader
  type: string
- name: total_bought
  type: number
- name: whale_rank
  type: string
- name: percentile
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '5000'
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
