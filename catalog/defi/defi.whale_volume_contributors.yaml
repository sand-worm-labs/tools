tool_id: defi.whale_volume_contributors
g1: defi
g2: dex
g3: whale_volume_contributors
g4: Top Volume Whales
g5: Cumulative 90% volume traders
description: Identifies whales contributing 90% of protocol volume.
scope: generic
returns:
- name: whale_address
  type: string
- name: volume_usd
  type: number
- name: volume_pct
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
- key: chain
  label: Chain
  type: chain
  required: true
- key: threshold_pct
  label: Volume Threshold %
  type: number
  required: false
  default: '90'
- key: date
  label: Date
  type: date_range
  required: false
