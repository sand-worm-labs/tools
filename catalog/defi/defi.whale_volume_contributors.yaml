tool_id: defi.whale_volume_contributors
g1: defi
description: Identifies whales contributing 90% of protocol volume.
g2: dex
g3: whale_volume_contributors
g4: Top Volume Whales
g5: Cumulative 90% volume traders
scope: generic
returns:
- name: whale_address
  type: string
- name: volume_usd
  type: number
- name: volume_pct
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: threshold_pct
  type: number
  label: Volume Threshold %
  default: '90'
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
