tool_id: defi.yield_farming
g1: defi
description: Reward token emissions and APY history for a yield farming pool.
g2: yield
g3: yield_farming
g4: Yield farming rewards
g5: Yield farming reward emissions
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: pool_address
  type: address
  label: Pool / farm address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
