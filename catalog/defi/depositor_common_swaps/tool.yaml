tool_id: defi.depositor_common_swaps
g1: defi
description: Identifies most common swap pairs used by a wallet group (e.g. depositors).
g2: wallet
g3: depositor_common_swaps
g4: Group Common Swap Pairs
g5: Dune dex.trades
scope: generic
returns:
- name: bought_token
  type: string
- name: sold_token
  type: string
- name: pair
  type: string
- name: swap_count
  type: number
inputs:
- key: group_query_id
  type: number
  label: Group Query ID
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '60'
  required: true
