tool_id: defi.dex_active_user_share
g1: defi
description: Calculates protocol market share of monthly active traders vs total DEX.
g2: dex
g3: dex_active_user_share
g4: Active User Market Share
g5: Dune dex.trades CTEs
scope: generic
returns:
- name: month
  type: date
- name: protocol_users
  type: number
- name: total_users
  type: number
- name: market_share
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: interval
  type: select
  label: Interval
  default: month
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
