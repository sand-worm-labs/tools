tool_id: defi.dex_arb_detector
g1: defi
description: Detects arbitrage trades within same block/tx.
g2: mev
g3: dex_arb_detector
g4: Arbitrage Profits
g5: Dune dex.trades
scope: generic
returns:
- name: tx_hash
  type: string
- name: token_pair
  type: string
- name: profit_usd
  type: number
- name: block_number
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_profit_usd
  type: number
  label: Min Profit USD
  default: '100'
  required: false
