tool_id: defi.dex_bot_classifier
g1: defi
description: Classifies bots via average daily tx over wallet lifespan.
g2: wallet
g3: dex_bot_classifier
g4: Bot Detection Score
g5: dex.trades lifespan analysis
scope: generic
returns:
- name: address
  type: string
- name: avg_daily_txs
  type: number
- name: total_txs
  type: number
- name: lifespan
  type: number
- name: is_bot
  type: boolean
inputs:
- key: min_txns_per_day
  type: number
  label: Min Tx/Day Threshold
  default: '20'
  required: true
