tool_id: defi.dex_dau_thresholds
g1: defi
description: Counts daily active users by trade size thresholds.
g2: dex
g3: dex_dau_thresholds
g4: Tiered DAU
g5: USD threshold users
scope: generic
returns:
- name: day
  type: date
- name: dau
  type: number
- name: dau_10
  type: number
- name: dau_50
  type: number
- name: dau_100
  type: number
- name: dau_1000
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: chain
  type: chain
  label: Chain
  default: base
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
