tool_id: defi.dex_gas_leaderboard
g1: defi
description: Ranks DEX routers by total gas used over time intervals.
g2: dex
g3: dex_gas_leaderboard
g4: DEX Gas Usage
g5: Ethereum Transactions
scope: generic
returns:
- name: label
  type: string
- name: total_gas
  type: number
- name: tx_count
  type: number
- name: date
  type: date
inputs:
- key: protocol
  type: text
  label: Protocol
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
