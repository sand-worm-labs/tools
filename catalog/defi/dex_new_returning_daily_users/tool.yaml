tool_id: defi.dex_new_returning_daily_users
g1: defi
description: Computes daily new and returning traders.
g2: dex
g3: dex_new_returning_daily_users
g4: New/Returning Users
g5: Dune dex.trades
scope: generic
returns:
- name: time
  type: timestamp
- name: new_users
  type: number
- name: returning_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: contract_address
  type: address
  label: Contract Address
  required: false
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
