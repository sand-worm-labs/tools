tool_id: defi.dex_new_returning_dau
g1: defi
description: Breaks down daily/weekly/monthly active users into new and returning
  cohorts.
g2: wallet
g3: dex_new_returning_dau
g4: New vs Returning DAU
g5: Dune dex.trades
scope: generic
returns:
- name: period
  type: string
- name: new_users
  type: number
- name: returning_users
  type: number
- name: total_users
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
