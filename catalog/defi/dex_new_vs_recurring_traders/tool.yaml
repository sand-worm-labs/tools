tool_id: defi.dex_new_vs_recurring_traders
g1: defi
description: Classifies token traders as new or recurring by first trade day.
g2: dex
g3: dex_new_vs_recurring_traders
g4: New vs Recurring Traders
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: new_users
  type: number
- name: recurring_users
  type: number
- name: new_vol
  type: number
- name: recurring_vol
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
