tool_id: defi.dex_performance_leaderboard
g1: defi
description: Compares DEX volume, trades, avg size, pairs.
g2: dex
g3: dex_performance_leaderboard
g4: DEX metrics
g5: dex.trades aggregation
scope: generic
returns:
- name: project
  type: string
- name: num_trades
  type: number
- name: total_volume_usd
  type: number
- name: avg_trade_volume_usd
  type: number
- name: num_token_pairs
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
