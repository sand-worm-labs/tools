tool_id: defi.dex_performance_metrics
g1: defi
description: Compares DEXes by trades, volume, average size, and token pairs.
g2: dex
g3: dex_performance_metrics
g4: DEX Metrics Comparison
g5: Multi-metric leaderboard
scope: generic
returns:
- name: project
  type: string
- name: num_trades
  type: number
- name: total_volume_usd
  type: number
- name: avg_trade_volume_usd
  type: number
- name: num_token_pairs
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
