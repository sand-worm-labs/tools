tool_id: defi.dex_price_differences
g1: defi
description: Compares average prices across DEXes for arb opportunities.
g2: dex
g3: dex_price_differences
g4: Cross-DEX Arbitrage
g5: Dune dex.trades
scope: generic
returns:
- name: token
  type: string
- name: dex_high
  type: string
- name: high_price
  type: number
- name: dex_low
  type: string
- name: low_price
  type: number
- name: diff_percent
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_hours
  type: number
  label: Lookback Hours
  default: '4'
  required: true
- key: min_trades
  type: number
  label: Min Trades
  default: '3'
  required: true
