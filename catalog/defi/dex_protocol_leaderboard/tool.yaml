tool_id: defi.dex_protocol_leaderboard
g1: defi
description: Ranks DEX protocols by trade count, unique traders, volume, average trade
  size, and token pairs.
g2: dex
g3: dex_protocol_leaderboard
g4: DEX performance metrics
g5: Dune dex.trades
scope: generic
returns:
- name: project
  type: string
- name: trade_count
  type: number
- name: unique_traders
  type: number
- name: total_volume_usd
  type: number
- name: avg_trade_usd
  type: number
- name: token_pairs_traded
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
