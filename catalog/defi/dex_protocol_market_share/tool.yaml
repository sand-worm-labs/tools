tool_id: defi.dex_protocol_market_share
g1: defi
description: Computes volume, trades, and market share percentage across DEX protocols.
g2: dex
g3: dex_protocol_market_share
g4: DEX Market Share
g5: Dune dex.trades
scope: generic
returns:
- name: period
  type: string
- name: project
  type: string
- name: volume_usd
  type: number
- name: trade_count
  type: number
- name: market_share_pct
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: timeframe
  type: select
  label: Timeframe
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: token_symbol
  type: text
  label: Token Symbol
  required: false
