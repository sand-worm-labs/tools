tool_id: defi.dex_trade_distribution
g1: defi
description: Computes volume, counts, unique traders, trade size percentiles.
g2: dex
g3: dex_trade_distribution
g4: Trade size stats
g5: Dune dex.trades
scope: generic
returns:
- name: trade_date
  type: date
- name: total_trade_vol
  type: number
- name: trade_count
  type: number
- name: unique_traders
  type: number
- name: q1_trade_size
  type: number
- name: median_trade_size
  type: number
- name: average_trade_size
  type: number
- name: q3_trade_size
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocols
  type: text
  label: Protocols
  required: true
- key: token_pair
  type: text
  label: Token Pair
  required: true
