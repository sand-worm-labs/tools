tool_id: defi.dex_trader_cohort
g1: defi
description: Computes monthly new, existing traders and total.
g2: dex
g3: dex_trader_cohort
g4: New vs Existing Traders
g5: dex.trades monthly cohort
scope: generic
returns:
- name: month
  type: date
- name: total_traders
  type: number
- name: new_traders
  type: number
- name: existing_traders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: true
