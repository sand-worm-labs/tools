tool_id: defi.dex_trader_size_distribution
g1: defi
description: Classifies daily traders by trade size buckets.
g2: dex
g3: dex_trader_size_distribution
g4: Trader Size Buckets
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: size_bucket
  type: string
- name: trader_count
  type: number
- name: volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
- key: bucket_thresholds
  type: text
  label: Thresholds
  required: false
