tool_id: defi.dex_trader_volume_percentiles
g1: defi
description: Calculates monthly median/avg trader volumes with whale filter.
g2: wallet
g3: dex_trader_volume_percentiles
g4: Trader volume stats
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: month
  type: date
- name: median_volume
  type: number
- name: avg_volume
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '10000000'
  required: false
