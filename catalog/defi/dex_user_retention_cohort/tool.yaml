tool_id: defi.dex_user_retention_cohort
g1: defi
description: Computes new and returning active users by cohort period.
g2: dex
g3: dex_user_retention_cohort
g4: New Returning Users
g5: dex.trades cohorts
scope: generic
returns:
- name: period
  type: string
- name: new_users
  type: number
- name: returning_users
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
