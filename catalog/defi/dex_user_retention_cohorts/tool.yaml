tool_id: defi.dex_user_retention_cohorts
g1: defi
description: Tracks new vs returning users by cohort month.
g2: dex
g3: dex_user_retention_cohorts
g4: Monthly cohort retention
g5: dex.trades uniswap v3
scope: protocol:uniswap
returns:
- name: cohort_month
  type: date
- name: retention_period
  type: string
- name: retained_users
  type: number
- name: retention_rate
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: version
  type: text
  label: Version
  default: '3'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
