tool_id: defi.dex_volume_bands
g1: defi
description: Categorizes DEX trades into volume bands excluding stable pairs.
g2: dex
g3: dex_volume_bands
g4: Trade Size Distribution
g5: Dune dex.trades
scope: generic
returns:
- name: volume_band
  type: string
- name: volume_bn
  type: number
- name: trade_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '0'
  required: false
