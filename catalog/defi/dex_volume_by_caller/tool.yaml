tool_id: defi.dex_volume_by_caller
g1: defi
description: Aggregates DEX volume grouped by tx_to (routers/frontends/sources).
g2: dex
g3: dex_volume_by_caller
g4: Volume by tx_to
g5: dex.trades arbitrum
scope: generic
returns:
- name: week
  type: date
- name: channel
  type: string
- name: volume
  type: number
- name: txns
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: arbitrum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  default: balancer
  required: true
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
