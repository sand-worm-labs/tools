tool_id: defi.dex_volume_multi_period
g1: defi
description: Aggregates volume across 24h, 7d, 30d windows per DEX project.
g2: dex
g3: dex_volume_multi_period
g4: Multi-Period Volumes
g5: Dune dex.trades
scope: generic
returns:
- name: project
  type: string
- name: vol_24h
  type: number
- name: vol_7d
  type: number
- name: vol_30d
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
