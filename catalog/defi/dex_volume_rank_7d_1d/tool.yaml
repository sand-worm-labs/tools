tool_id: defi.dex_volume_rank_7d_1d
g1: defi
description: Ranks DEXes by 7-day vs 1-day volume for growth comparison.
g2: dex
g3: dex_volume_rank_7d_1d
g4: DEX Volume Leaderboard
g5: dex.trades aggregations
scope: generic
returns:
- name: rank
  type: number
- name: project
  type: string
- name: volume_7d
  type: number
- name: volume_1d
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: false
