tool_id: defi.dex_wallet_pnl_calculator
g1: defi
description: Calculates realized PnL and ROI for wallets from DEX trades.
g2: wallet
g3: dex_wallet_pnl_calculator
g4: Wallet PnL and ROI
g5: Buy/sell net flow analysis
scope: generic
returns:
- name: wallet
  type: string
- name: pnl_usd
  type: number
- name: roi_percent
  type: number
- name: total_trades
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: false
