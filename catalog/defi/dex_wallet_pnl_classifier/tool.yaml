tool_id: defi.dex_wallet_pnl_classifier
g1: defi
description: Classifies wallets by PNL, ROI, trade count, and volume thresholds.
g2: wallet
g3: dex_wallet_pnl_classifier
g4: Profitable Trader Metrics
g5: Dune dex.trades PnL
scope: generic
returns:
- name: wallet_address
  type: string
- name: pnl_usd
  type: number
- name: roi
  type: number
- name: trade_count
  type: number
- name: volume_usd
  type: number
- name: profitable
  type: boolean
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_swaps
  type: number
  label: Min Swaps
  default: '20'
  required: false
- key: min_volume_usd
  type: number
  label: Min Volume USD
  default: '50000'
  required: false
- key: min_pnl_usd
  type: number
  label: Min PnL USD
  default: '500'
  required: false
