tool_id: defi.frequent_swapper_detector
g1: defi
description: Identifies potential bots/farmers by swap frequency thresholds.
g2: wallet
g3: frequent_swapper_detector
g4: High-Frequency Traders
g5: Swap count thresholding
scope: generic
returns:
- name: trader
  type: string
- name: swap_count
  type: number
- name: is_frequent
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: threshold_swaps
  type: number
  label: Min Swaps
  default: '50'
  required: true
