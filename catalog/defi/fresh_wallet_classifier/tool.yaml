tool_id: defi.fresh_wallet_classifier
g1: defi
description: Classifies wallets as fresh or old based on first trade recency.
g2: wallet
g3: fresh_wallet_classifier
g4: Fresh Wallet Status
g5: Solana DEX Trades
scope: generic
returns:
- name: trader_id
  type: string
- name: first_tx_time
  type: timestamp
- name: wallet_status
  type: string
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '4'
  required: true
- key: threshold_days
  type: number
  label: Fresh Threshold
  default: '3'
  required: true
