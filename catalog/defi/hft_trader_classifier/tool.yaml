tool_id: defi.hft_trader_classifier
g1: defi
description: Classifies traders as HFT if daily trades >=1000.
g2: wallet
g3: hft_trader_classifier
g4: HFT trader detection
g5: dex.trades evm chains
scope: generic
returns:
- name: trader
  type: string
- name: daily_trades
  type: number
- name: classification
  type: string
- name: total_volume
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '2023-01-01'
  required: true
- key: threshold_trades
  type: number
  label: HFT threshold
  default: '1000'
  required: false
