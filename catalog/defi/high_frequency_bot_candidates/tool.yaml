tool_id: defi.high_frequency_bot_candidates
g1: defi
description: Flags wallets with high tx count and short intervals indicating bots.
g2: bot
g3: high_frequency_bot_candidates
g4: Frequent Trader Alerts
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: tx_count
  type: number
- name: avg_interval_min
  type: number
- name: bot_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: arbitrum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: tx_threshold
  type: number
  label: Min Tx Count
  default: '50'
  required: false
- key: lookback_hours
  type: number
  label: Lookback Hours
  default: '24'
  required: false
