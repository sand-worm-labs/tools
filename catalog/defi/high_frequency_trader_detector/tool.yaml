tool_id: defi.high_frequency_trader_detector
g1: defi
description: Counts high-frequency traders exceeding daily trade threshold as potential
  bots.
g2: dex
g3: high_frequency_trader_detector
g4: Bot Activity Metrics
g5: Dune dex.trades
scope: generic
returns:
- name: block_date
  type: date
- name: potential_bots
  type: number
- name: total_traders
  type: number
- name: bot_pct
  type: number
- name: bot_volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: threshold
  type: number
  label: Trade Threshold
  default: '50'
  required: false
