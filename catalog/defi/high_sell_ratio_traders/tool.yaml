tool_id: defi.high_sell_ratio_traders
g1: defi
description: Identifies traders with sell volume over 2x buy volume and high total
  activity.
g2: wallet
g3: high_sell_ratio_traders
g4: Sell-Heavy Traders
g5: dex_solana.trades ratios
scope: generic
returns:
- name: trader_id
  type: string
- name: sell_volume
  type: number
- name: buy_volume
  type: number
- name: ratio
  type: number
- name: total_volume
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_total_usd
  type: number
  label: Min Total USD
  default: '1000000'
  required: true
