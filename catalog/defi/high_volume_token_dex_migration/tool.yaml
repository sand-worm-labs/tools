tool_id: defi.high_volume_token_dex_migration
g1: defi
description: Ranks DEX volume for high-volume tokens, excluding stables/BTC/ETH, tracking
  migration.
g2: dex
g3: high_volume_token_dex_migration
g4: DEX Share Trends
g5: Filtered token leaderboard
scope: generic
returns:
- name: week
  type: date
- name: dex
  type: string
- name: volume
  type: number
- name: token
  type: string
- name: is_banned
  type: boolean
inputs:
- key: min_weekly_volume
  type: number
  label: Min Volume USD
  default: '150000000'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: banned_symbols
  type: text
  label: Banned Tokens
  default: '"%ETH%,%BTC%,%USD%,DAI"'
  required: false
