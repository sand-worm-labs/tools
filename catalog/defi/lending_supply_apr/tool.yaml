tool_id: defi.lending_supply_apr
g1: defi
description: Calculates daily supply APR from liquidity index updates.
g2: lending
g3: lending_supply_apr
g4: Supply APR Trends
g5: Primex Pool Logs
scope: protocol:primex
returns:
- name: day
  type: date
- name: pool_address
  type: string
- name: apr
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: date_from
  type: date
  label: Start Date
  default: '2023-11-01'
  required: true
