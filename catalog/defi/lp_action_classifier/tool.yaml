tool_id: defi.lp_action_classifier
g1: defi
description: Classifies wallet interactions as add/remove liquidity based on instruction
  indices.
g2: lp
g3: lp_action_classifier
g4: Liquidity Provider Actions
g5: tokens_solana.transfers
scope: protocol:meteora
returns:
- name: wallet
  type: string
- name: action_type
  type: string
- name: amount
  type: number
- name: count
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: meteora
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: false
