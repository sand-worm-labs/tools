tool_id: defi.lp_pool_composition
g1: defi
description: Tracks token balances and ratios in LP pools over time.
g2: lp
g3: lp_pool_composition
g4: Pool Imbalance
g5: ERC20 transfers
scope: generic
returns:
- name: time
  type: timestamp
- name: token1_balance
  type: number
- name: token2_balance
  type: number
- name: token1_ratio
  type: number
- name: token2_ratio
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: token1_address
  type: address
  label: Token 1 contract
  required: true
- key: token2_address
  type: address
  label: Token 2 contract
  required: true
- key: decimals1
  type: number
  label: Token 1 decimals
  default: '18'
  required: false
- key: decimals2
  type: number
  label: Token 2 decimals
  default: '18'
  required: false
