tool_id: defi.multi_chain_dex_volume
g1: defi
description: Compares daily trading volume across multiple EVM chains.
g2: dex
g3: multi_chain_dex_volume
g4: Cross-Chain DEX Volume
g5: dex.trades chain comparison
scope: generic
returns:
- name: day
  type: timestamp
- name: chain
  type: string
- name: volume_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum,bnb,arbitrum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
