tool_id: defi.new_dex_users_timeseries
g1: defi
description: Computes new trader addresses by truncating trades to interval and finding
  min per signer.
g2: dex
g3: new_dex_users_timeseries
g4: New Users Cohort
g5: dex_solana.trades
scope: generic
returns:
- name: interval
  type: string
- name: new_addresses
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
