tool_id: defi.new_user_cohorts
g1: defi
description: Computes new vs returning users by first trade cohort over time.
g2: wallet
g3: new_user_cohorts
g4: New User Cohorts
g5: Dune queries 5854913,1110524
scope: generic
returns:
- name: cohort_time
  type: timestamp
- name: new_users
  type: number
- name: total_users
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: version
  type: text
  label: Version
  required: false
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
