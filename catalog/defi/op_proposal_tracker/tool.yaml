tool_id: defi.op_proposal_tracker
g1: defi
description: Tracks proposals with blocks and descriptions.
g2: governance
g3: op_proposal_tracker
g4: Proposal Metrics
g5: Optimism Governor Logs
scope: protocol:Optimism
returns:
- name: proposalId
  type: number
- name: startBlock
  type: number
- name: endBlock
  type: number
- name: description
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: optimism
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
