tool_id: defi.origination_source_share
g1: defi
description: Classifies trades by aggregator/router origination with volume shares.
g2: dex
g3: origination_source_share
g4: Source Breakdown
g5: dex.trades router classification
scope: generic
returns:
- name: time
  type: timestamp
- name: source
  type: string
- name: volume
  type: number
- name: share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
