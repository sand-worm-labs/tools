tool_id: defi.pool_buy_sell_ratio
g1: defi
description: Calculates buy vs sell counts per pool for given token.
g2: lp
g3: pool_buy_sell_ratio
g4: Pool buy/sell imbalance
g5: Dune dex.trades
scope: generic
returns:
- name: pool
  type: string
- name: buys
  type: number
- name: sells
  type: number
- name: ratio
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: version
  type: text
  label: Version
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
