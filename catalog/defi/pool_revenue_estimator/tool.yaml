tool_id: defi.pool_revenue_estimator
g1: defi
description: Estimates daily and cumulative pool revenue from volume and fee rate.
g2: lp
g3: pool_revenue_estimator
g4: LP Revenue Projection
g5: Dune dex.trades fee calc
scope: generic
returns:
- name: day
  type: date
- name: daily_volume
  type: number
- name: daily_revenue
  type: number
- name: cumulative_revenue
  type: number
inputs:
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: fee_rate
  type: number
  label: Fee Rate
  default: '0.0005'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: true
