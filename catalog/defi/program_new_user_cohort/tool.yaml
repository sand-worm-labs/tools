tool_id: defi.program_new_user_cohort
g1: defi
description: Computes daily new users and cumulative users interacting with program.
g2: wallet
g3: program_new_user_cohort
g4: User acquisition cohorts
g5: Program interaction history
scope: generic
returns:
- name: first_day
  type: date
- name: new_users
  type: number
- name: cumu_users
  type: number
inputs:
- key: program_address
  type: address
  label: Program ID
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: false
