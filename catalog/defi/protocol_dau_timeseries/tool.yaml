tool_id: defi.protocol_dau_timeseries
g1: defi
description: Computes daily active users for protocol.
g2: protocol
g3: protocol_dau_timeseries
g4: DAU by protocol
g5: solana.transactions
scope: generic
returns:
- name: block_hour
  type: timestamp
- name: dau
  type: number
inputs:
- key: protocol_address
  type: address
  label: Protocol Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
