tool_id: defi.protocol_user_churn
g1: defi
description: Detects users churning from protocol to competitors.
g2: dex
g3: protocol_user_churn
g4: Churn to Competitors
g5: DEX trades table
scope: protocol:pancakeswap
returns:
- name: lost_wallet
  type: string
- name: new_project
  type: string
- name: tx_count
  type: number
- name: churn_date
  type: timestamp
inputs:
- key: chain
  type: chain
  label: Chain
  default: base
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: protocol
  type: text
  label: Protocol
  default: pancakeswap
  required: false
