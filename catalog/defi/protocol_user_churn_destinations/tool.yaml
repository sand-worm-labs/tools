tool_id: defi.protocol_user_churn_destinations
g1: defi
description: Tracks where churned users from a protocol trade next.
g2: dex
g3: protocol_user_churn_destinations
g4: Churned User Flows
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: month
  type: date
- name: churned_count
  type: number
- name: destination_protocol
  type: string
- name: active_churned
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: churn_months
  type: number
  label: Churn Threshold Months
  default: '1'
  required: false
