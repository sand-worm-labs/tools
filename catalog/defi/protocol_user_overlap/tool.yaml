tool_id: defi.protocol_user_overlap
g1: defi
description: Identifies overlapping users between protocols with volume metrics.
g2: wallet
g3: protocol_user_overlap
g4: Cross-protocol users
g5: Dune dex.trades
scope: protocol:uniswap_sushiswap
returns:
- name: overlap_users
  type: string
- name: uni_volume
  type: number
- name: sushi_volume
  type: number
- name: total_volume
  type: number
inputs:
- key: protocol1
  type: text
  label: Protocol 1
  default: uniswap
  required: true
- key: protocol2
  type: text
  label: Protocol 2
  default: sushiswap
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
