tool_id: defi.protocol_user_program_overlap
g1: defi
description: Identifies other programs used by users of a target protocol and computes
  overlap percentages.
g2: wallet
g3: protocol_user_program_overlap
g4: User Program Overlap
g5: Dune Solana Transactions
scope: protocol:raydium
returns:
- name: program_type
  type: string
- name: user_count
  type: number
- name: percent
  type: number
inputs:
- key: protocol_address
  type: address
  label: Protocol Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
