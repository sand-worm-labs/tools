tool_id: defi.redemption_delay_analyzer
g1: defi
description: Tracks requested vs completed redemptions and computes delays.
g2: redeem
g3: redemption_delay_analyzer
g4: Redemption Delays
g5: SyrupUSDC Events
scope: protocol:syrupusdc
returns:
- name: request_id
  type: number
- name: shares
  type: number
- name: requested_time
  type: timestamp
- name: completed_time
  type: timestamp
- name: delay
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
