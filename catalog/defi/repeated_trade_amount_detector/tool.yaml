tool_id: defi.repeated_trade_amount_detector
g1: defi
description: Detects repeated rounded trade amounts across multiple wallets indicating
  potential marketing campaigns or wash trading.
g2: dex
g3: repeated_trade_amount_detector
g4: Repeated Trade Patterns
g5: Dune dex.trades
scope: generic
returns:
- name: rounded_amount
  type: number
- name: frequency
  type: number
- name: unique_traders
  type: number
- name: first_occurrence
  type: string
- name: last_occurrence
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: pool_address
  type: address
  label: Pool Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
