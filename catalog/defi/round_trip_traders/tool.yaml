tool_id: defi.round_trip_traders
g1: defi
description: Identifies users buying then selling same token pair.
g2: dex
g3: round_trip_traders
g4: Flip Trader Detection
g5: DEX trades table
scope: generic
returns:
- name: wallet
  type: string
- name: first_trade
  type: timestamp
- name: second_trade
  type: timestamp
- name: profit
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: token_bought_symbol
  type: text
  label: Bought Token
  required: true
- key: token_sold_symbol
  type: text
  label: Sold Token
  required: true
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: false
