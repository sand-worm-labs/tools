tool_id: defi.sandwich_loss_by_wallet
g1: defi
description: Computes sandwich attack losses per wallet using price slippage.
g2: sandwich
g3: sandwich_loss_by_wallet
g4: Sandwich losses wallet
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: conc_pair
  type: string
- name: price_buy
  type: number
- name: price_sell
  type: number
- name: loss_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: wallet_address
  type: address
  label: Wallet Address
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: false
