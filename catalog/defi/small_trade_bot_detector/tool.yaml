tool_id: defi.small_trade_bot_detector
g1: defi
description: Detects potential bots via high ratio of small trades.
g2: wallet
g3: small_trade_bot_detector
g4: Bot Detection Score
g5: Dune dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: small_trades
  type: number
- name: total_trades
  type: number
- name: small_trade_ratio
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '120'
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '5'
  required: true
- key: min_trades
  type: number
  label: Min Total Trades
  default: '5'
  required: true
- key: ratio_threshold
  type: number
  label: Min Small Trade Ratio
  default: '0.9'
  required: true
