tool_id: defi.stablecoin_peg_stability
g1: defi
description: Calculates 30-day rolling max absolute peg deviation for stables.
g2: stablecoin
g3: stablecoin_peg_stability
g4: Stablecoin Peg Deviation
g5: Rolling max deviation
scope: generic
returns:
- name: stablecoin
  type: string
- name: day
  type: date
- name: max_deviation
  type: number
- name: chain
  type: string
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: stables
  type: text
  label: Stablecoins
  required: false
