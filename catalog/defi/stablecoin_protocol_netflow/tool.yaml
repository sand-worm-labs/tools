tool_id: defi.stablecoin_protocol_netflow
g1: defi
description: Computes net stablecoin flows to protocol LPs over time.
g2: lp
g3: stablecoin_protocol_netflow
g4: Stablecoin LP Flows
g5: ERC20 transfers + protocol labels
scope: generic
returns:
- name: time
  type: timestamp
- name: protocol
  type: string
- name: netflow
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_to
  type: date
  label: End Date
  required: false
