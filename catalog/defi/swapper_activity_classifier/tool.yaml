tool_id: defi.swapper_activity_classifier
g1: defi
description: Classifies wallets into activity tiers by swap count.
g2: wallet
g3: swapper_activity_classifier
g4: Activity Buckets
g5: Dune dex.trades
scope: generic
returns:
- name: swapper
  type: string
- name: num_swaps
  type: number
- name: classification
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
