tool_id: defi.token_flow_to_cex
g1: defi
description: Tracks token transfers to CEX hot-wallets, DEX pools, aggregators up
  to 3 hops.
g2: cex
g3: token_flow_to_cex
g4: Token Flows to CEX
g5: tokens_solana.transfers multi-hop
scope: generic
returns:
- name: wallet
  type: string
- name: hops
  type: number
- name: endpoint
  type: string
- name: amount
  type: number
- name: exchange
  type: string
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: max_hops
  type: number
  label: Max Hops
  default: '3'
  required: false
