tool_id: defi.token_new_returning_users
g1: defi
description: Computes daily/weekly new and returning traders for token.
g2: dex
g3: token_new_returning_users
g4: New vs returning traders
g5: Dune dex.trades cohort
scope: generic
returns:
- name: time
  type: timestamp
- name: new
  type: number
- name: returning
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: time_unit
  type: text
  label: Time granularity
  default: day
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
