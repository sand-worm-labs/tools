tool_id: defi.token_wallet_pnl_estimator
g1: defi
description: Estimates wallet PNL from first buy and sell data.
g2: token
g3: token_wallet_pnl_estimator
g4: Wallet PNL Metrics
g5: dex.trades first/last
scope: generic
returns:
- name: wallet_address
  type: string
- name: total_sold
  type: number
- name: avg_sell_price
  type: number
- name: pnl_usd
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
