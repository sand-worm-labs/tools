tool_id: defi.top_dex_traders
g1: defi
description: Ranks wallets by approximate distinct swap transaction count across DEX
  versions.
g2: dex
g3: top_dex_traders
g4: Top Trading Wallets
g5: Solana Transactions
scope: generic
returns:
- name: program
  type: string
- name: signer
  type: string
- name: swap_count
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: orca
  required: false
- key: top_n
  type: number
  label: Top N
  default: '5'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
