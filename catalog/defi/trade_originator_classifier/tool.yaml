tool_id: defi.trade_originator_classifier
g1: defi
description: Classifies trades by originator like aggregators or frontends via tx_to.
g2: dex
g3: trade_originator_classifier
g4: Frontend Aggregator Breakdown
g5: Dune dex.trades tx_to mapping
scope: protocol:uniswap
returns:
- name: originator
  type: string
- name: volume
  type: number
- name: trade_count
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
