tool_id: defi.trade_size_distribution
g1: defi
description: Bins trade sizes with fractions and cumulative distribution.
g2: dex
g3: trade_size_distribution
g4: Trade Size Bins
g5: Dune dex.trades
scope: protocol:uniswap
returns:
- name: bin
  type: number
- name: frac
  type: number
- name: cum_frac
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: uniswap
  required: true
- key: version
  type: text
  label: Version
  default: '3'
  required: true
- key: token_a
  type: text
  label: Token A
  default: WETH
  required: true
- key: token_b
  type: text
  label: Token B
  default: USDC
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
