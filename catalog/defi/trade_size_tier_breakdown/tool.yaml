tool_id: defi.trade_size_tier_breakdown
g1: defi
description: Classifies trades into plankton-to-whale tiers by USD size.
g2: dex
g3: trade_size_tier_breakdown
g4: Volume by Tier
g5: Arbitrum DEX trades
scope: generic
returns:
- name: tier
  type: string
- name: volume
  type: number
- name: trades
  type: number
- name: avg_size
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
