tool_id: defi.trader_cohort_retention
g1: defi
description: Classifies traders into new and returning cohorts.
g2: dex
g3: trader_cohort_retention
g4: New vs Returning
g5: Dune dex.trades cohorts
scope: generic
returns:
- name: cohort
  type: string
- name: unique_traders
  type: number
- name: new_traders
  type: number
- name: returning_traders
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '14'
  required: true
- key: cohort_period
  type: text
  label: Cohort Period
  default: day
  required: true
- key: chain
  type: chain
  label: Chain
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
