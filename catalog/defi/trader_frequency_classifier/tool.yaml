tool_id: defi.trader_frequency_classifier
g1: defi
description: Classifies traders by trade frequency and aggregates volume.
g2: wallet
g3: trader_frequency_classifier
g4: Frequency Tiers Volume
g5: Dune dex.trades
scope: generic
returns:
- name: frequency
  type: string
- name: volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: protocol
  type: text
  label: Protocol
  required: false
- key: time_granularity
  type: text
  label: Granularity
  default: day
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
