tool_id: defi.trader_profit_efficiency
g1: defi
description: Computes profit efficiency, win ratio from paired buy/sell trades.
g2: wallet
g3: trader_profit_efficiency
g4: Win Ratio & Efficiency
g5: Buy/sell pair matching
scope: generic
returns:
- name: trader
  type: string
- name: win_ratio
  type: number
- name: profit_efficiency
  type: number
- name: total_profit
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
- key: min_trades
  type: number
  label: Min Trades
  default: '1'
  required: false
