tool_id: defi.trader_tier_volume
g1: defi
description: Segments traders into size tiers and aggregates volume/users/trades.
g2: dex
g3: trader_tier_volume
g4: Tiered trader volumes
g5: Dune dex.trades
scope: generic
returns:
- name: time
  type: timestamp
- name: tier
  type: string
- name: volume
  type: number
- name: users
  type: number
- name: trades
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: tx_to
  type: address
  label: Router address
  required: false
- key: min_usd
  type: number
  label: Min USD
  default: '0'
  required: false
