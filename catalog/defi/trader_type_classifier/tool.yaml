tool_id: defi.trader_type_classifier
g1: defi
description: Classifies traders into whale/pro/amateur by monthly volume.
g2: wallet
g3: trader_type_classifier
g4: Volume-based tiers
g5: Dune dex.trades
scope: generic
returns:
- name: trader
  type: string
- name: trader_type
  type: string
- name: monthly_volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
