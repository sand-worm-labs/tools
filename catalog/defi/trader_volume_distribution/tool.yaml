tool_id: defi.trader_volume_distribution
g1: defi
description: Classifies traders by lifetime volume buckets.
g2: dex
g3: trader_volume_distribution
g4: Trader Volume Buckets
g5: Dune dex.trades
scope: generic
returns:
- name: category
  type: string
- name: traders
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
