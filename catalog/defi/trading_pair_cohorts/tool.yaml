tool_id: defi.trading_pair_cohorts
g1: defi
description: Analyzes pair trades by size cohorts, users, volume.
g2: dex
g3: trading_pair_cohorts
g4: Pair trader metrics
g5: Dune dex.trades
scope: generic
returns:
- name: project
  type: string
- name: trading_pair
  type: string
- name: trade_count
  type: number
- name: unique_traders
  type: number
- name: total_volume
  type: number
- name: avg_trade_size
  type: number
- name: small_trades
  type: number
- name: medium_trades
  type: number
- name: large_trades
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: arbitrum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: token_symbol
  type: text
  label: Token Symbol
  default: USDC
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
