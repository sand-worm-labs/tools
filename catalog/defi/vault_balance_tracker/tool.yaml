tool_id: defi.vault_balance_tracker
g1: defi
description: Tracks daily latest vault asset balances.
g2: vault
g3: vault_balance_tracker
g4: Vault Balances
g5: weETH logs
scope: protocol:weeth
returns:
- name: day
  type: date
- name: asset
  type: string
- name: balance
  type: number
- name: tx_hash
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
