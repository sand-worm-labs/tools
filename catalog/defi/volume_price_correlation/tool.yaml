tool_id: defi.volume_price_correlation
g1: defi
description: Correlates daily volume with token price.
g2: dex
g3: volume_price_correlation
g4: Volume-Price Corr
g5: Sushiswap dex.trades
scope: protocol:sushiswap
returns:
- name: correlation
  type: number
- name: trend
  type: string
inputs:
- key: protocol
  type: text
  label: Protocol
  default: sushiswap
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
