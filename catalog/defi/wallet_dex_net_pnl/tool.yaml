tool_id: defi.wallet_dex_net_pnl
g1: defi
description: Calculates net profit/loss in USD from DEX trades for wallet.
g2: wallet
g3: wallet_dex_net_pnl
g4: Wallet Net PnL USD
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: net_pnl_usd
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
