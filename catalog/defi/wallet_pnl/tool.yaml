tool_id: defi.wallet_pnl
g1: defi
description: Computes wallet PnL from buy/sell token trades.
g2: wallet
g3: wallet_pnl
g4: Realized PnL
g5: dex.trades bought/sold CTEs
scope: generic
returns:
- name: token_addr
  type: string
- name: total_eth_spent
  type: number
- name: total_eth_received
  type: number
- name: pnl
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: base_token
  type: address
  label: Base Token
  default: WETH
  required: true
