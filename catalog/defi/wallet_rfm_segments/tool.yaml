tool_id: defi.wallet_rfm_segments
g1: defi
description: Segments traders by recency, frequency, monetary value.
g2: wallet
g3: wallet_rfm_segments
g4: RFM Trader Segments
g5: Dune dex.trades
scope: generic
returns:
- name: trader
  type: string
- name: recency
  type: number
- name: frequency
  type: number
- name: monetary
  type: number
- name: segment
  type: string
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
