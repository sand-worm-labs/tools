tool_id: defi.wallet_tier_classifier
g1: defi
description: Classifies DEX wallets by volume tiers, activity patterns, lifespan.
g2: wallet
g3: wallet_tier_classifier
g4: Activity tiers
g5: dex_solana.trades
scope: protocol:pumpdotfun
returns:
- name: wallet
  type: string
- name: tier
  type: string
- name: total_volume_usd
  type: number
- name: bot_score
  type: number
- name: lifespan_days
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: chain
  type: chain
  label: Chain
  default: solana
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
