tool_id: defi.wallet_token_net_flow
g1: defi
description: Computes net token bought/sold amounts and USD volumes per wallet.
g2: wallet
g3: wallet_token_net_flow
g4: Net Buy/Sell Volumes
g5: Solana DEX Trades
scope: generic
returns:
- name: trader_id
  type: string
- name: buy_tokens
  type: number
- name: buy_usd
  type: number
- name: sell_tokens
  type: number
- name: sell_usd
  type: number
- name: net_tokens
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: false
- key: date_from
  type: date
  label: Start Date
  default: '"NOW() - INTERVAL ''30'' DAY"'
  required: false
