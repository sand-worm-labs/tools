tool_id: defi.whale_cross_dex_flow
g1: defi
description: Tracks volume on secondary DEX by whales from primary DEX (90% volume
  threshold).
g2: whale
g3: whale_cross_dex_flow
g4: Whale Cross-DEX Volume
g5: Dune dex.trades
scope: protocol:curve
returns:
- name: whale_address
  type: string
- name: secondary_volume
  type: number
- name: dex
  type: string
inputs:
- key: primary_protocol
  type: text
  label: Primary DEX
  default: curve
  required: true
- key: secondary_protocol
  type: text
  label: Secondary DEX
  default: uniswap
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
