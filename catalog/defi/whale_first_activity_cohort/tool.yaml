tool_id: defi.whale_first_activity_cohort
g1: defi
description: Identifies top volume whales and their first trade week.
g2: holders
g3: whale_first_activity_cohort
g4: Whale Onboarding Periods
g5: Dune dex.trades
scope: protocol:curve
returns:
- name: whale_address
  type: string
- name: first_trade_week
  type: date
- name: volume_share
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: curve
  required: true
- key: percentile
  type: number
  label: Whale Threshold
  default: '90'
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
