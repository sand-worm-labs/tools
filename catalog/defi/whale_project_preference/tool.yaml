tool_id: defi.whale_project_preference
g1: defi
description: Analyzes top whales' swap distribution across DEX projects.
g2: whale
g3: whale_project_preference
g4: Top Whale DEX Usage
g5: Dune dex.trades
scope: generic
returns:
- name: whale_address
  type: string
- name: project
  type: string
- name: swap_share
  type: number
- name: whale_count
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '2021-12-01'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '1000'
  required: false
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: false
