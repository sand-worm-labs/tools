tool_id: defi.whale_volume_share
g1: defi
description: Computes daily whale volume share vs retail.
g2: dex
g3: whale_volume_share
g4: Whale vs Retail Share
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: size
  type: string
- name: share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '100000'
  required: true
