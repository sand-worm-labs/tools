tool_id: forensics.address_clustering
g1: forensics
description: Groups addresses likely controlled by the same entity using common-input
  heuristic.
g2: clustering
g3: address_clustering
g4: Address clustering
g5: Common-input address clustering
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: seed_addresses
  type: address[]
  label: Seed addresses
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Look-back window
  default: '365'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
