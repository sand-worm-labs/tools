tool_id: forensics.dusting_detector
g1: forensics
description: Tiny token sends used to deanonymise wallets — detects dusting patterns.
g2: dusting
g3: dusting_detector
g4: Dusting attack detector
g5: Dust transfer deanonymization
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
- key: max_usd
  type: select
  label: Max dust value (USD)
  default: '0.01'
  options:
  - label: < $0.01
    value: '0.01'
  - label: < $0.10
    value: '0.10'
  - label: < $1.00
    value: '1.00'
  required: true
- key: days
  type: select
  label: Time range
  default: '365'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
