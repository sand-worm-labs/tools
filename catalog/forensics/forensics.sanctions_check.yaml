tool_id: forensics.sanctions_check
g1: forensics
description: Direct and 1-hop indirect exposure to OFAC-sanctioned addresses.
g2: sanctions
g3: sanctions_check
g4: OFAC / sanctions exposure check
g5: OFAC sanctions exposure
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: addresses
  type: address[]
  label: Addresses to check
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Look-back window
  default: '365'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
