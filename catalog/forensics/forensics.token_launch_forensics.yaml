tool_id: forensics.token_launch_forensics
g1: forensics
description: Sniper bots, bundled buys, and insider wallets at token launch.
g2: launch
g3: token_launch_forensics
g4: Token launch forensics
g5: Sniper bot / insider detection
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: token_address
  type: token_address
  label: Token address
  required: true
  placeholder: 0x...
- key: launch_window_minutes
  type: select
  label: Launch window
  default: '60'
  options:
  - label: First 5 minutes
    value: '5'
  - label: First 15 minutes
    value: '15'
  - label: First 1 hour
    value: '60'
  - label: First 24 hours
    value: '1440'
  required: true
