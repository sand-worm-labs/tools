tool_id: forensics.fund_trace
g1: forensics
description: Follow ETH and token flows N hops from a target address — primary forensics
  primitive.
g2: tracing
g3: fund_trace
g4: Multi-hop fund trace
g5: Multi-hop fund tracing
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: address
  type: address
  label: Starting address
  required: true
  placeholder: 0x...
- key: direction
  type: select
  label: Direction
  default: out
  options:
  - label: Outflows (follow funds forward)
    value: out
  - label: Inflows (trace funds backward)
    value: in
  required: true
- key: hops
  type: select
  label: Hops depth
  default: '3'
  options:
  - label: 1 hop
    value: '1'
  - label: 2 hops
    value: '2'
  - label: 3 hops
    value: '3'
  - label: 5 hops
    value: '5'
  required: true
- key: min_eth
  type: select
  label: Min ETH value to follow
  default: '0.01'
  options:
  - label: Any
    value: '0'
  - label: '> 0.01 ETH'
    value: '0.01'
  - label: '> 0.1 ETH'
    value: '0.1'
  - label: '> 1 ETH'
    value: '1'
  required: true
- key: days
  type: select
  label: Look-back window
  default: '365'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
