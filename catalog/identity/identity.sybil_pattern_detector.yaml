tool_id: identity.sybil_pattern_detector
g1: identity
description: Detects sybil wallets via nonce-zero empty-data txs funded by exchange
  in specific value ranges.
g2: sybil
g3: sybil_pattern_detector
g4: Sybil Funding Patterns
g5: MEXC Funded Sybils
scope: generic
returns:
- name: addr
  type: string
- name: rnk
  type: number
- name: suspicious
  type: boolean
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_value
  type: number
  label: Min Fund Amount
  default: '0.00251'
  required: false
- key: max_value
  type: number
  label: Max Fund Amount
  default: '0.0035'
  required: false
