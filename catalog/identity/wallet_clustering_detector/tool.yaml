tool_id: identity.wallet_clustering_detector
g1: identity
description: Detects aggregator wallets via sender/receiver concentration.
g2: wallet
g3: wallet_clustering_detector
g4: Fan-in Fan-out Score
g5: Transfer pattern analysis
scope: generic
returns:
- name: wallet
  type: string
- name: fanin_score
  type: number
- name: fanout_score
  type: number
- name: cluster_score
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_senders
  type: number
  label: Min Senders
  default: '5'
  required: false
