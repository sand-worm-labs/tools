tool_id: infra.activity_seasonality_heatmap
g1: infra
description: Aggregates activity by weekday-hour with metric and normalization options.
g2: activity
g3: activity_seasonality_heatmap
g4: Hourly Patterns
g5: Weekday Activity Heatmap
scope: generic
returns:
- name: weekday
  type: string
- name: hour
  type: number
- name: value
  type: number
inputs:
- key: metric
  type: select
  label: Metric
  default: tx
  options:
  - label: Transactions
    value: tx
  - label: Unique wallets
    value: uniq
  - label: Fees
    value: fee
  required: true
- key: norm
  type: select
  label: Normalization
  default: none
  options:
  - label: None
    value: none
  - label: Row
    value: row
  - label: Column
    value: col
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
