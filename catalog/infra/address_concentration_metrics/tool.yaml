tool_id: infra.address_concentration_metrics
g1: infra
description: Computes daily wallet concentration via Herfindahl index, percentiles,
  high-activity counts.
g2: wallet
g3: address_concentration_metrics
g4: Activity Concentration
g5: Avalanche Transactions
scope: generic
returns:
- name: block_date
  type: date
- name: total_active_addresses
  type: number
- name: herfindahl_index
  type: number
- name: p95_txs_per_address
  type: number
- name: high_activity_wallets
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
