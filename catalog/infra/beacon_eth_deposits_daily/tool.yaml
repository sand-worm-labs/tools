tool_id: infra.beacon_eth_deposits_daily
g1: infra
description: Tracks daily ETH deposits to beacon chain deposit contract with moving
  average.
g2: staking
g3: beacon_eth_deposits_daily
g4: Staking Inflows
g5: Ethereum Traces
scope: protocol:BeaconChain
returns:
- name: time
  type: date
- name: deposited_eth
  type: number
- name: ma7
  type: number
inputs:
- key: deposit_contract
  type: address
  label: '"Deposit Contract"'
  default: '"0x00000000219ab540356cbb839cbe05303d7705fa"'
  required: false
