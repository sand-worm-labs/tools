tool_id: infra.bot_detector
g1: infra
description: Classifies wallets as bots by transaction frequency.
g2: wallet
g3: bot_detector
g4: Bot Detection Score
g5: Tx Rate Analysis
scope: generic
returns:
- name: addr
  type: string
- name: num_txs
  type: number
- name: txs_per_hour
  type: number
- name: is_bot
  type: boolean
inputs:
- key: bot_threshold
  type: number
  label: '"Txs per Hour Threshold"'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
