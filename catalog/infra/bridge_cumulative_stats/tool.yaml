tool_id: infra.bridge_cumulative_stats
g1: infra
description: Calculates daily unique depositors, volume, and cumulatives for bridge
  deposits.
g2: bridge
g3: bridge_cumulative_stats
g4: Cumulative depositors volume
g5: Ethereum transactions
scope: generic
returns:
- name: date
  type: date
- name: daily_users
  type: number
- name: daily_volume
  type: number
- name: cum_users
  type: number
- name: cum_volume
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
