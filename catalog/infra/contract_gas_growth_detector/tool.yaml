tool_id: infra.contract_gas_growth_detector
g1: infra
description: Detects contracts with accelerating daily gas usage.
g2: gas
g3: contract_gas_growth_detector
g4: Daily Gas Growth
g5: Ethereum Transactions
scope: generic
returns:
- name: contract_address
  type: string
- name: growth_rate
