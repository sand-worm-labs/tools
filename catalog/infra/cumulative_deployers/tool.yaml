tool_id: infra.cumulative_deployers
g1: infra
description: Cumulative count of unique contract deployers over time.
g2: wallet
g3: cumulative_deployers
g4: Contract Creators
g5: Weekly cumulative
scope: generic
returns:
- name: period
  type: string
- name: total_devs
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
