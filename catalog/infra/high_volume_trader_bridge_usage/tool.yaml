tool_id: infra.high_volume_trader_bridge_usage
g1: infra
description: Identifies high-volume traders interacting with bridges.
g2: bridge
g3: high_volume_trader_bridge_usage
g4: Bridge Usage Metrics
g5: Ethereum Transactions
scope: generic
returns:
- name: trader
  type: string
- name: bridge_address
  type: string
- name: usage_count
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: 90 days ago
  required: false
- key: min_eth
  type: number
  label: Min Volume ETH
  default: '2000'
  required: false
