tool_id: infra.blob_usage_analyzer
g1: infra
description: Computes average blobs per block with targets and maximums using blob_gas_used.
g2: blob_gas
g3: blob_usage_analyzer
g4: Blobs Per Block
g5: Ethereum Blocks
scope: generic
returns:
- name: time
  type: timestamp
- name: avg_blobs
  type: number
- name: target_blobs
  type: number
- name: max_blobs
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
