tool_id: infra.blobs_per_block
g1: infra
description: Calculates blobs per block, moving average, vs target/max with frequency.
g2: blob
g3: blobs_per_block
g4: Blob Usage Stats
g5: Post-Dencun Blocks
scope: generic
returns:
- name: time
  type: timestamp
- name: blobs
  type: number
- name: ma_blobs
  type: number
- name: target_blobs
  type: number
- name: max_blobs
  type: number
- name: frequency
  type: number
inputs:
- key: ma_window
  type: number
  label: MA Window
  default: '300'
  required: true
- key: interval
  type: select
  label: Interval
  default: hour
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
