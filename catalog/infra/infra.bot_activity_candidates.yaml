tool_id: infra.bot_activity_candidates
g1: infra
description: Detects bots via average txs per 5-min interval exceeding thresholds.
g2: wallet
g3: bot_activity_candidates
g4: High-Freq Tx Detector
g5: 5-Min Avalanche Buckets
scope: generic
returns:
- name: month
  type: date
- name: signer
  type: string
- name: avg_5min_txs
  type: number
- name: bursts
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: threshold_txs
  type: number
  label: Min Tx/Burst
  default: '5'
  required: false
