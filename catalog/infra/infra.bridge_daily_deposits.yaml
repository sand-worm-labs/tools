tool_id: infra.bridge_daily_deposits
g1: infra
description: Computes daily unique depositors, total ETH volume, and average per tx
  for bridges.
g2: bridge
g3: bridge_daily_deposits
g4: Daily Bridge Metrics
g5: Ethereum Transactions
scope: generic
returns:
- name: day
  type: date
- name: unique_users
  type: number
- name: total_eth
  type: number
- name: avg_eth_per_tx
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '0'
  required: false
