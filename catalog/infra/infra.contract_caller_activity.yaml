tool_id: infra.contract_caller_activity
g1: infra
description: Counts distinct transactions calling a contract grouped by caller label
  over time.
g2: caller
g3: contract_caller_activity
g4: Caller Tx Trends
g5: traces + labels
scope: generic
returns:
- name: week
  type: date
- name: caller_label
  type: string
- name: times_called
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract
  type: address
  label: Target Contract
  required: true
- key: months
  type: number
  label: Lookback Months
  default: '6'
  required: false
