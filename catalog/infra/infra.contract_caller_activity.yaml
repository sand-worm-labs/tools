tool_id: infra.contract_caller_activity
g1: infra
g2: caller
g3: contract_caller_activity
g4: Caller Tx Trends
g5: traces + labels
description: Counts distinct transactions calling a contract grouped by caller label over time.
scope: generic
returns:
- name: week
  type: date
- name: caller_label
  type: string
- name: times_called
  type: number
inputs:
- key: chain
  label: Chain
  type: chain
  required: true
- key: contract
  label: Target Contract
  type: address
  required: true
- key: months
  label: Lookback Months
  type: number
  required: false
  default: '6'
