tool_id: infra.daily_tps_stats
g1: infra
description: Computes average, min, max TPS per day from hourly data.
g2: tps
g3: daily_tps_stats
g4: TPS Metrics
g5: Arbitrum Transactions
scope: generic
returns:
- name: time
  type: timestamp
- name: avg_tps
  type: number
- name: min_tps
  type: number
- name: max_tps
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '180'
  required: false
