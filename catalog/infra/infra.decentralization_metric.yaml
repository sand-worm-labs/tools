tool_id: infra.decentralization_metric
g1: infra
description: Computes monthly decentralization score from transaction concentration
  of top addresses.
g2: wallet
g3: decentralization_metric
g4: Monthly Decentralization Score
g5: Ethereum Transactions
scope: generic
returns:
- name: month
  type: date
- name: score
  type: number
- name: unique_users
  type: number
- name: top_n_concentration
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
