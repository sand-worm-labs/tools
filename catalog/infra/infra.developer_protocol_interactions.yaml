tool_id: infra.developer_protocol_interactions
g1: infra
g2: identity
g3: developer_protocol_interactions
g4: Dev Protocol Counts
g5: Multi-Query Joins
description: Counts interactions of developers with protocols over time.
scope: protocol:ethereum
returns:
- name: depositor_address
  type: string
- name: protocol_name
  type: string
- name: interaction_count
  type: number
inputs:
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '365'
- key: namespace
  label: Namespace Filter
  type: text
  required: false
  default: defi
