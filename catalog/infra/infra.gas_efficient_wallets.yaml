tool_id: infra.gas_efficient_wallets
g1: infra
description: Ranks wallets by average gas used among high-activity users.
g2: gas
g3: gas_efficient_wallets
g4: Efficient Wallets
g5: Base transactions
scope: generic
returns:
- name: wallet
  type: string
- name: tx_count
  type: number
- name: avg_gas
  type: number
- name: total_gas
  type: number
inputs:
- key: min_tx
  type: number
  label: Min Transactions
  default: '50'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: false
