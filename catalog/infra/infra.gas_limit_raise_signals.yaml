tool_id: infra.gas_limit_raise_signals
g1: infra
description: Counts daily blocks signalling gas limit raises with percentage.
g2: blocks
g3: gas_limit_raise_signals
g4: Gas Limit Signals
g5: Ethereum Blocks
scope: generic
returns:
- name: time
  type: timestamp
- name: count_raises
  type: number
- name: daily_pct
  type: number
inputs:
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '45000000'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
