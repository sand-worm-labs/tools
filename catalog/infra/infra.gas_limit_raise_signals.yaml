returns:
- name: time
  type: string
- name: count_raises
  type: number
- name: daily_pct
  type: number
inputs:
- key: threshold_usd
  label: Min USD Threshold
  type: number
  required: false
  default: '45000000'
- key: date_from
  label: Start Date
  type: date
  required: false
