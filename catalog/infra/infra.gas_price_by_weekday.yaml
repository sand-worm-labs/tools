tool_id: infra.gas_price_by_weekday
g1: infra
g2: gas
g3: gas_price_by_weekday
g4: Gas Price Percentiles
g5: Ethereum Transactions
description: Computes avg, median, 90th percentile gas prices by weekday.
scope: generic
returns:
- name: weekday
  type: string
- name: avg_gas_price
  type: number
- name: median_gas_price
  type: number
- name: p90_gas_price
  type: number
inputs:
- key: date_from
  label: Start Date
  type: date
  required: false
  default: now-7d
