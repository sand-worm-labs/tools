tool_id: infra.gas_price_dow_percentiles
g1: infra
description: Calculates avg, median, and 90th percentile gas prices by day of week.
g2: gas
g3: gas_price_dow_percentiles
g4: Gas Price Percentiles
g5: Ethereum Transactions
scope: generic
returns:
- name: day_of_week
  type: string
- name: avg_gwei
  type: number
- name: median_gwei
  type: number
- name: p90_gwei
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
