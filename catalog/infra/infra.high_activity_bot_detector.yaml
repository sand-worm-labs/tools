tool_id: infra.high_activity_bot_detector
g1: infra
description: Detects bot addresses by transactions per hour exceeding threshold.
g2: wallet
g3: high_activity_bot_detector
g4: Bot addresses score
g5: solana.transactions
scope: generic
returns:
- name: address
  type: string
- name: bot_score
  type: number
- name: hours_with_tx
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: threshold_hours
  type: number
  label: Min Hours/Day
  default: '12'
  required: false
