tool_id: infra.highfrequency_wallet_detector
g1: infra
g2: wallet
g3: highfrequency_wallet_detector
g4: Bot Activity Score
g5: Tx density analysis
description: Detects potential bots by tx count and short activity span.
scope: generic
returns:
- name: wallet
  type: string
- name: tx_count
  type: number
- name: active_duration
  type: number
- name: bot_score
  type: number
inputs:
- key: date_from
  label: Start Date
  type: date
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '7'
- key: threshold_tx
  label: Min Tx Count
  type: number
  required: false
  default: '50'
