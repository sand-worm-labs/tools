tool_id: infra.highfrequency_wallet_detector
g1: infra
description: Detects potential bots by tx count and short activity span.
g2: wallet
g3: highfrequency_wallet_detector
g4: Bot Activity Score
g5: Tx density analysis
scope: generic
returns:
- name: wallet
  type: string
- name: tx_count
  type: number
- name: active_duration
  type: number
- name: bot_score
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: threshold_tx
  type: number
  label: Min Tx Count
  default: '50'
  required: false
