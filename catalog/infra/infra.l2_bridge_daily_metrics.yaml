tool_id: infra.l2_bridge_daily_metrics
g1: infra
description: Aggregates daily unique depositors, tx count, volume, avg deposit for
  L2 bridges.
g2: bridge
g3: l2_bridge_daily_metrics
g4: Bridge Deposits Metrics
g5: Ethereum Transactions
scope: protocol
returns:
- name: time
  type: timestamp
- name: unique_wallets
  type: number
- name: txs
  type: number
- name: eth_volume
  type: number
- name: avg_eth_per_tx
  type: number
inputs:
- key: bridge_address
  type: address
  label: Bridge Contract
  required: true
- key: date_from
  type: date
  label: Start Date
  default: 180 days ago
  required: false
