tool_id: infra.l2_sequencer_gas_share
g1: infra
description: Compares daily gas used by L2 sequencer to total Ethereum gas.
g2: gas
g3: l2_sequencer_gas_share
g4: L2 vs Total Gas
g5: Ethereum Gas Usage
scope: protocol:arbitrum
returns:
- name: day
  type: date
- name: l2_gas
  type: number
- name: total_gas
  type: number
- name: l2_share
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: arbitrum
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
