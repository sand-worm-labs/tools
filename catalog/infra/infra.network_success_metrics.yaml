tool_id: infra.network_success_metrics
g1: infra
description: Computes daily tx counts, success rates, and fees.
g2: gas
g3: network_success_metrics
g4: Tx Success Fees
g5: Daily Aggregates
scope: generic
returns:
- name: block_date
  type: date
- name: total_tx
  type: number
- name: success_rate
  type: number
- name: total_fees
  type: number
- name: avg_fee
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: chain
  type: chain
  label: Chain
  default: solana
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
