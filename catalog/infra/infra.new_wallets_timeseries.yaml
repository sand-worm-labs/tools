tool_id: infra.new_wallets_timeseries
g1: infra
description: Counts first-time active wallets by period.
g2: wallet
g3: new_wallets_timeseries
g4: New Wallets
g5: Ethereum Transactions
scope: generic
returns:
- name: period
  type: date
- name: new_wallets_count
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: month
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
