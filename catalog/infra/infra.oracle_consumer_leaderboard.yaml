tool_id: infra.oracle_consumer_leaderboard
g1: infra
description: Ranks protocols by oracle price feed calls.
g2: oracle
g3: oracle_consumer_leaderboard
g4: Oracle Usage Rank
g5: Chainlink Feeds
scope: generic
returns:
- name: protocol
  type: string
- name: feed_used
  type: string
- name: call_count
  type: number
inputs:
