tool_id: infra.oracle_feed_diff_detector
g1: infra
description: Detects oracle price deviations exceeding thresholds across feeds.
g2: oracle
g3: oracle_feed_diff_detector
g4: Price deviation bps
g5: Chainlink feeds arb
scope: generic
returns:
- name: feed_address
  type: string
- name: deviation_bps
  type: number
- name: timestamp
  type: timestamp
- name: confidence
  type: number
inputs:
- key: threshold_bps
  type: number
  label: Deviation threshold (bps)
  default: '5'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
