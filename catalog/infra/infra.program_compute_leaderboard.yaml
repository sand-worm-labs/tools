tool_id: infra.program_compute_leaderboard
g1: infra
description: Ranks programs by compute units consumed and invocations.
g2: gas
g3: program_compute_leaderboard
g4: Compute Usage Ranking
g5: Log-parsed CU consumption
scope: generic
returns:
- name: month
  type: date
- name: program_id
  type: string
- name: total_compute
  type: number
- name: transaction_count
  type: number
- name: unique_users
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
