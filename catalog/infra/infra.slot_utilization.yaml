tool_id: infra.slot_utilization
g1: infra
description: Computes slot utilization, missed blocks, and blob fullness with moving
  averages.
g2: blocks
g3: slot_utilization
g4: Missed Slots & Fullness
g5: Ethereum Blocks
scope: generic
returns:
- name: time
  type: timestamp
- name: slot_utilization
  type: number
- name: ma
  type: number
- name: ma_inv
  type: number
- name: blob_fullness
  type: number
inputs:
- key: ma_window
  type: number
  label: MA Window
  default: '24'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
