tool_id: infra.sybil_funding_detector
g1: infra
description: Detects sybil addresses funded by known sources within value ranges across
  time windows.
g2: identity
g3: sybil_funding_detector
g4: Sybil Farm Patterns
g5: Dune Queries 3768316+
scope: generic
returns:
- name: sybil_addr
  type: string
- name: funder
  type: string
- name: value_eth
  type: number
- name: first_tx
  type: timestamp
- name: second_tx
  type: timestamp
inputs:
- key: funder_addresses
  type: address[]
  label: Funder Addresses
  default: []
  required: true
- key: value_min
  type: number
  label: Min Value ETH
  default: '0.001'
  required: true
- key: value_max
  type: number
  label: Max Value ETH
  default: '0.1'
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
