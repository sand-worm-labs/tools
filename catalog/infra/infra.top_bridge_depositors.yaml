tool_id: infra.top_bridge_depositors
g1: infra
description: Ranks top depositors by total bridged ETH with tx count and average.
g2: bridge
g3: top_bridge_depositors
g4: Bridged ETH Leaderboard
g5: Bridge Transactions
scope: protocol
returns:
- name: rank
  type: number
- name: wallet
  type: string
- name: total_eth
  type: number
- name: tx_count
  type: number
- name: avg_eth
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
