tool_id: infra.top_contracts_by_daily_txs
g1: infra
description: Ranks contracts by daily interaction count.
g2: contract
g3: top_contracts_by_daily_txs
g4: Contract Tx Leaderboard
g5: Ethereum Transactions
scope: generic
returns:
- name: day
  type: date
- name: contract_address
  type: string
- name: tx_count
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
