tool_id: infra.top_contracts_daily_unique_users
g1: infra
description: Ranks contracts by daily unique interacting users with contract call
  filter.
g2: contract
g3: top_contracts_daily_unique_users
g4: Top Contracts Leaderboard
g5: Ethereum Transactions
scope: generic
returns:
- name: day
  type: date
- name: contract_address
  type: string
- name: unique_users
