tool_id: infra.user_session_analyzer
g1: infra
description: Detects user sessions from transaction timing gaps for behavior classification.
g2: wallet
g3: user_session_analyzer
g4: Session Patterns
g5: Base transactions
scope: generic
returns:
- name: wallet
  type: string
- name: session_count
  type: number
- name: avg_session_txs
  type: number
- name: bot_score
  type: number
inputs:
- key: days_lookback
  type: number
  label: Days Lookback
  default: '7'
  required: true
- key: session_gap_min
  type: number
  label: Session Gap Minutes
  default: '30'
  required: false
