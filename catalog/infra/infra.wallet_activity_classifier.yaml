tool_id: infra.wallet_activity_classifier
g1: infra
description: Computes active weeks ratio, nonce gaps, and tx patterns to classify
  bot vs power vs casual users.
g2: wallet
g3: wallet_activity_classifier
g4: User Activity Metrics
g5: Dune Queries 2162942+
scope: generic
returns:
- name: address
  type: string
- name: active_weeks_ratio
  type: number
- name: tx_count
  type: number
- name: nonce_gap
  type: number
- name: bot_score
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
