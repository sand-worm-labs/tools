tool_id: infra.wallet_activity_profile
g1: infra
g2: wallet
g3: wallet_activity_profile
g4: Wallet activity metrics
g5: Arbitrum transactions
description: Computes total transactions, active weeks, nonce progression, and recency for wallet.
