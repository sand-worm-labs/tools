tool_id: infra.wallet_new_vs_returning_daily
g1: infra
description: Counts daily new first-time, returning, and total active wallets.
g2: wallet
g3: wallet_new_vs_returning_daily
g4: Daily New/Returning Wallets
g5: Polygon Transactions
scope: generic
returns:
- name: day
  type: date
- name: new_wallets
  type: number
- name: returning_wallets
  type: number
- name: total_wallets
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: false
