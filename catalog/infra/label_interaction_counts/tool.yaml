tool_id: infra.label_interaction_counts
g1: infra
description: Counts distinct transactions where one labeled contract executes internal
  transactions to another labeled contract.
g2: identity
g3: label_interaction_counts
g4: Label Tx Interactions
g5: traces + labels
scope: generic
returns:
- name: contract_execute
  type: string
- name: contract_interacted
  type: string
- name: hash_times
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: label_from
  type: text
  label: From Label
  required: false
- key: label_to
  type: text
  label: To Label
  required: false
