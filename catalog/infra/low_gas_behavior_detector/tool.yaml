tool_id: infra.low_gas_behavior_detector
g1: infra
description: Scores addresses for consistently low gas usage relative to weekly averages.
g2: gas
g3: low_gas_behavior_detector
g4: low gas scorer
g5: weekly gas analysis
scope: generic
returns:
- name: address
  type: string
- name: low_gas_ratio
  type: number
- name: consecutive_weeks
  type: number
- name: total_txs
  type: number
inputs:
- key: threshold
  type: number
  label: '"Low Gas Threshold %"'
  default: '70'
  required: false
- key: lookback_weeks
  type: number
  label: '"Analysis Weeks"'
  default: '4'
  required: false
- key: min_txs
  type: number
  label: '"Min Weekly Tx"'
  default: '10'
  required: false
