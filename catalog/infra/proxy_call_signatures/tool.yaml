tool_id: infra.proxy_call_signatures
g1: infra
description: Extracts function signatures of internal calls from a proxy contract.
g2: proxy
g3: proxy_call_signatures
g4: Proxy Call Graph
g5: traces + signatures
scope: generic
returns:
- name: caller
  type: string
- name: funcsig_caller
  type: string
- name: funcsig_callee
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: proxy
  type: address
  label: Proxy Contract
  required: true
