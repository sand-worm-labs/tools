tool_id: infra.slot_utilization_metrics
g1: infra
description: Computes hourly slot utilization, blob fullness, and configurable moving
  averages.
g2: blocks
g3: slot_utilization_metrics
g4: Slot & Blob Fullness
g5: Ethereum Blocks
scope: generic
returns:
- name: time
  type: timestamp
- name: slot_utilization
  type: number
- name: ma_utilization
  type: number
- name: blob_fullness
  type: number
inputs:
- key: ma_window
  type: number
  label: MA Window
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
