tool_id: infra.staking_depositors_leaderboard
g1: infra
description: Ranks top ETH staking depositors by amount.
g2: staking
g3: staking_depositors_leaderboard
g4: Top Staking Depositors
g5: Deposit contract sum
scope: protocol:beacon
returns:
- name: depositor
  type: string
- name: total_eth
  type: number
inputs:
- key: deposit_contract
  type: address
  label: Deposit Contract
  default: '0x00000000219ab540356cbb839Cbe05303d7705Fa'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
