tool_id: infra.sybil_farm_detector
g1: infra
description: Detects sybil wallets via paired low-value funding from farms and dust
  outflows.
g2: sybil
g3: sybil_farm_detector
g4: Sybil Addresses
g5: Arbitrum Transactions
scope: protocol:arbitrum
returns:
- name: sybil_addr
  type: string
- name: first_tx_time
  type: timestamp
- name: second_tx_time
  type: timestamp
- name: funding_eth
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
