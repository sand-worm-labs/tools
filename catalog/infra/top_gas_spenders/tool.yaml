tool_id: infra.top_gas_spenders
g1: infra
description: Ranks wallets by total gas spent and tx count.
g2: gas
g3: top_gas_spenders
g4: Gas Spenders
g5: Ethereum Transactions
scope: generic
returns:
- name: wallet
  type: string
- name: tx_count
  type: number
- name: total_gas_eth
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '7'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '15'
  required: false
