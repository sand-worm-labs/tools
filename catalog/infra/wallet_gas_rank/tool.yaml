tool_id: infra.wallet_gas_rank
g1: infra
description: Ranks wallets by total gas spent with percentile buckets.
g2: gas
g3: wallet_gas_rank
g4: Gas spending percentiles
g5: Base transactions
scope: generic
returns:
- name: wallet_address
  type: string
- name: total_gas_spent_eth
  type: number
- name: rank
  type: number
- name: percentile_bucket
  type: string
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '2024-01-01'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '1000000'
  required: false
