tool_id: infra.wallet_type_classifier
g1: infra
description: Classifies wallets by total fees paid and transaction volume.
g2: wallet
g3: wallet_type_classifier
g4: Wallet activity types
g5: polygon.transactions
scope: generic
returns:
- name: wallet_address
  type: string
- name: total_fees_eth
  type: number
- name: tx_count
  type: number
- name: wallet_type
  type: string
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
