tool_id: infra.weekly_network_stats
g1: infra
description: Aggregates weekly users, txs, cumulative txs, gas usage with median.
g2: network
g3: weekly_network_stats
g4: Network Usage Metrics
g5: Ethereum Transactions
scope: generic
returns:
- name: time
  type: timestamp
- name: user_count
  type: number
- name: tx_count
  type: number
- name: cum_tx_count
  type: number
- name: total_gas_used
  type: number
- name: avg_gas_used
  type: number
- name: median_gas_used
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
