description: Computes weekly new and returning active users.
g2: wallet
g3: weekly_new_vs_returning_users
g4: New vs Returning
g5: Polygon Transactions
scope: generic
returns:
- name: week
  type: date
- name: unique_users
  type: number
- name: new_users
