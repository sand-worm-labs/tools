tool_id: lending.delinquency_risk_scorer
g1: lending
description: Scores borrower delinquency risk from activity and loan patterns.
g2: borrow
g3: delinquency_risk_scorer
g4: Borrower risk
g5: Transaction patterns
scope: generic
returns:
- name: borrower
  type: string
- name: risk_score
  type: number
- name: signals
  type: string
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_loan_usd
  type: number
  label: Min loan USD
  default: '10000'
  required: false
