tool_id: mev.high_freq_trader_detector
g1: mev
description: Flags high-frequency traders by trades per minute and total volume.
g2: wallet
g3: high_freq_trader_detector
g4: Bot signals
g5: dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: trades_per_min
  type: number
- name: total_trades
  type: number
- name: bot_score
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_trades
  type: number
  label: Min trades
  default: '100'
  required: false
