tool_id: mev.tx_revert_analysis
g1: mev
description: Detects successful txs with internal reverts.
g2: bundle
g3: tx_revert_analysis
g4: Reverted Calls per Tx
g5: Success filter count
scope: generic
returns:
- name: tx_hash
  type: string
- name: reverted_calls
  type: number
- name: total_calls
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: '30'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '50'
  required: false
