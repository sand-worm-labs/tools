tool_id: mev.mev_bundle_detector
g1: mev
description: Detects potential MEV bundles via close-index transactions with from-to
  links.
g2: bundle
g3: mev_bundle_detector
g4: MEV Bundles
g5: Ethereum Transactions
scope: generic
returns:
- name: block_time
  type: timestamp
- name: block_number
  type: number
- name: hash
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
