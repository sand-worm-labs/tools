tool_id: mev.multi_tx_per_block_detector
g1: mev
description: Detects addresses sending multiple transactions per block.
g2: bot
g3: multi_tx_per_block_detector
g4: MEV Signals
g5: polygon.transactions block analysis
scope: generic
returns:
- name: address
  type: string
- name: block_number
  type: number
- name: tx_count
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: min_tx
  type: number
  label: Min txs per block
  default: '2'
  required: false
