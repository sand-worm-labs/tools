tool_id: mev.sandwich_detector
g1: mev
description: Detects victim trades sandwiched by front/back-running.
g2: sandwich
g3: sandwich_detector
g4: Sandwich trades
g5: Dune dex.trades
scope: generic
returns:
- name: tx_hash
  type: string
- name: victim_tx
  type: string
- name: sandwicher
  type: string
- name: profit
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
