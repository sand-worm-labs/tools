tool_id: mev.sandwich_trade_detector
g1: mev
description: Detects sandwich attacks via correlated tx patterns.
g2: sandwich
g3: sandwich_trade_detector
g4: Sandwich Attack Detection
g5: Front/back-run tx matching
scope: generic
returns:
- name: victim_tx
  type: string
- name: attacker_tx
  type: string
- name: backrun_tx
  type: string
- name: profit_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_hours
  type: number
  label: Lookback Hours
  default: '25'
  required: false
