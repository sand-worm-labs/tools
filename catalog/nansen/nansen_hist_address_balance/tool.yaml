tool_id: nansen.nansen_hist_address_balance
g1: nansen
description: Token balances held by an address as of a historical snapshot date, via the Nansen API.
g2: backtesting
g3: nansen_hist_address_balance
g4: Historical address balance
g5: Nansen historical address balance
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: chain
  type: string
- name: token_address
  type: string
- name: token_symbol
  type: string
- name: name
  type: string
- name: token_amount
  type: number
- name: price_usd
  type: number
- name: value_usd
  type: number
inputs:
- key: address
  type: text
  label: Wallet address
  required: true
  placeholder: 0x... or Solana base58 address
  description: EVM hex or Solana base58 wallet address.
- key: as_of_date
  type: date
  label: As of date
  required: true
  description: Historical snapshot date; balances are computed up to this date.
- key: chain
  type: select
  label: Chain
  required: false
  default: all
  options:
  - label: All chains
    value: all
  - label: Base
    value: base
  - label: BNB Chain
    value: bnb
  - label: Ethereum
    value: ethereum
  - label: MANTRA
    value: mantra
  - label: Solana
    value: solana
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 50
  min: 1
  max: 1000
