tool_id: nansen.nansen_hist_token_ohlcv
g1: nansen
description: Historical OHLCV candles (price, volume, market cap) for a token over a past date window, via the Nansen API.
g2: backtesting
g3: nansen_hist_token_ohlcv
g4: Historical token OHLCV
g5: Nansen historical token OHLCV
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: interval_start
  type: string
- name: open
  type: number
- name: high
  type: number
- name: low
  type: number
- name: close
  type: number
- name: volume
  type: number
- name: volume_usd
  type: number
- name: market_cap
  type: string
inputs:
- key: chain
  type: select
  label: Chain
  required: true
  options:
  - label: Base
    value: base
  - label: BNB Chain
    value: bnb
  - label: Ethereum
    value: ethereum
  - label: Hyperliquid
    value: hyperliquid
  - label: Solana
    value: solana
- key: token_address
  type: text
  label: Token address or symbol
  required: true
  placeholder: 0x... (or coin symbol for Hyperliquid, e.g. BTC)
  description: Token contract/mint address. For chain=hyperliquid, pass the coin symbol instead (e.g. BTC, HYPE).
- key: date_from
  type: date
  label: From date
  required: true
  description: Start of the historical OHLCV window.
- key: as_of_date
  type: date
  label: As of date
  required: false
  description: End of the historical window (snapshot anchor). Defaults to now when omitted.
- key: timeframe
  type: select
  label: Candle interval
  required: true
  default: 1d
  options:
  - label: 5 minutes
    value: 5m
  - label: 15 minutes
    value: 15m
  - label: 30 minutes
    value: 30m
  - label: 1 hour
    value: 1h
  - label: 4 hours
    value: 4h
  - label: 1 day
    value: 1d
  - label: 1 week
    value: 1w
