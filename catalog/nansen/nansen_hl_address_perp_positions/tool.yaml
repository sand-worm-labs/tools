tool_id: nansen.nansen_hl_address_perp_positions
g1: nansen
description: Open Hyperliquid perpetual positions for an address, with liquidation-distance and position-level PnL ratios, via the Nansen API.
g2: hyperliquid
g3: nansen_hl_address_perp_positions
g4: Address perp positions
g5: Nansen Hyperliquid address perp positions
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: token_symbol
  type: string
- name: size
  type: number
- name: position_value_usd
  type: number
- name: entry_price_usd
  type: number
- name: liquidation_price_usd
  type: number
- name: leverage_value
  type: number
- name: leverage_type
  type: string
- name: margin_used_usd
  type: number
- name: max_leverage_value
  type: number
- name: return_on_equity
  type: number
- name: unrealized_pnl_usd
  type: number
- name: position_type
  type: string
- name: side
  type: string
- name: distance_to_liquidation_pct
  type: number
- name: unrealized_pnl_pct_of_position
  type: number
inputs:
- key: address
  type: text
  label: Hyperliquid address
  required: true
  placeholder: "0xa312114b5795dff9b8db50474dd57701aa78ad1e"
  description: 42-character 0x-prefixed hex address.
- key: token_symbol
  type: text
  label: Token symbol filter
  required: false
  placeholder: BTC
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: position_value_usd
  options:
  - label: Position value (USD)
    value: position_value_usd
  - label: Unrealized PnL (USD)
    value: unrealized_pnl_usd
  - label: Leverage
    value: leverage_value
  - label: Entry price (USD)
    value: entry_price_usd
  - label: Liquidation price (USD)
    value: liquidation_price_usd
  - label: Size
    value: size
  - label: Token symbol
    value: token_symbol
  - label: Position type
    value: position_type
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
