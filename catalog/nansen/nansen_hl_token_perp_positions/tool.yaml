tool_id: nansen.nansen_hl_token_perp_positions
g1: nansen
description: Open Hyperliquid perpetual positions for a token across traders, with each position's share of total open interest (concentration) and liquidation-distance risk added, via the Nansen API.
g2: hyperliquid
g3: nansen_hl_token_perp_positions
g4: Token perp positions
g5: Nansen Hyperliquid token perp positions
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: address
  type: string
- name: address_label
  type: string
- name: side
  type: string
- name: position_value_usd
  type: number
- name: position_size
  type: number
- name: leverage
  type: string
- name: leverage_type
  type: string
- name: entry_price
  type: number
- name: mark_price
  type: number
- name: liquidation_price
  type: number
- name: funding_usd
  type: number
- name: upnl_usd
  type: number
- name: position_share_of_oi_pct
  type: number
- name: distance_to_liquidation_pct
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token symbol
  required: true
  placeholder: BTC
  description: Hyperliquid perpetual contract symbol.
- key: label_type
  type: select
  label: Trader cohort
  required: false
  default: all_traders
  options:
  - label: All traders
    value: all_traders
  - label: Smart money
    value: smart_money
  - label: Whales
    value: whale
  - label: Public figures
    value: public_figure
- key: side
  type: select
  label: Side filter
  required: false
  options:
  - label: Long
    value: Long
  - label: Short
    value: Short
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 50
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: position_value_usd
  options:
  - label: Position value (USD)
    value: position_value_usd
  - label: Position size (signed)
    value: position_size
  - label: Position size (absolute)
    value: size_base
  - label: Leverage
    value: leverage
  - label: Unrealized PnL (USD)
    value: upnl_usd
  - label: Funding (USD)
    value: funding_usd
  - label: Liquidation price
    value: liquidation_price
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
