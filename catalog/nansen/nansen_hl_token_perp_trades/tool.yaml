tool_id: nansen.nansen_hl_token_perp_trades
g1: nansen
description: Hyperliquid perpetual trades for a single token across all traders over a date range, with a running cumulative net crowd-flow (buy value minus sell value) trend added, via the Nansen API.
g2: hyperliquid
g3: nansen_hl_token_perp_trades
g4: Token perp trades
g5: Nansen Hyperliquid token perp trades
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: trader_address_label
  type: string
- name: trader_address
  type: string
- name: token_symbol
  type: string
- name: side
  type: string
- name: action
  type: string
- name: token_amount
  type: number
- name: price_usd
  type: number
- name: value_usd
  type: number
- name: type
  type: string
- name: block_timestamp
  type: string
- name: transaction_hash
  type: string
- name: directional_value_usd
  type: number
- name: cumulative_net_flow_usd
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token symbol
  required: true
  placeholder: BTC
  description: Hyperliquid perpetual contract symbol.
- key: from_date
  type: text
  label: From date
  required: true
  placeholder: "2025-01-01T00:00:00Z"
  description: ISO 8601 date or date-time.
- key: to_date
  type: text
  label: To date
  required: true
  placeholder: "2025-01-31T23:59:59Z"
  description: ISO 8601 date or date-time.
- key: side
  type: select
  label: Side filter
  required: false
  options:
  - label: Long
    value: Long
  - label: Short
    value: Short
- key: order_type
  type: select
  label: Order type filter
  required: false
  options:
  - label: Market
    value: MARKET
  - label: Limit
    value: LIMIT
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 100
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: block_timestamp
  options:
  - label: Timestamp
    value: block_timestamp
  - label: Token amount
    value: token_amount
  - label: Value (USD)
    value: value_usd
  - label: Trader address
    value: trader_address
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
