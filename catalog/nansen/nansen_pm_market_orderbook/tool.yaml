tool_id: nansen.nansen_pm_market_orderbook
g1: nansen
description: Live orderbook levels (bids and asks) for a prediction market, via the Nansen API.
g2: market
g3: nansen_pm_market_orderbook
g4: Market orderbook
g5: Nansen prediction market orderbook
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: market_id
  type: string
- name: event_id
  type: string
- name: outcome
  type: string
- name: outcome_index
  type: number
- name: asset_id
  type: string
- name: side
  type: string
- name: price
  type: number
- name: size
  type: number
- name: cumulative_size
  type: number
- name: snapshot_timestamp
  type: string
- name: best_bid
  type: number
- name: best_ask
  type: number
- name: spread
  type: number
- name: mid_price_implied_probability_pct
  type: number
- name: depth_imbalance
  type: number
- name: depth_concentration_top3_pct
  type: number
inputs:
- key: market_id
  type: text
  label: Market ID
  required: true
  placeholder: '0x1234...'
  description: "Polymarket market ID. 1-100 characters."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
