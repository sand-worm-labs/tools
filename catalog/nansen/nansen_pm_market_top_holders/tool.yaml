tool_id: nansen.nansen_pm_market_top_holders
g1: nansen
description: Top holders of a prediction market by position size, with concentration and Yes/No side share, via the Nansen API.
g2: market
g3: nansen_pm_market_top_holders
g4: Market top holders
g5: Nansen prediction market top holders
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: market_id
  type: string
- name: outcome_index
  type: number
- name: address
  type: string
- name: owner_address
  type: string
- name: side
  type: string
- name: position_size
  type: number
- name: avg_entry_price
  type: number
- name: current_price
  type: number
- name: unrealized_pnl_usd
  type: number
- name: position_share_pct
  type: number
- name: unrealized_pnl_pct
  type: number
- name: side_share_pct
  type: number
inputs:
- key: market_id
  type: text
  label: Market ID
  required: true
  placeholder: '0x1234...'
  description: "Polymarket market ID. 1-100 characters."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: position_size
  options:
  - label: Position size
    value: position_size
  - label: Unrealized PnL (USD)
    value: unrealized_pnl_usd
  - label: Avg entry price
    value: avg_entry_price
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
