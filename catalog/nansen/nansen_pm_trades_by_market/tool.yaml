tool_id: nansen.nansen_pm_trades_by_market
g1: nansen
description: Recent trades for a prediction market, with average trade size and side volume share, via the Nansen API.
g2: market
g3: nansen_pm_trades_by_market
g4: Trades by market
g5: Nansen prediction market trade history
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: market_id
  type: string
- name: timestamp
  type: string
- name: seller
  type: string
- name: buyer
  type: string
- name: taker_action
  type: string
- name: side
  type: string
- name: outcome_index
  type: number
- name: size
  type: number
- name: price
  type: number
- name: usdc_value
  type: number
- name: tx_hash
  type: string
- name: side_volume_share_pct
  type: number
- name: large_trade_concentration_pct
  type: number
inputs:
- key: market_id
  type: text
  label: Market ID
  required: true
  placeholder: '0x1234...'
  description: "Polymarket market ID. 1-100 characters."
- key: date_range
  type: date_range
  label: Date range
  required: false
  default:
    from: ''
    to: ''
  description: "ISO 8601 date or date-time, e.g. 2025-01-01 or 2025-01-01T00:00:00Z. Leave blank for no filter."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_direction
  type: select
  label: Sort direction (by timestamp)
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
