tool_id: nansen.nansen_profiler_address_first_funder
g1: nansen
description: The first wallet that ever funded a given EVM address, via the Nansen API.
g2: profiler
g3: nansen_profiler_address_first_funder
g4: Address first funder
g5: Nansen profiler first funder
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: wallet_address
  type: string
- name: first_funder_address
  type: string
- name: first_funder_name
  type: string
- name: transaction_hash
  type: string
- name: block_timestamp
  type: string
- name: chain
  type: string
inputs:
- key: address
  type: text
  label: Wallet address
  required: true
  placeholder: '0x...'
  description: EVM address only; non-EVM addresses are rejected by the API.
