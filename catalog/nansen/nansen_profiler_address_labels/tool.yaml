tool_id: nansen.nansen_profiler_address_labels
g1: nansen
description: Non-premium Nansen labels (e.g. smart money, defi, cefi, social) attached to a wallet address, via the Nansen API.
g2: profiler
g3: nansen_profiler_address_labels
g4: Address labels
g5: Nansen profiler address labels
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: label
  type: string
- name: category
  type: string
- name: kind
  type: string
inputs:
- key: address
  type: text
  label: Wallet address
  required: true
  placeholder: 0x... or a Solana address
- key: chain
  type: select
  label: Chain
  required: true
  default: ethereum
  options:
  - label: All
    value: all
  - label: Arbitrum
    value: arbitrum
  - label: Arc
    value: arc
  - label: Avalanche
    value: avalanche
  - label: Base
    value: base
  - label: BNB Chain
    value: bnb
  - label: Ethereum
    value: ethereum
  - label: HyperEVM
    value: hyperevm
  - label: Hyperliquid
    value: hyperliquid
  - label: IoTeX EVM
    value: iotaevm
  - label: Linea
    value: linea
  - label: Mantle
    value: mantle
  - label: Monad
    value: monad
  - label: Optimism
    value: optimism
  - label: Plasma
    value: plasma
  - label: Polygon
    value: polygon
  - label: Robinhood
    value: robinhood
  - label: Sei
    value: sei
  - label: Solana
    value: solana
  - label: Sonic
    value: sonic
  - label: Tron
    value: tron
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
