tool_id: nansen.nansen_profiler_address_perp_positions
g1: nansen
description: Open Hyperliquid perp positions for an address, flagging positions whose entry is close to their liquidation price (high liquidation risk), via the Nansen API.
g2: profiler
g3: nansen_profiler_address_perp_positions
g4: Address perp positions
g5: Nansen profiler Hyperliquid perp positions
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: token_symbol
  type: string
- name: position_type
  type: string
- name: size
  type: number
- name: position_value_usd
  type: number
- name: entry_price_usd
  type: number
- name: liquidation_price_usd
  type: number
- name: leverage_value
  type: number
- name: leverage_type
  type: string
- name: margin_used_usd
  type: number
- name: return_on_equity
  type: number
- name: unrealized_pnl_usd
  type: number
- name: liq_distance_pct
  type: number
- name: risk_tier
  type: string
inputs:
- key: address
  type: text
  label: Hyperliquid address
  required: true
  placeholder: '0x...'
  description: 42-character hexadecimal Hyperliquid user address.
- key: token_symbol
  type: text
  label: Token symbol filter
  required: false
  placeholder: BTC
- key: position_type
  type: text
  label: Position type filter
  required: false
  placeholder: long or short
- key: min_position_value_usd
  type: number
  label: Min position value (USD)
  required: false
- key: max_position_value_usd
  type: number
  label: Max position value (USD)
  required: false
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: position_value_usd
  options:
  - label: Position value (USD)
    value: position_value_usd
  - label: Leverage
    value: leverage_value
  - label: Entry price (USD)
    value: entry_price_usd
  - label: Liquidation price (USD)
    value: liquidation_price_usd
  - label: Unrealized PnL (USD)
    value: unrealized_pnl_usd
  - label: Size
    value: size
  - label: Token symbol
    value: token_symbol
  - label: Position type
    value: position_type
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
