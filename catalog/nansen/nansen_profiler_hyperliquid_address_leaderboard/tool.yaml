tool_id: nansen.nansen_profiler_hyperliquid_address_leaderboard
g1: nansen
description: Hyperliquid perp trader leaderboard ranked by PnL, ROI, and volume, with PnL earned per dollar traded to separate size from skill, via the Nansen API.
g2: profiler
g3: nansen_profiler_hyperliquid_address_leaderboard
g4: Hyperliquid address leaderboard
g5: Nansen profiler Hyperliquid leaderboard
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: trader_address
  type: string
- name: trader_address_label
  type: string
- name: total_pnl
  type: number
- name: realized_pnl_usd
  type: number
- name: unrealized_pnl_usd
  type: number
- name: roi
  type: number
- name: volume_usd
  type: number
- name: total_trades
  type: number
- name: top_positions
  type: string
- name: account_value
  type: number
- name: pnl_per_volume_pct
  type: number
inputs:
- key: date_from
  type: date
  label: From date
  required: false
  placeholder: '2025-05-01'
- key: date_to
  type: date
  label: To date
  required: false
  placeholder: '2025-05-31'
- key: trader_address_label
  type: text
  label: Trader label filter
  required: false
  placeholder: Fund%
  description: Matches the wallet's display name. Supports '%' as a wildcard.
- key: include_smart_money_labels
  type: text
  label: Smart money labels
  required: false
  placeholder: Fund,Smart Trader
  description: "Comma-separated. Allowed values: Fund, Smart Trader, 30D Smart Trader, 90D Smart Trader, 180D Smart Trader, Smart HL Perps Trader."
- key: min_roi
  type: number
  label: Min ROI (fraction)
  required: false
  placeholder: '0.1'
  description: Fractional ratio, e.g. 0.1 = 10%.
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: total_pnl
  options:
  - label: Total PnL
    value: total_pnl
  - label: Realized PnL (USD)
    value: realized_pnl_usd
  - label: Unrealized PnL (USD)
    value: unrealized_pnl_usd
  - label: ROI
    value: roi
  - label: Volume (USD)
    value: volume_usd
  - label: Total trades
    value: total_trades
  - label: Account value (USD)
    value: account_value
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
