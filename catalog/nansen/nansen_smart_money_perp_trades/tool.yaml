tool_id: nansen.nansen_smart_money_perp_trades
g1: nansen
description: Trailing-week Hyperliquid perp trades by "smart money" wallets, aggregated per token into a net directional ($ long vs short) flow and how many distinct traders drove it (conviction vs. breadth), via the Nansen API.
g2: smart_money
g3: nansen_smart_money_perp_trades
g4: Smart money perp trades
g5: Nansen smart money perp trades
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: trader_address
  type: string
- name: trader_address_label
  type: string
- name: token_symbol
  type: string
- name: action
  type: string
- name: type
  type: string
- name: side
  type: string
- name: token_amount
  type: number
- name: price_usd
  type: number
- name: value_usd
  type: number
- name: block_timestamp
  type: string
- name: transaction_hash
  type: string
- name: signed_value_usd
  type: number
- name: net_directional_flow_usd
  type: number
- name: trader_count
  type: number
- name: flow_per_trader_usd
  type: number
inputs:
- key: lookback_hours
  type: number
  label: Lookback (hours)
  required: false
  default: 168
  min: 1
  max: 168
- key: only_new_positions
  type: select
  label: Only new positions
  required: false
  default: "false"
  options:
  - label: "True"
    value: "true"
  - label: "False"
    value: "false"
- key: trader_address
  type: text
  label: Trader address
  required: false
  placeholder: 0x...
- key: token_symbol
  type: text
  label: Token symbol
  required: false
  placeholder: BTC
- key: side
  type: select
  label: Side
  required: false
  default: any
  options:
  - label: Any
    value: any
  - label: Long
    value: Long
  - label: Short
    value: Short
- key: include_smart_money_labels
  type: text
  label: Smart money labels
  required: false
  placeholder: Fund,Smart Trader
  description: "Comma-separated. Allowed values: Fund, Smart Trader, 30D Smart Trader, 90D Smart Trader, 180D Smart Trader, Smart HL Perps Trader."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 100
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: value_usd
  options:
  - label: Value (USD)
    value: value_usd
  - label: Block timestamp
    value: block_timestamp
  - label: Token amount
    value: token_amount
  - label: Price (USD)
    value: price_usd
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
