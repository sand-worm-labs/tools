tool_id: nansen.nansen_tgm_holders
g1: nansen
description: Token holder list with balances, flows, and ownership share, flagging large holders (top ownership quartile) whose 30d position change marks them as accumulating or distributing relative to their own stack size, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_holders
g4: Holders
g5: Nansen Token God Mode holders
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: address
  type: string
- name: address_label
  type: string
- name: token_amount
  type: number
- name: total_outflow
  type: number
- name: total_inflow
  type: number
- name: balance_change_24h
  type: number
- name: balance_change_7d
  type: number
- name: balance_change_30d
  type: number
- name: ownership_percentage
  type: number
- name: value_usd
  type: number
- name: balance_change_30d_pct_of_position
  type: number
- name: whale_conviction
  type: string
inputs:
- key: chain
  type: text
  label: Chain
  required: true
  placeholder: ethereum
  description: "Allowed values: arbitrum, arc, avalanche, base, bitcoin, bnb, ethereum, hyperevm, injective, iotaevm, linea, mantle, mantra, monad, near, optimism, plasma, polygon, robinhood, sei, solana, sonic, starknet, sui, ton, tron."
- key: token_address
  type: text
  label: Token address
  required: true
  placeholder: 0x... or token contract address
- key: label_type
  type: select
  label: Holder label type
  required: false
  default: all_holders
  options:
  - label: All holders
    value: all_holders
  - label: Whale
    value: whale
  - label: Public figure
    value: public_figure
  - label: Smart money
    value: smart_money
  - label: Exchange
    value: exchange
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: value_usd
  options:
  - label: Value (USD)
    value: value_usd
  - label: Token amount
    value: token_amount
  - label: Ownership %
    value: ownership_percentage
  - label: Total inflow
    value: total_inflow
  - label: Total outflow
    value: total_outflow
  - label: 24h balance change
    value: balance_change_24h
  - label: 7d balance change
    value: balance_change_7d
  - label: 30d balance change
    value: balance_change_30d
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
