tool_id: nansen.nansen_tgm_perp_trades
g1: nansen
description: Raw Hyperliquid perp trade history for a token, isolating trades that open or fully close a position from ones that merely resize an existing position, and running a cumulative net new-exposure total — a fresh-conviction signal a Buy/Sell split alone conflates with position trimming, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_perp_trades
g4: Perp trades
g5: Nansen Token God Mode perp trades
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: trader_address
  type: string
- name: trader_address_label
  type: string
- name: token_symbol
  type: string
- name: side
  type: string
- name: action
  type: string
- name: token_amount
  type: number
- name: price_usd
  type: number
- name: value_usd
  type: number
- name: type
  type: string
- name: block_timestamp
  type: string
- name: transaction_hash
  type: string
- name: position_effect
  type: string
- name: net_new_exposure_usd
  type: number
- name: cumulative_net_new_exposure_usd
  type: number
inputs:
- key: token_symbol
  type: text
  label: Perp symbol
  required: true
  placeholder: BTC
- key: date_from
  type: date
  label: Start date
  required: false
- key: date_to
  type: date
  label: End date
  required: false
- key: side
  type: select
  label: Side
  required: false
  default: ""
  options:
  - label: Any
    value: ""
  - label: Long
    value: Long
  - label: Short
    value: Short
- key: include_smart_money_labels
  type: text
  label: Smart money labels
  required: false
  placeholder: Fund,Smart Trader
  description: "Comma-separated. Allowed values: Fund, Smart Trader, 30D Smart Trader, 90D Smart Trader, 180D Smart Trader, Smart HL Perps Trader."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_direction
  type: select
  label: Sort direction (by block timestamp)
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
