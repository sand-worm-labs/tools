tool_id: nansen.nansen_tgm_token_information
g1: nansen
description: One-paragraph snapshot of a token on a chain (market cap, turnover, pooled liquidity) that also checks whether buyers and sellers differ in wallet size, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_token_information
g4: Token information
g5: Nansen Token God Mode token information
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: name
  type: string
- name: symbol
  type: string
- name: contract_address
  type: string
- name: logo
  type: string
- name: token_deployment_date
  type: string
- name: website
  type: string
- name: x
  type: string
- name: telegram
  type: string
- name: market_cap_usd
  type: number
- name: fdv_usd
  type: number
- name: circulating_supply
  type: number
- name: total_supply
  type: number
- name: volume_total_usd
  type: number
- name: buy_volume_usd
  type: number
- name: sell_volume_usd
  type: number
- name: total_buys
  type: number
- name: total_sells
  type: number
- name: unique_buyers
  type: number
- name: unique_sellers
  type: number
- name: liquidity_usd
  type: number
- name: total_holders
  type: number
- name: net_taker_flow_usd
  type: number
- name: turnover_pct_mcap
  type: number
- name: avg_buy_size_usd
  type: number
- name: avg_sell_size_usd
  type: number
inputs:
- key: chain
  type: text
  label: Chain
  required: true
  placeholder: ethereum
  description: "Allowed values: arbitrum, arc, avalanche, base, bnb, ethereum, hyperevm, hyperliquid, injective, iotaevm, linea, mantle, mantra, monad, near, optimism, plasma, polygon, robinhood, sei, solana, sonic, starknet, sui, ton, tron."
- key: token_address
  type: text
  label: Token address
  required: true
  placeholder: 0x... or token contract address
- key: timeframe
  type: select
  label: Timeframe
  required: true
  default: "1d"
  options:
  - label: 5 minutes
    value: 5m
  - label: 1 hour
    value: 1h
  - label: 6 hours
    value: 6h
  - label: 12 hours
    value: 12h
  - label: 1 day
    value: 1d
  - label: 7 days
    value: 7d
