tool_id: nansen.nansen_tgm_who_bought_sold
g1: nansen
description: Traders who bought or sold a token over a date range, with buy/sell USD volumes, a net USD column, and a buy/sell ratio, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_who_bought_sold
g4: Who bought/sold
g5: Nansen Token God Mode who bought/sold
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: address
  type: string
- name: address_label
  type: string
- name: bought_token_volume
  type: number
- name: sold_token_volume
  type: number
- name: token_trade_volume
  type: number
- name: bought_volume_usd
  type: number
- name: sold_volume_usd
  type: number
- name: trade_volume_usd
  type: number
- name: net_volume_usd
  type: number
- name: buy_sell_ratio
  type: number
inputs:
- key: chain
  type: text
  label: Chain
  required: true
  placeholder: ethereum
  description: "Allowed values: arbitrum, arc, avalanche, base, bnb, ethereum, hyperevm, hyperliquid, injective, iotaevm, linea, mantle, mantra, monad, near, optimism, plasma, polygon, robinhood, sei, solana, sonic, starknet, sui, ton, tron."
- key: token_address
  type: text
  label: Token address
  required: true
  placeholder: "0x..."
- key: date_from
  type: date
  label: Start date
  required: true
- key: date_to
  type: date
  label: End date
  required: true
- key: buy_or_sell
  type: select
  label: Buy or sell
  required: false
  default: BUY
  options:
  - label: Buy
    value: BUY
  - label: Sell
    value: SELL
- key: include_smart_money_labels
  type: text
  label: Smart money labels
  required: false
  placeholder: Fund,Whale
  description: "Comma-separated. Allowed values: 30D Smart Trader, 90D Smart Trader, 180D Smart Trader, Fund, Smart Trader, Public Figure, Exchange, Whale, BananaGun Bot User, Top Maestro Bot User, Top BananaGun Bot User, Maestro Bot User, Early MAGIC Miner, First Mover LP, First Mover Staking, Profitable LP, Smart HL Perps Trader."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: trade_volume_usd
  options:
  - label: Trade volume (USD)
    value: trade_volume_usd
  - label: Bought volume (USD)
    value: bought_volume_usd
  - label: Sold volume (USD)
    value: sold_volume_usd
  - label: Token trade volume
    value: token_trade_volume
  - label: Bought token volume
    value: bought_token_volume
  - label: Sold token volume
    value: sold_token_volume
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
