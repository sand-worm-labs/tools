tool_id: nft.buyer_count_distribution
g1: nft
description: Bins buyers by total NFTs purchased.
g2: wallet
g3: buyer_count_distribution
g4: Buyer count cohorts
g5: Dune nft.trades
scope: generic
returns:
- name: cohort
  type: string
- name: buyer_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_months
  type: number
  label: Lookback Months
  default: '36'
  required: true
