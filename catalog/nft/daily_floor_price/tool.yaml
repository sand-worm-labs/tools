tool_id: nft.daily_floor_price
g1: nft
description: Computes daily floor price via 10th percentile of trade amounts.
g2: floor_price
g3: daily_floor_price
g4: Floor Price Evolution
g5: nft.trades table
scope: generic
returns:
- name: day
  type: date
- name: floor
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
