tool_id: nft.holders_timeseries
g1: nft
description: Computes unique holders count daily.
g2: holders
g3: holders_timeseries
g4: Holders Over Time
g5: ERC721 transfers
scope: generic
returns:
- name: day
  type: timestamp
- name: unique_holders
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
