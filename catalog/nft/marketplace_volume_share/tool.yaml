tool_id: nft.marketplace_volume_share
g1: nft
description: Aggregates volume/trades/buyers/sellers by marketplace over time.
g2: marketplace
g3: marketplace_volume_share
g4: Platform Volume Share
g5: Trades by project/platform
scope: generic
returns:
- name: period
  type: string
- name: project
  type: string
- name: volume_usd
  type: number
- name: num_trades
  type: number
- name: unique_buyers
  type: number
- name: unique_sellers
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
