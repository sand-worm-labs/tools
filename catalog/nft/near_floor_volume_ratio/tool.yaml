tool_id: nft.near_floor_volume_ratio
g1: nft
description: Measures volume and count of trades within 120% of daily floor price.
g2: price
g3: near_floor_volume_ratio
g4: Near-floor trading ratio
g5: Daily floor vs trades
scope: generic
returns:
- name: day
  type: date
- name: contract_address
  type: string
- name: near_floor_volume
  type: number
- name: near_floor_count
  type: number
- name: total_volume
  type: number
- name: total_count
  type: number
- name: ratio
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: multiplier
  type: number
  label: Floor multiplier
  default: '1.2'
  required: false
