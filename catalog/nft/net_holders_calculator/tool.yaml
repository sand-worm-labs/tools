tool_id: nft.net_holders_calculator
g1: nft
description: Computes net NFT holdings per wallet via buy-sell balance.
g2: holders
g3: net_holders_calculator
g4: Net holder positions
g5: Buys minus sells
scope: generic
returns:
- name: wallet
  type: string
- name: net_held
  type: number
- name: buys
  type: number
- name: sells
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_net
  type: number
  label: Min net threshold
  default: '1'
  required: false
