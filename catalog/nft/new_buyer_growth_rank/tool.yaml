tool_id: nft.new_buyer_growth_rank
g1: nft
description: Ranks collections by unique first-time buyers.
g2: buyer
g3: new_buyer_growth_rank
g4: New Buyer Leaderboard
g5: NFT Trades Ethereum
scope: generic
returns:
- name: collection
  type: string
- name: new_buyer_count
  type: number
- name: total_volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
