tool_id: nft.new_user_cohort
g1: nft
description: Tracks new vs returning wallets over time.
g2: wallet
g3: new_user_cohort
g4: New vs cumulative users
g5: First trade cohort analysis
scope: generic
returns:
- name: cohort_date
  type: date
- name: new_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
