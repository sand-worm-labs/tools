tool_id: nft.atomic_flip_detector
g1: nft
description: Detects atomic NFT flips where same token bought and sold in same block.
g2: wallet
g3: atomic_flip_detector
g4: Atomic Flips
g5: nft.trades self-join
scope: generic
returns:
- name: token_id
  type: string
- name: sold_date
  type: date
- name: bought_date
  type: date
- name: seller
  type: string
- name: sold_platform
  type: string
- name: bought_platform
  type: string
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
