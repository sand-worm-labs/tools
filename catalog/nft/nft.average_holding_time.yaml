tool_id: nft.average_holding_time
g1: nft
description: Calculates average holding time for current holders using last trade
  lags.
g2: holders
g3: average_holding_time
g4: Holder hold duration
g5: LAG on trades
scope: generic
returns:
- name: avg_hold_days
  type: number
- name: holder_count
  type: number
- name: median_hold_days
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
