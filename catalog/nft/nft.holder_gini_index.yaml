tool_id: nft.holder_gini_index
g1: nft
description: Calculates Gini coefficient for holder concentration evolution.
g2: holders
g3: holder_gini_index
g4: Gini Concentration Index
g5: Balance inequality metric
scope: generic
returns:
- name: period
  type: timestamp
- name: gini
  type: number
- name: unique_holders
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
