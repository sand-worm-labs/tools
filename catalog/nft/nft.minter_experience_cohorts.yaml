tool_id: nft.minter_experience_cohorts
g1: nft
description: Segments minters by prior transaction count.
g2: minter
g3: minter_experience_cohorts
g4: Minter Cohort Distribution
g5: Experience Levels
scope: protocol:ethereum.transactions
returns:
- name: week
  type: date
- name: cohort
  type: string
- name: tx_hash
  type: string
- name: minter
  type: string
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
