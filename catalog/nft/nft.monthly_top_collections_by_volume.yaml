tool_id: nft.monthly_top_collections_by_volume
g1: nft
description: Ranks collections by monthly USD volume using window ranking.
g2: rankings
g3: monthly_top_collections_by_volume
g4: Top monthly NFT volume
g5: nft.trades aggregations
scope: generic
returns:
- name: year
  type: number
- name: month
  type: number
- name: collection
  type: string
- name: volume
  type: number
- name: rank
  type: number
inputs:
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
