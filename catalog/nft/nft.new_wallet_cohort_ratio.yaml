tool_id: nft.new_wallet_cohort_ratio
g1: nft
description: Computes new wallets percentage among unique monthly wallets.
g2: wallet
g3: new_wallet_cohort_ratio
g4: New vs Returning
g5: Wallet Activity Cohorts
scope: generic
returns:
- name: calendar_month
  type: date
- name: unique_wallet_count
  type: number
- name: new_wallet_pct
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: month
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
