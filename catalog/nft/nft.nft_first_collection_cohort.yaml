tool_id: nft.nft_first_collection_cohort
g1: nft
description: Identifies first NFT collection purchased by new users monthly.
g2: cohort
g3: nft_first_collection_cohort
g4: First Purchase Cohort
g5: Buyer Onboarding Trends
scope: generic
returns:
- name: month
  type: date
- name: collection
  type: string
- name: new_buyers
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  default: '2021-06-01'
  required: true
