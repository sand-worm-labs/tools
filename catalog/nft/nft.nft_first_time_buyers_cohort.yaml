tool_id: nft.nft_first_time_buyers_cohort
g1: nft
description: Identifies wallets whose first NFT trade was a buy in target collection.
g2: cohort
g3: nft_first_time_buyers_cohort
g4: First-Time Buyers
g5: Dune NFT.trades
scope: generic
returns:
- name: wallet_address
  type: string
- name: first_buy_time
  type: timestamp
- name: collection
  type: string
inputs:
