tool_id: nft.nft_flipper_detector
g1: nft
description: Counts wallets reselling NFTs within threshold hours.
g2: wallet
g3: nft_flipper_detector
g4: Flipper Count
g5: NFT Trades
scope: generic
returns:
- name: flipper_addresses
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: threshold_hours
  type: number
  label: Threshold Hours
  default: '24'
  required: false
