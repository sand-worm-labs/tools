tool_id: nft.nft_flipper_profits
g1: nft
g2: wallet
g3: nft_flipper_profits
g4: Flipper Profit Ranking
g5: nft.trades self-join
description: Ranks wallets by profit from buying and reselling same NFTs.
scope: generic
returns:
- name: buyer
  type: string
- name: profit
  type: number
- name: txns
  type: number
inputs:
- key: date
  label: Date
  type: date_range
  required: true
- key: chain
  label: Chain
  type: chain
  required: false
  default: ethereum
- key: min_usd
  label: Min USD
  type: number
  required: false
  default: '0'
