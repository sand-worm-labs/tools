tool_id: nft.nft_holding_time_distribution
g1: nft
g2: holders
g3: nft_holding_time_distribution
g4: Holding Times
g5: Dune NFT.trades
description: Computes max holding time distribution for sold NFTs using last trade lags.
scope: generic
returns:
- name: token_id
  type: string
- name: days_held
  type: number
- name: event
  type: string
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '30'
