tool_id: nft.nft_mom_growth_ranker
g1: nft
description: Ranks NFT collections by month-over-month trading volume growth.
g2: holders
g3: nft_mom_growth_ranker
g4: MoM volume growth
g5: dune nft.trades
scope: generic
returns:
- name: collection
  type: string
- name: this_month_vol
  type: number
- name: last_month_vol
  type: number
- name: growth_pct
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_vol
  type: number
  label: Min Volume USD
  default: '10000'
  required: false
