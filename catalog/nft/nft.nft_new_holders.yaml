tool_id: nft.nft_new_holders
g1: nft
description: Counts new owners per period.
g2: holders
g3: nft_new_holders
g4: New Holders Cohort
g5: ERC721 Transfers
scope: generic
returns:
- name: period
  type: date
- name: new_holders
  type: number
- name: growth_rate
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: month
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
