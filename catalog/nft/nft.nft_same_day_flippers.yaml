tool_id: nft.nft_same_day_flippers
g1: nft
description: Detects same-day NFT flippers via buy-sell matching.
g2: flippers
g3: nft_same_day_flippers
g4: Flipper volume
g5: NFT trades self-join
scope: generic
returns:
- name: dt
  type: date
- name: project
  type: string
- name: eth
  type: number
- name: usd
  type: number
- name: trades
  type: number
- name: unique_buyers
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: time_interval
  type: select
  label: Time Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
