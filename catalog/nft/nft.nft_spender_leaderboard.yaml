tool_id: nft.nft_spender_leaderboard
g1: nft
description: Ranks NFT buyers by spend volume with transaction/NFT count buckets.
g2: marketplace
g3: nft_spender_leaderboard
g4: Top NFT buyer tiers
g5: solana.transactions spend bucketing
scope: protocol:magic_eden
returns:
- name: users
  type: string
- name: spend
  type: number
- name: volume
  type: number
- name: num_nft
