tool_id: nft.nft_trader_profit
g1: nft
description: Computes net profit per wallet as sell volume minus buy volume.
g2: wallet
g3: nft_trader_profit
g4: Trader Net Profit
g5: Buy-Sell Volume Diff
scope: generic
returns:
- name: wallet
  type: string
- name: buy_volume
  type: number
- name: sell_volume
  type: number
- name: profit
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '0'
  required: false
