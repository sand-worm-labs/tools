tool_id: nft.nft_trader_profit_leaderboard
g1: nft
description: Ranks wallets by net profit from NFT buys minus sells.
g2: wallet
g3: nft_trader_profit_leaderboard
g4: Trader Profit Leaderboard
g5: Buy-Sell Profit Calc
scope: generic
returns:
- name: wallet
  type: string
- name: profit_eth
  type: number
- name: total_trades
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_trades
  type: number
  label: Min Trades
  default: '1'
  required: false
