tool_id: nft.nft_wash_trade_detector
g1: nft
description: Detects wash trading via buyer-seller swaps on same NFT token.
g2: wash_trading
g3: nft_wash_trade_detector
g4: Wash Trade Ratio
g5: NFT Trades Cycles
scope: generic
returns:
- name: week
  type: date
- name: project
  type: string
- name: total_tx
  type: number
- name: wash_tx
  type: number
- name: wash_ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: false
