tool_id: nft.opensea_collection_floor
g1: nft
description: Computes floor price, average price, sales count by time interval.
g2: floor
g3: opensea_collection_floor
g4: Floor Metrics
g5: Wyvern AtomicMatch
scope: protocol:opensea
returns:
- name: interval
  type: string
- name: floor_eth
  type: number
- name: avg_eth
  type: number
- name: sales
  type: number
- name: volume_eth
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
