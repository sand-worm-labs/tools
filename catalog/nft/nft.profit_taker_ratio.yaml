tool_id: nft.profit_taker_ratio
g1: nft
description: Computes weekly ratio of sellers profiting above buy price per token.
g2: wallet
g3: profit_taker_ratio
g4: Profit Taker Ratio
g5: NFT trades analysis
scope: generic
returns:
- name: week
  type: date
- name: profit_taker_ratio
  type: number
- name: total_sellers
  type: number
- name: profitable_sellers
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
