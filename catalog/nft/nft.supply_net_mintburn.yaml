tool_id: nft.supply_net_mintburn
g1: nft
description: Tracks supply via net mints and burns over time.
g2: holders
g3: supply_net_mintburn
g4: Cumulative Supply Trend
g5: Net Mint/Burn Events
scope: generic
returns:
- name: date
  type: date
- name: net_supply
  type: number
- name: daily_change
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
