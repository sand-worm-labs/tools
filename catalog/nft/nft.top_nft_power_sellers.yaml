tool_id: nft.top_nft_power_sellers
g1: nft
g2: sellers
g3: top_nft_power_sellers
g4: Top Power Sellers
g5: Dune NFT Trades
description: Ranks sellers by trades, items sold, and USD volume with filters.
scope: generic
returns:
- name: seller
  type: string
- name: num_trades
  type: number
- name: num_items
  type: number
- name: usd_sold
  type: number
inputs:
- key: date
  label: Date
  type: date_range
  required: true
- key: min_usd
  label: Min USD
  type: number
  required: false
  default: '10000'
- key: top_n
  label: Top N
  type: number
  required: false
  default: '100'
