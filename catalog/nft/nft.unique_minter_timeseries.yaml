tool_id: nft.unique_minter_timeseries
g1: nft
description: Tracks unique minters over time.
g2: mints
g3: unique_minter_timeseries
g4: Unique Minters
g5: ERC721 Transfers
scope: generic
returns:
- name: period
  type: timestamp
- name: unique_minters
  type: number
- name: total_mints
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
