tool_id: nft.unique_trader_count_timeseries
g1: nft
description: Counts unique wallets trading (buying or selling) per time period.
g2: wallet
g3: unique_trader_count_timeseries
g4: Unique Traders Weekly
g5: Dune NFT Trades
scope: generic
returns:
- name: calendar_week
  type: date
- name: unique_traders
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
