g2: wallet
g3: wallet_pnl_tracker
g4: Cumulative wallet PnL
g5: Buy/sell cost basis
scope: generic
returns:
- name: date
  type: date
- name: wallet
  type: string
- name: acc_bought
  type: number
- name: acc_sold
  type: number
- name: pnl
