tool_id: nft.wash_trade_scorer
g1: nft
description: Flags wash trades via same-day multiples, self-trades, or cycles.
g2: identity
g3: wash_trade_scorer
g4: Wash trade flags
g5: Circular trade detection
scope: generic
returns:
- name: tx_hash
  type: string
- name: wash_flag
  type: boolean
- name: wash_score
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_trades
  type: number
  label: Min Same-Day Trades
  default: '2'
  required: false
