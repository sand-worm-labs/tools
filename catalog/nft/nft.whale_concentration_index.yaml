tool_id: nft.whale_concentration_index
g1: nft
description: Calculates top holder concentration percentage over time.
g2: holders
g3: whale_concentration_index
g4: Whale Concentration Index
g5: Cumulative Holding Sum
scope: generic
returns:
- name: day
  type: timestamp
- name: top_n_percentage
  type: number
- name: whale_count
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
