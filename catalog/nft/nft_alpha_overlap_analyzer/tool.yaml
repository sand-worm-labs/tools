tool_id: nft.nft_alpha_overlap_analyzer
g1: nft
description: Finds overlapping early buyers between two NFT projects.
g2: wallet
g3: nft_alpha_overlap_analyzer
g4: Alpha Overlap
g5: NFT Trades
scope: generic
returns:
- name: overlapping_buyers
  type: number
- name: buyer
  type: string
inputs:
- key: contract_address1
  type: address
  label: Contract 1
  required: true
- key: contract_address2
  type: address
  label: Contract 2
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '3'
  required: true
