tool_id: nft.nft_cumulative_holders
g1: nft
description: Tracks cumulative unique holders daily.
g2: holders
g3: nft_cumulative_holders
g4: Holders Over Time
g5: ERC721 Transfers
scope: generic
returns:
- name: day
  type: date
- name: unique_holders
  type: number
- name: daily_new
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
