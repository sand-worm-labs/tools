tool_id: nft.nft_holder_growth_timeseries
g1: nft
description: Tracks cumulative unique holders over time.
g2: holders
g3: nft_holder_growth_timeseries
g4: Unique Holders Trend
g5: Daily Wallet Balances
scope: generic
returns:
- name: day
  type: date
- name: unique_holders
  type: number
- name: new_holders
  type: number
- name: growth_pct
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
