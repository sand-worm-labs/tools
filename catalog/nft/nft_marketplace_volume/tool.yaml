tool_id: nft.nft_marketplace_volume
g1: nft
description: Aggregates monthly NFT trading volume classified by marketplace program.
g2: marketplace
g3: nft_marketplace_volume
g4: NFT volume by marketplace
g5: solana.transactions
scope: generic
returns:
- name: month
  type: date
- name: magiceden
  type: number
- name: opensea
  type: number
- name: solanart
  type: number
- name: digitaleyes
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: solana
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
