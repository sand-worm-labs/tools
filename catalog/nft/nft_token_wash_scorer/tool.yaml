tool_id: nft.nft_token_wash_scorer
g1: nft
description: Scores NFT tokens by wash ratio of total trades to unique sellers.
g2: wash_trading
g3: nft_token_wash_scorer
g4: Token Wash Score
g5: Trade to Seller Ratio
scope: generic
returns:
- name: token_id
  type: string
- name: trade_count
  type: number
- name: unique_sellers
  type: number
- name: ratio
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_trades
  type: number
  label: Min Trades
  default: '50'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
