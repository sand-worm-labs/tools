tool_id: nft.nft_trending_floor_prices
g1: nft
description: Computes floor prices for top active NFT collections by recent sales
  count.
g2: collection
g3: nft_trending_floor_prices
g4: Trending collection floors
g5: nft.trades top activity
scope: generic
returns:
- name: nft_contract_address
  type: string
- name: collection
  type: string
- name: hour
  type: timestamp
- name: floor
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_hours
  type: number
  label: Lookback hours
  default: '1'
  required: true
