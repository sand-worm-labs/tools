tool_id: nft.nft_tvl_estimator
g1: nft
description: Estimates TVL using last trade price per token across collection.
g2: holders
g3: nft_tvl_estimator
g4: Collection TVL Estimate
g5: nft.trades last prices
scope: generic
returns:
- name: collection
  type: string
- name: tvl
  type: number
- name: token_count
  type: number
- name: blockchain
  type: string
inputs:
- key: date_to
  type: date
  label: End Date
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
