tool_id: nft.nft_unique_holders_timeseries
g1: nft
description: Tracks daily unique holders over time.
g2: holders
g3: nft_unique_holders_timeseries
g4: Unique Holders Trend
g5: ERC721 Transfers
scope: generic
returns:
- name: day
  type: timestamp
- name: unique_holders
  type: number
- name: cumulative
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
