tool_id: nft.nft_volume_spike_detector
g1: nft
description: Detects collections with volume exceeding 7-day moving average.
g2: anomaly
g3: nft_volume_spike_detector
g4: trending collections
g5: dune nft.trades
scope: generic
returns:
- name: collection
  type: string
- name: date
  type: date
- name: volume
  type: number
- name: avg_volume
  type: number
- name: spike_ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: threshold
  type: number
  label: Spike Threshold
  default: '1.5'
  required: false
- key: date_to
  type: date
  label: End Date
  required: true
