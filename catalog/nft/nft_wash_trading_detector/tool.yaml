tool_id: nft.nft_wash_trading_detector
g1: nft
description: Detects wash trading via repeated seller-buyer cycles on same NFT.
g2: identity
g3: nft_wash_trading_detector
g4: Wash Score
g5: NFT Trades Table
scope: generic
returns:
- name: seller
  type: string
- name: wash_score
  type: number
- name: cycle_count
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  default: looksrare
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
