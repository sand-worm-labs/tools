tool_id: nft.platform_volume_share
g1: nft
description: Pivots volume across platforms by time interval.
g2: marketplace
g3: platform_volume_share
g4: Market Share Pivot
g5: Dune NFT Trades
scope: generic
returns:
- name: period
  type: string
- name: opensea
  type: number
- name: looksrare
  type: number
- name: blur
  type: number
- name: total
  type: number
inputs:
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
