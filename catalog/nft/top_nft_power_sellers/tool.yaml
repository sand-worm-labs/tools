tool_id: nft.top_nft_power_sellers
g1: nft
description: Ranks sellers by trades, items sold, and USD volume with filters.
g2: sellers
g3: top_nft_power_sellers
g4: Top Power Sellers
g5: Dune NFT Trades
scope: generic
returns:
- name: seller
  type: string
- name: num_trades
  type: number
- name: num_items
  type: number
- name: usd_sold
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
