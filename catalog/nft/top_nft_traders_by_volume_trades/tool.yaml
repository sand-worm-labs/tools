tool_id: nft.top_nft_traders_by_volume_trades
g1: nft
description: Identifies top NFT traders combining buy and sell volume with trade count
  thresholds.
g2: traders
g3: top_nft_traders_by_volume_trades
g4: Top NFT Traders
g5: NFT trades v2 beta
scope: generic
returns:
- name: trader
  type: string
- name: volume_k
  type: number
- name: nbr_trades
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: 21 days
  required: false
- key: min_vol_k
  type: number
  label: Min Volume (k USD)
  required: true
- key: min_trades
  type: number
  label: Min Trades
  default: '3'
  required: true
