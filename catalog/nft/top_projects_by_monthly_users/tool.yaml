tool_id: nft.top_projects_by_monthly_users
g1: nft
description: Ranks projects by distinct monthly users with minimum threshold.
g2: collection
g3: top_projects_by_monthly_users
g4: Monthly Active Users
g5: nft.trades table
scope: generic
returns:
- name: month
  type: date
- name: project
  type: string
- name: users
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  default: 12 months ago
  required: false
- key: min_users
  type: number
  label: Min Users
  default: '100'
  required: false
