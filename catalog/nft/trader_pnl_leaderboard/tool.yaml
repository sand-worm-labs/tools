tool_id: nft.trader_pnl_leaderboard
g1: nft
description: Ranks traders by realized PnL from NFT flips.
g2: wallet
g3: trader_pnl_leaderboard
g4: Trader Profit Rank
g5: Buy Sell Matching
scope: generic
returns:
- name: trader
  type: string
- name: profit_usd
  type: number
- name: trade_count
  type: number
- name: roi
  type: number
inputs:
- key: platform
  type: text
  label: Platform
  default: opensea
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '50'
  required: false
