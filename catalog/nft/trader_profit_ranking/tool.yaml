tool_id: nft.trader_profit_ranking
g1: nft
description: Ranks traders by net profit from NFT sales minus purchases.
g2: traders
g3: trader_profit_ranking
g4: Net Profit Leaderboard
g5: Trades self-join
scope: generic
returns:
- name: trader
  type: string
- name: profit
  type: number
- name: sell_volume
  type: number
- name: buy_volume
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
