tool_id: nft.trader_size_distribution
g1: nft
description: Classifies daily traders by volume into small, medium, whales.
g2: wallet
g3: trader_size_distribution
g4: Daily Trader Counts by Size
g5: Ethereum NFT Trades
scope: generic
returns:
- name: day
  type: date
- name: trade_size
  type: string
- name: trader_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
