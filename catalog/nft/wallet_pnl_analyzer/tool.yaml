tool_id: nft.wallet_pnl_analyzer
g1: nft
description: Calculates realized PNL for wallets trading collection.
g2: wallet
g3: wallet_pnl_analyzer
g4: Wallet PNL Distribution
g5: Buy/sell aggregation CTEs
scope: generic
returns:
- name: wallet
  type: string
- name: buy_usd
  type: number
- name: sell_usd
  type: number
- name: pnl_usd
  type: number
- name: roi
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: polygon
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
