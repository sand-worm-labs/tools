tool_id: nft.whale_accumulation_detector
g1: nft
description: Tracks net accumulation (buys minus sells) by whales holding 10+ tokens
  weekly.
g2: holders
g3: whale_accumulation_detector
g4: Whale Net Buys
g5: Holder threshold accumulation
scope: generic
returns:
- name: week
  type: date
- name: whale_buys
  type: number
- name: whale_sells
  type: number
- name: net_accumulation
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: whale_threshold
  type: number
  label: Whale Threshold
  default: '10'
  required: false
