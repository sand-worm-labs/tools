tool_id: perp.nansen_hl_address_perp_trades
g1: perp
description: Hyperliquid perpetual trade history for an address with net PnL after fees and a running cumulative-PnL time series, via the Nansen API.
g2: hyperliquid
g3: nansen_hl_address_perp_trades
g4: Address perp trades
g5: Nansen Hyperliquid address perp trades
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: timestamp
  type: string
- name: side
  type: string
- name: action
  type: string
- name: token_symbol
  type: string
- name: price
  type: number
- name: size
  type: number
- name: value_usd
  type: number
- name: closed_pnl
  type: number
- name: fee_usd
  type: number
- name: fee_token_symbol
  type: string
- name: transaction_hash
  type: string
- name: oid
  type: number
- name: net_pnl_usd
  type: number
- name: cumulative_net_pnl_usd
  type: number
inputs:
- key: address
  type: text
  label: Hyperliquid address
  required: true
  placeholder: "0xa312114b5795dff9b8db50474dd57701aa78ad1e"
  description: 42-character 0x-prefixed hex address.
- key: from_date
  type: text
  label: From date
  required: false
  placeholder: "2025-01-01"
  description: ISO 8601 date or date-time.
- key: to_date
  type: text
  label: To date
  required: false
  placeholder: "2025-01-31"
  description: ISO 8601 date or date-time.
- key: token_symbol
  type: text
  label: Token symbol filter
  required: false
  placeholder: BTC
- key: side
  type: select
  label: Side filter
  required: false
  options:
  - label: Long
    value: Long
  - label: Short
    value: Short
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 50
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: timestamp
  options:
  - label: Timestamp
    value: timestamp
  - label: Size
    value: size
  - label: Fee (USD)
    value: fee_usd
  - label: Closed PnL
    value: closed_pnl
  - label: Price
    value: price
  - label: Value (USD)
    value: value_usd
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
