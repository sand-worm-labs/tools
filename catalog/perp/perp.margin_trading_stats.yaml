tool_id: perp.margin_trading_stats
g1: perp
description: Aggregates margin trades classifying longs/shorts with volume and fees.
g2: trading
g3: margin_trading_stats
g4: GMX trading metrics
g5: Arbitrum logs decoded
scope: protocol:gmx
returns:
- name: time
  type: timestamp
- name: users
  type: number
- name: trades
  type: number
- name: longs
  type: number
- name: shorts
  type: number
- name: volume
  type: number
- name: fees
  type: number
- name: trade_size
  type: number
inputs:
- key: time_scale
  type: text
  label: Time Scale
  default: day
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
