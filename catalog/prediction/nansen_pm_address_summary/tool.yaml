tool_id: prediction.nansen_pm_address_summary
g1: prediction
description: Point-in-time prediction-market trading summary for a wallet (PnL, win rate, markets traded), via the Nansen API.
g2: address
g3: nansen_pm_address_summary
g4: Address summary
g5: Nansen prediction market address summary
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: address
  type: string
- name: first_seen
  type: string
- name: wallet_age_days
  type: number
- name: realized_pnl_usd
  type: number
- name: unrealized_pnl_usd
  type: number
- name: total_pnl_usd
  type: number
- name: markets_won
  type: number
- name: markets_traded
  type: number
- name: win_rate
  type: number
- name: p2p_tokens_sent
  type: number
- name: p2p_tokens_received
  type: number
- name: win_rate_pct
  type: number
- name: realized_pnl_share_pct
  type: number
- name: small_sample_win_rate
  type: boolean
inputs:
- key: address
  type: text
  label: Wallet address
  required: true
  placeholder: '0x1234...'
  description: "Wallet address (hex, with or without 0x prefix). 1-100 characters."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
