tool_id: prediction.nansen_pm_market_event_screener
g1: prediction
description: Screen prediction market events (grouped markets) by status, tags, liquidity, volume, and open interest, via the Nansen API.
g2: market
g3: nansen_pm_market_event_screener
g4: Market event screener
g5: Nansen prediction market event screener
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: event_id
  type: string
- name: event_title
  type: string
- name: tags
  type: string
- name: neg_risk
  type: boolean
- name: market_count
  type: number
- name: total_volume
  type: number
- name: total_volume_24hr
  type: number
- name: total_volume_1wk
  type: number
- name: total_volume_1mo
  type: number
- name: total_liquidity
  type: number
- name: total_open_interest
  type: number
- name: total_volume_change_pct
  type: number
- name: total_traders_24h
  type: number
- name: max_age_hours
  type: number
- name: top_market_id
  type: string
- name: top_market_question
  type: string
- name: top_market_volume_24hr
  type: number
- name: markets
  type: array
- name: volume_to_liquidity_ratio
  type: number
- name: top_market_share_pct
  type: number
- name: fragile_move
  type: boolean
inputs:
- key: query
  type: text
  label: Search query
  required: false
  placeholder: election
  description: "Free-text search over event titles. Max 200 characters."
- key: status
  type: select
  label: Status
  required: false
  default: ''
  options:
  - label: All
    value: ''
  - label: Active
    value: active
  - label: Closed
    value: closed
- key: tags
  type: text
  label: Tags
  required: false
  placeholder: politics,crypto
  description: "Comma-separated. Max 50 tags."
- key: min_liquidity
  type: number
  label: Min liquidity (USD)
  required: false
  default: -1
  min: -1
  description: "-1 means no filter."
- key: max_liquidity
  type: number
  label: Max liquidity (USD)
  required: false
  default: -1
  min: -1
  description: "-1 means no filter."
- key: min_volume_24hr
  type: number
  label: Min 24h volume (USD)
  required: false
  default: -1
  min: -1
  description: "-1 means no filter."
- key: min_open_interest
  type: number
  label: Min open interest (USD)
  required: false
  default: -1
  min: -1
  description: "-1 means no filter."
- key: max_open_interest
  type: number
  label: Max open interest (USD)
  required: false
  default: -1
  min: -1
  description: "-1 means no filter."
- key: max_unique_traders_24h
  type: number
  label: Max unique traders (24h)
  required: false
  default: -1
  min: -1
  description: "-1 means no filter."
- key: neg_risk
  type: select
  label: Negative risk market
  required: false
  default: ''
  options:
  - label: Any
    value: ''
  - label: 'True'
    value: 'true'
  - label: 'False'
    value: 'false'
- key: end_date_after
  type: date
  label: Ends after
  required: false
- key: end_date_before
  type: date
  label: Ends before
  required: false
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: volume_24hr
  options:
  - label: 24h volume
    value: volume_24hr
  - label: Total volume
    value: volume
  - label: 1wk volume
    value: volume_1wk
  - label: 1mo volume
    value: volume_1mo
  - label: Liquidity
    value: liquidity
  - label: Open interest
    value: open_interest
  - label: Unique traders (24h)
    value: unique_traders_24h
  - label: Age (hours)
    value: age_hours
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
