tool_id: prediction.nansen_pm_market_ohlcv
g1: prediction
description: Hourly OHLCV price candles for a prediction market outcome token, via the Nansen API.
g2: market
g3: nansen_pm_market_ohlcv
g4: Market OHLCV
g5: Nansen prediction market OHLCV candles
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: market_id
  type: string
- name: token_id
  type: string
- name: side
  type: string
- name: outcome_index
  type: number
- name: period_start
  type: string
- name: open
  type: number
- name: high
  type: number
- name: low
  type: number
- name: close
  type: number
- name: volume_usd
  type: number
- name: trade_count
  type: number
- name: unique_traders
  type: number
- name: implied_probability_pct
  type: number
- name: period_return_pct
  type: number
- name: volatility_close_std
  type: number
- name: probability_change_over_window_pct
  type: number
- name: fragile_move
  type: boolean
inputs:
- key: market_id
  type: text
  label: Market ID
  required: true
  placeholder: '0x1234...'
  description: "Polymarket market ID. 1-100 characters."
- key: date_range
  type: date_range
  label: Date range
  required: false
  default:
    from: ''
    to: ''
  description: "ISO 8601 date or date-time, e.g. 2025-01-01 or 2025-01-01T00:00:00Z. Leave blank for no filter."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: period_start
  options:
  - label: Period start
    value: period_start
  - label: Volume (USD)
    value: volume_usd
  - label: Trade count
    value: trade_count
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
