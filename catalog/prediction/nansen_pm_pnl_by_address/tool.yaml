tool_id: prediction.nansen_pm_pnl_by_address
g1: prediction
description: Per-market PnL breakdown for a wallet across prediction markets, with win rate, ROI%, and rank, via the Nansen API.
g2: address
g3: nansen_pm_pnl_by_address
g4: PnL by address
g5: Nansen prediction market address PnL
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: address
  type: string
- name: market_id
  type: string
- name: question
  type: string
- name: event_id
  type: string
- name: event_title
  type: string
- name: side_held
  type: string
- name: net_buy_cost_usd
  type: number
- name: net_sell_proceeds_usd
  type: number
- name: redemption_value_usd
  type: number
- name: unrealized_value_usd
  type: number
- name: total_pnl_usd
  type: number
- name: market_resolved
  type: boolean
- name: roi_pct
  type: number
- name: pnl_rank
  type: number
- name: win_rate_pct
  type: number
- name: small_sample_win_rate
  type: boolean
inputs:
- key: address
  type: text
  label: Wallet address
  required: true
  placeholder: '0x1234...'
  description: "Wallet address (hex, with or without 0x prefix). 1-100 characters."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_direction
  type: select
  label: Sort direction (by total PnL)
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
