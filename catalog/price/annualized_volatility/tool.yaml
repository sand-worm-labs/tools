tool_id: price.annualized_volatility
g1: price
description: Computes rolling annualized volatility from daily returns.
g2: volatility
g3: annualized_volatility
g4: Annualized Volatility
g5: prices.usd returns stddev
scope: generic
returns:
- name: day
  type: date
- name: vol_30d
  type: number
- name: vol_90d
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
