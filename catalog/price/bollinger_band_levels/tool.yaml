tool_id: price.bollinger_band_levels
g1: price
description: Computes upper/lower Bollinger bands from SMA and stddev.
g2: technical_analysis
g3: bollinger_band_levels
g4: Bollinger Bands
g5: Price volatility bands
scope: generic
returns:
- name: day
  type: date
- name: close
  type: number
- name: sma30
  type: number
- name: upper_band
  type: number
- name: lower_band
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: false
