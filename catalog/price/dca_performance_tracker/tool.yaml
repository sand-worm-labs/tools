tool_id: price.dca_performance_tracker
g1: price
description: Simulates periodic capital injections at median price with cumulative
  holdings value.
g2: holders
g3: dca_performance_tracker
g4: DCA stack value
g5: Layer1 median prices
scope: generic
returns:
- name: price_date
  type: date
- name: median_price
  type: number
- name: btc_stack
  type: number
- name: stack_usd
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  default: BTC
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '730'
  required: true
