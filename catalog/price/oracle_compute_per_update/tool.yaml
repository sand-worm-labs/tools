tool_id: price.oracle_compute_per_update
g1: price
description: Calculates average compute units per oracle price update.
g2: oracle
g3: oracle_compute_per_update
g4: Compute per Price Update
g5: Compute Budget Parsing
scope: generic
returns:
- name: oracle
  type: string
- name: avg_cu_per_update
  type: number
- name: update_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: oracle_address
  type: address
  label: Oracle Address
  required: true
- key: lookback_hours
  type: number
  label: Lookback Hours
  default: '1'
  required: false
