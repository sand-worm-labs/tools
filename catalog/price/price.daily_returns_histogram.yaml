tool_id: price.daily_returns_histogram
g1: price
description: Computes daily returns with lag comparison for single or paired tokens.
g2: volatility
g3: daily_returns_histogram
g4: Daily price returns
g5: Layer1 USD prices
scope: generic
returns:
- name: day
  type: date
- name: avg_price
  type: number
- name: pct_change
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  default: ETH
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
