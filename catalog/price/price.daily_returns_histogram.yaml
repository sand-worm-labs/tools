tool_id: price.daily_returns_histogram
g1: price
g2: volatility
g3: daily_returns_histogram
g4: Daily price returns
g5: Layer1 USD prices
description: Computes daily returns with lag comparison for single or paired tokens.
scope: generic
returns:
- name: day
  type: date
- name: avg_price
  type: number
- name: pct_change
  type: number
inputs:
- key: token_symbol
  label: Token Symbol
  type: text
  required: true
  default: ETH
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '365'
