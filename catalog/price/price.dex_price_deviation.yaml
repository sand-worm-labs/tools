tool_id: price.dex_price_deviation
g1: price
description: Detects deviations between DEX trade prices and oracle prices with stddev
  scoring.
g2: oracle
g3: dex_price_deviation
g4: DEX vs Oracle Errors
g5: Prices USD + DEX Trades
scope: generic
returns:
- name: timestamp
  type: timestamp
- name: blockchain
  type: string
- name: error
  type: number
- name: stddev
  type: number
- name: is_outlier
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '0.01'
  required: false
