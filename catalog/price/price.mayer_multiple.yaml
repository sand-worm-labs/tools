tool_id: price.mayer_multiple
g1: price
description: Calculates Mayer Multiple as price over long-term moving average.
g2: technicals
g3: mayer_multiple
g4: Mayer Multiple
g5: prices.usd window functions
scope: generic
returns:
- name: day
  type: date
- name: price
  type: number
- name: ma_short
  type: number
- name: ma_long
  type: number
- name: multiple
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: ma_short
  type: number
  label: Short MA Periods
  default: '30'
  required: false
- key: ma_long
  type: number
  label: Long MA Periods
  default: '200'
  required: false
