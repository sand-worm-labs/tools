tool_id: price.peg_deviation
g1: price
description: Measures deviation from $1 peg for stables.
g2: stablecoin
g3: peg_deviation
g4: Stable Peg Deviation
g5: prices.usd depeg
scope: generic
returns:
- name: day
  type: date
- name: depeg_pct
  type: number
- name: volatility
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  default: USDC
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
