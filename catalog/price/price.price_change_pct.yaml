tool_id: price.price_change_pct
g1: price
description: Calculates 24h, 7d, or custom period price change percentage.
g2: token
g3: price_change_pct
g4: Price Change Percent
g5: prices.usd
scope: generic
returns:
- name: current_price
  type: number
- name: prior_price
  type: number
- name: pct_change
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '1'
  required: true
