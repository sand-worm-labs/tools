tool_id: price.return_skewness_kurtosis
g1: price
description: Computes daily return statistics including average, standard deviation,
  skewness, and kurtosis.
g2: stats
g3: return_skewness_kurtosis
g4: Return Distribution Metrics
g5: Dune prices.usd
scope: generic
returns:
- name: day
  type: date
- name: avg_return
  type: number
- name: std_dev
  type: number
- name: skewness
  type: number
- name: kurtosis
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
