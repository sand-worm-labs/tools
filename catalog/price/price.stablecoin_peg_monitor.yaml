tool_id: price.stablecoin_peg_monitor
g1: price
g2: stablecoin
g3: stablecoin_peg_monitor
g4: Peg Deviation Tracker
g5: Dune Prices USD
description: Tracks peg deviation and volatility for stablecoins over time.
scope: generic
returns:
- name: hour
  type: string
- name: symbol
  type: string
- name: peg_diff
  type: number
- name: volatility
  type: number
inputs:
- key: symbols
  label: Stablecoins
  type: text
  required: true
  default: '"USDC,USDT,DAI,FRAX"'
- key: interval
  label: Interval
  type: text
  required: false
  default: '"hour"'
- key: date_from
  label: Start Date
  type: date
  required: true
