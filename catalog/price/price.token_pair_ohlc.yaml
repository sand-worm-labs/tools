tool_id: price.token_pair_ohlc
g1: price
description: Generates OHLCV candles from DEX trades.
g2: dex
g3: token_pair_ohlc
g4: OHLC from Trades
g5: dex.trades window agg
scope: generic
returns:
- name: open_time
  type: timestamp
- name: open
  type: number
- name: high
  type: number
- name: low
  type: number
- name: close
  type: number
- name: volume
  type: number
inputs:
- key: token_a_symbol
  type: text
  label: Base Token
  required: true
- key: token_b_symbol
  type: text
  label: Quote Token
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
