tool_id: price.token_price_timeseries
g1: price
description: Fetches historical prices aggregated by interval for any token.
g2: token
g3: token_price_timeseries
g4: Token Price History
g5: prices.usd
scope: generic
returns:
- name: time
  type: timestamp
- name: avg_price
  type: number
- name: min_price
  type: number
- name: max_price
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
