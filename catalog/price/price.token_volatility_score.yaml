tool_id: price.token_volatility_score
g1: price
g2: volatility
g3: token_volatility_score
g4: Volatility Metrics
g5: prices.usd window functions
description: Calculates daily returns, rolling volatility, and stddev.
scope: generic
returns:
- name: day
  type: string
- name: daily_return
  type: number
- name: vol_14d
  type: number
- name: vol_30d
  type: number
inputs:
- key: token_symbol
  label: Token Symbol
  type: text
  required: true
- key: chain
  label: Chain
  type: chain
  required: false
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '180'
