tool_id: price.top_token_returns
g1: price
description: Ranks tokens by hourly returns over lookback period.
g2: performance
g3: top_token_returns
g4: Hourly Return Leaderboard
g5: LAG percentage change
scope: generic
returns:
- name: ts
  type: timestamp
- name: symbol
  type: string
- name: r
  type: number
inputs:
- key: symbols
  type: text
  label: Token Symbols
  default: BTC,ETH,SOL
  required: true
- key: lookback_hours
  type: number
  label: Lookback Hours
  default: '24'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '3'
  required: false
