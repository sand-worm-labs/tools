tool_id: price.weekday_price_dispersion
g1: price
g2: volatility
g3: weekday_price_dispersion
g4: Daily price range by weekday
g5: Layer1 USD prices
description: Computes intraday price dispersion relative to start-of-day price by weekday.
scope: generic
returns:
- name: weekday
  type: number
- name: min_px
  type: number
- name: max_px
  type: number
- name: dispersion_pct
  type: number
inputs:
- key: token_symbol
  label: Token Symbol
  type: text
  required: true
- key: number_of_days
  label: Days Back
  type: number
  required: true
  default: '30'
