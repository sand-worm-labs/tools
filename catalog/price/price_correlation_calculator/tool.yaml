tool_id: price.price_correlation_calculator
g1: price
description: Calculates daily returns and correlations across tokens.
g2: correlation
g3: price_correlation_calculator
g4: Price Correlation Matrix
g5: Multi-token daily prices
scope: generic
returns:
- name: day
  type: date
- name: sol_price
  type: number
- name: btc_price
  type: number
- name: eth_price
  type: number
- name: sol_return
  type: number
- name: corr_sol_btc
  type: number
inputs:
- key: token_symbols
  type: text
  label: Tokens
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
