tool_id: price.sharpe_sortino_ratios
g1: price
description: Calculates Sharpe and Sortino ratios from monthly returns.
g2: risk
g3: sharpe_sortino_ratios
g4: Risk-Adjusted Returns
g5: Dune prices.usd
scope: generic
returns:
- name: year
  type: number
- name: month
  type: number
- name: sharpe
  type: number
- name: sortino
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: timerange
  type: text
  label: Time Range
  required: false
