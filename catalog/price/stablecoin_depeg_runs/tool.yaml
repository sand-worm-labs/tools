tool_id: price.stablecoin_depeg_runs
g1: price
description: Detects consecutive depeg minutes exceeding threshold by chain.
g2: stablecoin
g3: stablecoin_depeg_runs
g4: Depeg Duration Runs
g5: prices.usd LAG analysis
scope: generic
returns:
- name: day
  type: date
- name: minute
  type: timestamp
- name: blockchain
  type: string
- name: run_duration
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  default: USDT
  required: true
- key: threshold_pct
  type: number
  label: Depeg Threshold %
  default: '5'
  required: false
- key: chain
  type: chain
  label: Chain
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
