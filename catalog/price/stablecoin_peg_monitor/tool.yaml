tool_id: price.stablecoin_peg_monitor
g1: price
description: Tracks peg deviation and volatility for stablecoins over time.
g2: stablecoin
g3: stablecoin_peg_monitor
g4: Peg Deviation Tracker
g5: Dune Prices USD
scope: generic
returns:
- name: hour
  type: timestamp
- name: symbol
  type: string
- name: peg_diff
  type: number
- name: volatility
  type: number
inputs:
- key: symbols
  type: text
  label: '"Stablecoins"'
  default: '"USDC,USDT,DAI,FRAX"'
  required: true
- key: interval
  type: select
  label: Interval
  default: hour
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
