tool_id: price.token_volatility_calculator
g1: price
description: Computes rolling annualized volatility from log returns.
g2: volatility
g3: token_volatility_calculator
g4: Annualized Volatility
g5: prices.usd rolling stddev
scope: generic
returns:
- name: day
  type: date
- name: volatility_30d
  type: number
- name: volatility_90d
  type: number
- name: volatility_200d
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
