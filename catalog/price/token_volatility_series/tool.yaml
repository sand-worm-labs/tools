tool_id: price.token_volatility_series
g1: price
description: Calculates annualized volatility from daily log returns.
g2: volatility
g3: token_volatility_series
g4: Volatility Series
g5: daily returns stddev
scope: generic
returns:
- name: day
  type: date
- name: volatility
  type: number
inputs:
- key: token_symbol
  type: text
  label: Token Symbol
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '180'
  required: false
