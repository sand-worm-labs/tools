tool_id: primitives.erc20_transfers
g1: primitives
description: Full transfer log for any ERC20 token with optional wallet filter.
g2: transfers
g3: erc20_transfers
g4: ERC20 transfer history
g5: ERC20 Transfer events
scope: generic
returns:
- name: block_time
  type: timestamp
- name: block_number
  type: number
- name: tx_hash
  type: string
- name: blockchain
  type: string
- name: token_address
  type: string
- name: symbol
  type: string
- name: from
  type: string
- name: to
  type: string
- name: amount
  type: number
- name: amount_raw
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: token_address
  type: token_address
  label: Token address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: wallet
  type: address
  label: Filter by wallet (optional)
  required: false
  default: ''
  placeholder: 0x...
- key: limit
  type: number
  label: Row limit (blank for no limit)
  default: '100'
  required: false
