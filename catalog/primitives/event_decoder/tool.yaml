tool_id: primitives.event_decoder
g1: primitives
description: Raw decoded event logs for any contract filtered by event name.
g2: logs
g3: event_decoder
g4: Event log decoder
g5: Decoded contract event logs
scope: generic
returns:
- name: block_time
  type: timestamp
- name: block_number
  type: number
- name: tx_hash
  type: string
- name: contract_address
  type: string
- name: topic1
  type: string
- name: topic2
  type: string
- name: topic3
  type: string
- name: data
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  - label: Fantom
    value: fantom
    icon: https://icons.llamao.fi/icons/chains/rsz_fantom.jpg
  - label: Gnosis
    value: gnosis
    icon: https://icons.llamao.fi/icons/chains/rsz_gnosis.jpg
  - label: Linea
    value: linea
    icon: https://icons.llamao.fi/icons/chains/rsz_linea.jpg
  - label: Scroll
    value: scroll
    icon: https://icons.llamao.fi/icons/chains/rsz_scroll.jpg
  - label: Blast
    value: blast
    icon: https://icons.llamao.fi/icons/chains/rsz_blast.jpg
  - label: zkSync Era
    value: zksync
    icon: https://icons.llamao.fi/icons/chains/rsz_zksync_era.jpg
  required: true
- key: contract_address
  type: address
  label: Contract address
  required: true
  placeholder: 0x...
- key: event_name
  type: text
  label: Event name
  required: true
  placeholder: e.g. Transfer, Swap, Attested
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
- key: limit
  type: select
  label: Row limit
  default: '100'
  options:
  - label: Top 10
    value: '10'
  - label: Top 25
    value: '25'
  - label: Top 50
    value: '50'
  - label: Top 100
    value: '100'
  required: true
