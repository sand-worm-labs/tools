tool_id: primitives.gas_analysis
g1: primitives
description: Gas spent breakdown for a wallet — daily totals, average gas price, fees
  in ETH.
g2: gas
g3: gas_analysis
g4: Gas usage analysis
g5: Wallet gas spend breakdown
scope: generic
returns:
- name: day
  type: timestamp
- name: tx_count
  type: number
- name: total_gas_used
  type: number
- name: avg_gas_price_gwei
  type: number
- name: total_fees_eth
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  - label: Fantom
    value: fantom
    icon: https://icons.llamao.fi/icons/chains/rsz_fantom.jpg
  - label: Gnosis
    value: gnosis
    icon: https://icons.llamao.fi/icons/chains/rsz_gnosis.jpg
  - label: Linea
    value: linea
    icon: https://icons.llamao.fi/icons/chains/rsz_linea.jpg
  - label: Scroll
    value: scroll
    icon: https://icons.llamao.fi/icons/chains/rsz_scroll.jpg
  - label: Blast
    value: blast
    icon: https://icons.llamao.fi/icons/chains/rsz_blast.jpg
  - label: zkSync Era
    value: zksync
    icon: https://icons.llamao.fi/icons/chains/rsz_zksync_era.jpg
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '30'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
