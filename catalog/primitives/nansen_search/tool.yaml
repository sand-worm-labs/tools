tool_id: primitives.nansen_search
g1: primitives
description: Search Nansen for tokens and named entities (funds, exchanges, labeled wallets) by name, symbol, or address; token results include a 24h volume-to-market-cap turnover ratio, via the Nansen API.
g2: search
g3: nansen_search
g4: Nansen search
g5: Nansen token and entity search
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: result_kind
  type: string
- name: name
  type: string
- name: symbol
  type: string
- name: chain
  type: string
- name: address
  type: string
- name: price
  type: number
- name: volume_24h
  type: number
- name: market_cap
  type: number
- name: rank
  type: number
- name: tags
  type: string
- name: turnover_24h_pct_mcap
  type: number
inputs:
- key: search_query
  type: text
  label: Search query
  required: true
  placeholder: AAVE
  description: Free-text search term (token name, symbol, address, or entity name). 1-200 characters.
- key: result_type
  type: select
  label: Result type
  required: false
  default: any
  options:
  - label: Any
    value: any
  - label: Token
    value: token
  - label: Entity
    value: entity
- key: chain
  type: text
  label: Chain
  required: false
  placeholder: ethereum
  description: Optional chain filter, e.g. ethereum, solana, base.
- key: limit
  type: number
  label: Limit
  required: false
  default: 25
  min: 1
  max: 50
