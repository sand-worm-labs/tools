tool_id: primitives.token_holders
g1: primitives
description: Top holders for any ERC20 token with supply concentration metrics.
g2: holders
g3: token_holders
g4: Token holder distribution
g5: ERC20 holder balances
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: token_address
  type: token_address
  label: Token address
  required: true
  placeholder: 0x...
- key: top_n
  type: select
  label: Show top N holders
  default: '100'
  options:
  - label: Top 10
    value: '10'
  - label: Top 25
    value: '25'
  - label: Top 50
    value: '50'
  - label: Top 100
    value: '100'
  required: true
