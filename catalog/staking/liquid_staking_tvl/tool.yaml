tool_id: staking.liquid_staking_tvl
g1: staking
description: TVL and market share over time for liquid staking protocols.
g2: liquid_staking
g3: liquid_staking_tvl
g4: Liquid staking TVL
g5: Liquid staking protocol TVL
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol
  type: select
  label: Protocol
  default: all
  options:
  - label: All protocols
    value: all
  - label: Lido
    value: lido
  - label: Rocket Pool
    value: rocketpool
  - label: Coinbase cbETH
    value: cbeth
  - label: Frax
    value: frax
  - label: StakeWise
    value: stakewise
  required: true
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
