tool_id: staking.rewards
g1: staking
description: Cumulative staking rewards earned by a withdrawal address over time.
g2: rewards
g3: rewards
g4: Staking rewards tracker
g5: Cumulative staking rewards
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  required: true
- key: withdrawal_address
  type: address
  label: Withdrawal address
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
