tool_id: staking.restaking
g1: staking
description: Restaking deposits, AVS selection, and operator delegation on EigenLayer.
g2: restaking
g3: restaking
g4: Restaking analysis (EigenLayer)
g5: EigenLayer restaking deposits
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  required: true
- key: avs_address
  type: address
  label: AVS address (optional — leave empty for all)
  required: false
  placeholder: 0x...
- key: days
  type: select
  label: Time range
  default: '90'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
