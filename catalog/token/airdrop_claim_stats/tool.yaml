tool_id: token.airdrop_claim_stats
g1: token
description: Computes total claimed amount, unique claimers, and percentages.
g2: airdrop
g3: airdrop_claim_stats
g4: Claim metrics
g5: transfer aggregates
scope: generic
returns:
- name: total_claimed
  type: number
- name: unique_claimers
  type: number
- name: perc_claimed
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: exec_account
  type: text
  label: Executor account
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
