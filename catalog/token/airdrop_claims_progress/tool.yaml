tool_id: token.airdrop_claims_progress
g1: token
description: Tracks daily and cumulative airdrop claims with completion percentage.
g2: airdrop
g3: airdrop_claims_progress
g4: Claims Progress
g5: ERC20 transfers
scope: protocol:dydx
returns:
- name: day
  type: date
- name: daily_claimers
  type: number
- name: total_claimers
  type: number
- name: claimers_pct
  type: string
- name: daily_claims
  type: number
- name: total_claims
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: claim_contract
  type: address
  label: Claim Contract
  required: true
- key: total_eligible
  type: number
  label: Total Eligible
  required: true
