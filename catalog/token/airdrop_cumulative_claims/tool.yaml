tool_id: token.airdrop_cumulative_claims
g1: token
description: Computes cumulative claims over time.
g2: airdrop
g3: airdrop_cumulative_claims
g4: Cumulative Airdrop Claims
g5: ERC20 Claim Transfers
scope: generic
returns:
- name: block_date
  type: date
- name: cumulative_claim
  type: number
- name: claim_address
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
