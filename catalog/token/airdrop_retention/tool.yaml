tool_id: token.airdrop_retention
g1: token
description: Computes percentage of airdrop wallets still holding no outflows.
g2: airdrop
g3: airdrop_retention
g4: Airdrop Retention Ratio
g5: ERC20 Transfers
scope: generic
returns:
- name: total_wallets
  type: number
- name: still_holding
  type: number
- name: retention_ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: airdrop_from
  type: address
  label: Airdropper Address
  required: true
