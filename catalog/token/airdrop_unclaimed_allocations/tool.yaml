tool_id: token.airdrop_unclaimed_allocations
g1: token
description: Extracts and unnests airdrop allocations from events.
g2: airdrop
g3: airdrop_unclaimed_allocations
g4: Unclaimed Airdrop List
g5: Zora Allocations Decode
scope: generic
returns:
- name: allocation
  type: number
- name: tx_hash
  type: string
- name: block_time
  type: timestamp
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Airdrop distributor contract
  required: true
  placeholder: 0x...
- key: claimer_address
  type: address
  label: Claimer
  required: false
