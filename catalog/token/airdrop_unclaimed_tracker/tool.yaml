tool_id: token.airdrop_unclaimed_tracker
g1: token
description: Calculates cumulative claimed vs total airdrop allocation.
g2: airdrop
g3: airdrop_unclaimed_tracker
g4: Unclaimed Tokens
g5: ERC20 Distributor Flows
scope: generic
returns:
- name: claim_date
  type: date
- name: total_allocated_usd
  type: number
- name: claimed_usd
  type: number
- name: unclaimed_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Airdrop distributor contract
  required: true
  placeholder: 0x...
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
