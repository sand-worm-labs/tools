tool_id: token.arb_protocol_grants
g1: token
description: Totals ARB grants distributed to protocols by category.
g2: grants
g3: arb_protocol_grants
g4: ARB grants by protocol
g5: Projects + transfer joins
scope: generic
returns:
- name: protocol
  type: string
- name: category
  type: string
- name: total_amount
  type: number
- name: grant_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: arbitrum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: treasury_address
  type: address
  label: Grants treasury / disbursing address
  required: true
  placeholder: 0x...
- key: category
  type: text
  label: Category
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: '2024-01-31'
    from: '2023-11-01'
  required: true
