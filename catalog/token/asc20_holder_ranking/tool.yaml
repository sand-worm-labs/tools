tool_id: token.asc20_holder_ranking
g1: token
description: Ranks wallets by ASC-20 inscription holdings from mint transactions.
g2: holders
g3: asc20_holder_ranking
g4: Inscription Holder Ranks
g5: Avalanche ASC-20 Mints
scope: generic
returns:
- name: rank
  type: number
- name: wallet_address
  type: string
- name: inscriptions
  type: number
- name: total_tokens
  type: number
inputs:
- key: mint_pattern
  type: text
  label: Mint Data Pattern
  required: true
- key: total_supply
  type: number
  label: Total Supply
  default: '21000000'
  required: false
