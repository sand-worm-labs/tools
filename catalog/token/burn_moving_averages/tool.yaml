tool_id: token.burn_moving_averages
g1: token
description: Calculates daily burns with moving averages for trends.
g2: burns
g3: burn_moving_averages
g4: Burn trends
g5: ERC20 transfers
scope: generic
returns:
- name: day
  type: date
- name: total_burn
  type: number
- name: ma46
  type: number
- name: ma200
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: burn_addresses
  type: address[]
  label: Burn addresses
  default:
  - '0x0000000000000000000000000000000000000000'
  - '0x000000000000000000000000000000000000dEaD'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: true
