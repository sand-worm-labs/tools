tool_id: token.buyer_cohort_analysis
g1: token
description: Classifies buyers as new or repeat users per time period.
g2: wallet
g3: buyer_cohort_analysis
g4: New vs repeat buyers
g5: ERC20 transfers
scope: generic
returns:
- name: period
  type: string
- name: new_buyers
  type: number
- name: repeat_buyers
  type: number
- name: repeat_pct
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: week
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
