tool_id: token.cex_dispatch_detector
g1: token
description: Detects wallets receiving from a CEX then dispatching many small native-token
  amounts (a common sybil-funding fan-out pattern).
g2: wallet
g3: cex_dispatch_detector
g4: CEX Dispatch Patterns
g5: Chain traces + labels.addresses
scope: generic
returns:
- name: wallet
  type: string
- name: dispatch_score
  type: number
- name: dispatch_count
  type: number
- name: suspicious
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: days_back
  type: number
  label: Days Back
  default: '7'
  required: true
- key: min_transfer_in_sum_amount
  type: number
  label: Min Inflow (native token)
  default: '50'
  required: false
- key: single_transfer_out_min_amount
  type: number
  label: Min Outflow per dispatch (native token)
  default: '0.1'
  required: false
