tool_id: token.cex_net_flow_daily
g1: token
description: Aggregates daily inflows minus outflows to CEX wallets.
g2: cex
g3: cex_net_flow_daily
g4: CEX Net Flow Daily
g5: ERC20 Transfers
scope: generic
returns:
- name: day
  type: date
- name: net_flow
  type: number
- name: inflow
  type: number
- name: outflow
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: cex_addresses
  type: address[]
  label: CEX Addresses
  default: []
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
