tool_id: token.cross_chain_token_matcher
g1: token
description: Matches identical, recently-active token symbols across two chains.
g2: identity
g3: cross_chain_token_matcher
g4: Symbol Matches
g5: ERC20 metadata
scope: generic
returns:
- name: symbol
  type: string
- name: decimals
  type: number
- name: blockchain_a
  type: string
- name: contract_a
  type: string
- name: blockchain_b
  type: string
- name: contract_b
  type: string
inputs:
- key: chain_a
  type: chain
  label: Chain A
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: chain_b
  type: chain
  label: Chain B
  default: base
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
