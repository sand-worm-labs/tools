tool_id: token.cumulative_supply
g1: token
description: Tracks daily token supply changes and cumulative total supply.
g2: holders
g3: cumulative_supply
g4: Daily supply changes
g5: Circulating supply
scope: generic
returns:
- name: day
  type: date
- name: daily_change
  type: number
- name: total_supply
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
