tool_id: token.cumulative_token_holders
g1: token
description: Tracks cumulative unique holders and daily new holders over time.
g2: holders
g3: cumulative_token_holders
g4: Holder growth
g5: ERC20 transfers
scope: generic
returns:
- name: date
  type: date
- name: daily_new
  type: number
- name: cumulative_holders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
