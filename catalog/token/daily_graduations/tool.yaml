tool_id: token.daily_graduations
g1: token
description: Counts graduated tokens per launchpad daily.
g2: launchpad
g3: daily_graduations
g4: Daily Graduates
g5: First DEX trade proxy
scope: generic
returns:
- name: date
  type: date
- name: platform
  type: string
- name: graduates
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: base
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol
  type: text
  label: Protocol
  default: clanker
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: false
