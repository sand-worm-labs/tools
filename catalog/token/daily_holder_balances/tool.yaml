tool_id: token.daily_holder_balances
g1: token
description: Calculates historical daily token balances per holder using net flows.
g2: holders
g3: daily_holder_balances
g4: Daily Holder Balances
g5: Cumulative Flow Windows
scope: generic
returns:
- name: date
  type: date
- name: address
  type: string
- name: balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
