tool_id: token.daily_holder_count
g1: token
description: Tracks daily unique holder count using running balance snapshots.
g2: holders
g3: daily_holder_count
g4: Holder Growth
g5: Cumulative window
scope: generic
returns:
- name: day
  type: date
- name: holder_count
  type: number
- name: growth_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
