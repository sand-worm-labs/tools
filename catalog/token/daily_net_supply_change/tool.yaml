tool_id: token.daily_net_supply_change
g1: token
description: Daily net supply from mints minus burns with cumulative.
g2: supply
g3: daily_net_supply_change
g4: Mint Burn Net
g5: Cumulative Supply
scope: generic
returns:
- name: day
  type: date
- name: net_change
  type: number
- name: cumulative_supply
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
