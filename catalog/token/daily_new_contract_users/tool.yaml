tool_id: token.daily_new_contract_users
g1: token
description: Counts daily new addresses first interacting with contract.
g2: holders
g3: daily_new_contract_users
g4: Daily new interactors
g5: First tx cohort analysis
scope: generic
returns:
- name: date
  type: date
- name: new_addresses
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
