tool_id: token.deposit_amount_distribution
g1: token
description: Buckets deposit amounts by size ranges for analysis.
g2: holders
g3: deposit_amount_distribution
g4: Deposit size cohorts
g5: traces input parsing
scope: generic
returns:
- name: amount_range
  type: string
- name: deposit_count
  type: number
- name: total_amount
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_usd
  type: number
  label: Min amount (native token units)
  description: Native-token-unit floor — no USD price conversion is applied.
  default: '0'
  required: false
