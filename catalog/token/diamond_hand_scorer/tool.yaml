tool_id: token.diamond_hand_scorer
g1: token
description: Identifies diamond hand holders with high net buy low sell.
g2: holders
g3: diamond_hand_scorer
g4: Low-sell high-hold wallets
g5: Net balance thresholds
scope: generic
returns:
- name: wallet_address
  type: string
- name: net_balance
  type: number
- name: sell_ratio
  type: number
- name: diamond_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_hold
  type: number
  label: Min net hold
  default: '1000'
  required: true
- key: max_sell_pct
  type: number
  label: Max sell %
  default: '0.1'
  required: true
