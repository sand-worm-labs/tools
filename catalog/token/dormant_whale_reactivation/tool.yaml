tool_id: token.dormant_whale_reactivation
g1: token
description: Detects wallets inactive over threshold with recent large transfers.
g2: wallet
g3: dormant_whale_reactivation
g4: Dormant Whale Alerts
g5: Holder inactivity + large moves
scope: generic
returns:
- name: address
  type: string
- name: last_activity
  type: timestamp
- name: recent_amount
  type: number
- name: usdt_amount
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '100000'
  required: true
