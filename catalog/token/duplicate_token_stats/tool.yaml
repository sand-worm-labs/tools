tool_id: token.duplicate_token_stats
g1: token
description: Detects duplicate tokens by name/symbol, counts instances and lifespan.
g2: duplicates
g3: duplicate_token_stats
g4: Duplicate token analysis
g5: Name/symbol copycats
scope: generic
returns:
- name: token_name
  type: string
- name: token_symbol
  type: string
- name: unique_tokens
  type: number
- name: first_created
  type: timestamp
- name: last_created
  type: timestamp
- name: time_span
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
