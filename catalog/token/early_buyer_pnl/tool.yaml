tool_id: token.early_buyer_pnl
g1: token
description: Calculates PNL for early buyers with first buy time.
g2: holders
g3: early_buyer_pnl
g4: First buyer profitability
g5: Dune dex_solana.trades
scope: generic
returns:
- name: trader_id
  type: string
- name: first_buy_time
  type: timestamp
- name: total_usd_b
  type: number
- name: total_usd_s
  type: number
- name: pnl
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
