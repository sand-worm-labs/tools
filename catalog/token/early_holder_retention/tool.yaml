tool_id: token.early_holder_retention
g1: token
description: Analyzes first N buyers' initial buys and current holdings for retention.
g2: holders
g3: early_holder_retention
g4: Early Buyer Retention
g5: First 100 buyers hold
scope: generic
returns:
- name: address
  type: string
- name: initial_balance
  type: number
- name: current_hold
  type: number
- name: retention
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: start_block
  type: number
  label: Start block
  description: EVM block number to start scanning buyers from (equivalent to a launch block).
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
