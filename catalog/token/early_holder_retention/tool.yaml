tool_id: token.early_holder_retention
g1: token
description: Analyzes first N buyers' initial buys and current holdings for retention.
g2: holders
g3: early_holder_retention
g4: Early Buyer Retention
g5: First 100 buyers hold
scope: generic
returns:
- name: address
  type: string
- name: initial_balance
  type: number
- name: current_hold
  type: number
- name: retention
  type: boolean
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: start_slot
  type: number
  label: '"Start slot"'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
