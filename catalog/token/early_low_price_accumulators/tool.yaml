tool_id: token.early_low_price_accumulators
g1: token
description: Detects early buyers below price threshold by cohort.
g2: holders
g3: early_low_price_accumulators
g4: Early Whale Buyers
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: total_usd
  type: number
- name: total_tokens
  type: number
- name: avg_price
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: price_threshold
  type: number
  label: Price Threshold
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
