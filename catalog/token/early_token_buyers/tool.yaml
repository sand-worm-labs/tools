tool_id: token.early_token_buyers
g1: token
description: Identifies earliest buyers within launch window for accumulation signals.
g2: holders
g3: early_token_buyers
g4: First Token Buyers
g5: Dune dex.trades
scope: generic
returns:
- name: wallet_address
  type: string
- name: first_buy_time
  type: timestamp
- name: buy_amount
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '1'
  required: true
