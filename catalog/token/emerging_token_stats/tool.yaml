tool_id: token.emerging_token_stats
g1: token
description: Summarizes trading stats for recently active tokens like traders, volume,
  lifespan.
g2: dex
g3: emerging_token_stats
g4: New Token Metrics
g5: Dune dex.trades
scope: generic
returns:
- name: token_symbol
  type: string
- name: unique_traders
  type: number
- name: total_trades
  type: number
- name: total_volume
  type: number
- name: first_trade
  type: string
- name: last_trade
  type: string
- name: avg_trade_size
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10'
  required: false
