tool_id: token.hodl_wave_distribution
g1: token
description: Estimates HODL waves from sampled recent active holders.
g2: holders
g3: hodl_wave_distribution
g4: Holder Age Distribution
g5: Ethereum Transactions
scope: generic
returns:
- name: address
  type: string
- name: first_tx
  type: string
- name: last_tx
  type: string
- name: age_days
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: sample_size
  type: number
  label: Sample Size
  default: '1000'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: false
