tool_id: token.holder_dormancy_analyzer
g1: token
description: Classifies holders by first/last activity timestamps.
g2: holders
g3: holder_dormancy_analyzer
g4: Dormancy Metrics
g5: Transfer events
scope: generic
returns:
- name: holder
  type: string
- name: days_since_first
  type: number
- name: days_since_last
  type: number
- name: is_dormant
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
