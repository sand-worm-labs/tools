tool_id: token.holder_dynamics_over_time
g1: token
description: Tracks daily holder count evolution.
g2: holders
g3: holder_dynamics_over_time
g4: Holder count evolution
g5: ERC20 transfer events
scope: generic
returns:
- name: date
  type: date
- name: holder_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
