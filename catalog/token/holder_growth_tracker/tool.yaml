tool_id: token.holder_growth_tracker
g1: token
description: Tracks daily unique holders with growth metrics.
g2: holders
g3: holder_growth_tracker
g4: Holders growth 90d
g5: ERC20 transfer events
scope: generic
returns:
- name: day
  type: date
- name: holders
  type: number
- name: growth_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
