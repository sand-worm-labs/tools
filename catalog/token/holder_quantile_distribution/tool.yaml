tool_id: token.holder_quantile_distribution
g1: token
description: Classifies token holders into balance quantiles revealing whale concentration.
g2: holders
g3: holder_quantile_distribution
g4: Holder Distribution
g5: ERC20 transfers
scope: generic
returns:
- name: quantile_bucket
  type: string
- name: holder_count
  type: number
- name: total_held
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
