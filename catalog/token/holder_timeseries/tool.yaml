tool_id: token.holder_timeseries
g1: token
description: Tracks daily unique holders with net positive balance.
g2: holders
g3: holder_timeseries
g4: Holder growth
g5: ERC20 transfers
scope: generic
returns:
- name: day
  type: date
- name: unique_wallets
  type: number
- name: daily_change
  type: number
- name: cumulative_holders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
