tool_id: token.holder_token_buy_ratio
g1: token
description: Ranks top holders by target token buy volume ratio vs total buys.
g2: holders
g3: holder_token_buy_ratio
g4: Holder Buy Preference Ratio
g5: Dune dex.trades
scope: generic
returns:
- name: holder
  type: string
- name: token_buy_ratio
  type: number
- name: total_buy_usd
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: top_n
  type: number
  label: Top N
  default: '30'
  required: false
