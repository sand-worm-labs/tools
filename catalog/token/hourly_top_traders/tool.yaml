tool_id: token.hourly_top_traders
g1: token
description: Ranks traders by volume per hour for given token.
g2: wallet
g3: hourly_top_traders
g4: Hourly Top Traders
g5: dex_solana.trades
scope: generic
returns:
- name: hour
  type: timestamp
- name: trader
  type: string
- name: volume
  type: number
- name: rank
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '5'
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
