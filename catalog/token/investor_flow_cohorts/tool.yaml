tool_id: token.investor_flow_cohorts
g1: token
description: Aggregates daily inflows by investor size cohorts (whale/retail/small).
g2: holders
g3: investor_flow_cohorts
g4: Inflow by size cohort
g5: ERC20 daily inflows
scope: generic
returns:
- name: date
  type: date
- name: cohort
  type: string
- name: tx_count
  type: number
- name: total_inflow
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: to_address
  type: address
  label: Recipient address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
