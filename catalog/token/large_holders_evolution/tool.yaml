tool_id: token.large_holders_evolution
g1: token
description: Tracks large holder balances daily.
g2: holders
g3: large_holders_evolution
g4: Whale Balances
g5: Dune Query 4103717
scope: generic
returns:
- name: date
  type: date
- name: holder_address
  type: string
- name: balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_balance
  type: number
  label: Min Balance
  default: '1000'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
