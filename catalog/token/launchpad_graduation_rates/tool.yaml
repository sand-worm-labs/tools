tool_id: token.launchpad_graduation_rates
g1: token
description: Daily launched vs graduated token counts and graduation rate for an
  EVM launchpad factory (graduation = first DEX trade after a bonding-curve launch).
g2: launchpad
g3: launchpad_graduation_rates
g4: Daily graduated tokens
g5: EVM factory creation_traces + dex.trades
scope: generic
returns:
- name: day
  type: date
- name: platform
  type: string
- name: launched
  type: number
- name: graduated
  type: number
- name: graduation_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: factory_address
  type: address
  label: Launchpad Factory Address
  required: true
  placeholder: 0x...
- key: protocol
  type: text
  label: Protocol label
  default: custom
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
