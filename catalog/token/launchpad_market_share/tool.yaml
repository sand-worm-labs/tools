tool_id: token.launchpad_market_share
g1: token
description: Compares one EVM launchpad factory's daily new-token launches against
  total new ERC-20 launches on the chain over a date range.
g2: launchpad
g3: launchpad_market_share
g4: Platform Token Share
g5: EVM factory vs total creation_traces
scope: generic
returns:
- name: date
  type: date
- name: factory_launches
  type: number
- name: total_launches
  type: number
- name: factory_share
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: factory_address
  type: address
  label: Launchpad Factory Address
  required: true
  placeholder: 0x...
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
