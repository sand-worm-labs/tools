tool_id: token.launchpad_user_growth
g1: token
description: Tracks daily new and total user wallets deploying tokens through an
  EVM launchpad factory contract.
g2: launchpad
g3: launchpad_user_growth
g4: New vs Returning Users
g5: EVM factory creation_traces + transactions
scope: generic
returns:
- name: date
  type: date
- name: new_users
  type: number
- name: total_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: factory_address
  type: address
  label: Launchpad Factory Address
  required: true
  placeholder: 0x...
- key: protocol
  type: text
  label: Protocol label
  default: custom
  required: false
- key: date_from
  type: date
  label: Start Date
  required: false
