tool_id: token.meme_wallet_trade_classifier
g1: token
description: Classifies wallet trades for meme coins with totals.
g2: wallet
g3: meme_wallet_trade_classifier
g4: Meme Trader Patterns
g5: Buy/sell classification
scope: generic
returns:
- name: wallet_address
  type: string
- name: total_trades
  type: number
- name: buy_trades
  type: number
- name: sell_trades
  type: number
inputs:
- key: token_symbols
  type: text
  label: Meme Tokens
  default: SHIB,PEPE,DOGE
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
