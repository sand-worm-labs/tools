tool_id: token.meme_wallet_trade_classifier
g1: token
description: Classifies wallet trades for meme coins with totals.
g2: wallet
g3: meme_wallet_trade_classifier
g4: Meme Trader Patterns
g5: Buy/sell classification
scope: generic
returns:
- name: wallet_address
  type: string
- name: total_trades
  type: number
- name: buy_trades
  type: number
- name: sell_trades
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: token_symbols
  type: text
  label: Meme Tokens
  default: SHIB,PEPE,DOGE
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
