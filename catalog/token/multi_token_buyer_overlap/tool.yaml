tool_id: token.multi_token_buyer_overlap
g1: token
description: Finds wallets buying multiple specified tokens above USD thresholds.
g2: holders
g3: multi_token_buyer_overlap
g4: Overlapping Buyers
g5: dex.trades multi-CTE
scope: generic
returns:
- name: wallet
  type: string
- name: token1_usd
  type: number
- name: token2_usd
  type: number
- name: overlap_usd
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
