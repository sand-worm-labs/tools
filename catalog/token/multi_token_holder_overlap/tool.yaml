tool_id: token.multi_token_holder_overlap
g1: token
description: Finds addresses currently holding a positive balance of multiple specified
  tokens.
g2: holders
g3: multi_token_holder_overlap
g4: Overlapping holders
g5: ERC20 transfer events
scope: generic
returns:
- name: holder
  type: string
- name: token_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: token1_address
  type: address
  label: Token 1
  required: true
- key: token2_address
  type: address
  label: Token 2
  required: true
- key: token3_address
  type: address
  label: Token 3
  required: false
- key: token4_address
  type: address
  label: Token 4
  required: false
