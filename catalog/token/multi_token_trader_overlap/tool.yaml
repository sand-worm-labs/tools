tool_id: token.multi_token_trader_overlap
g1: token
description: Identifies wallets trading multiple tokens in periods.
g2: wallet
g3: multi_token_trader_overlap
g4: Overlapping Traders
g5: Dune dex_solana.trades
scope: generic
returns:
- name: trader_id
  type: string
- name: total_bought_token1
  type: number
- name: total_bought_token2
  type: number
inputs:
- key: token_address_1
  type: address
  label: Token 1 Address
  required: true
- key: token_address_2
  type: address
  label: Token 2 Address
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
