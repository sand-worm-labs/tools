tool_id: token.multi_token_whale_overlap
g1: token
description: Identifies wallets accumulating multiple specified tokens (whale overlap).
g2: holders
g3: multi_token_whale_overlap
g4: Overlapping Whale Buyers
g5: Dune dex.trades multi-CTE
scope: generic
returns:
- name: wallet
  type: string
- name: tokens_bought
  type: string
- name: total_usd
  type: number
- name: overlap_score
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: true
- key: date_to
  type: date
  label: End Date
  required: false
