tool_id: token.multi_token_whale_overlap
g1: token
description: Identifies wallets accumulating significant positions across multiple
  specified ERC20 tokens (whale overlap).
g2: holders
g3: multi_token_whale_overlap
g4: Overlapping Whale Buyers
g5: Dune dex.trades multi-token
scope: generic
returns:
- name: wallet
  type: string
- name: tokens_bought
  type: string
- name: total_usd
  type: number
- name: overlap_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: token_addresses
  type: address[]
  label: Token Addresses (2 or more)
  required: true
  placeholder: 0x...
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: true
- key: date_to
  type: date
  label: End Date
  required: false
