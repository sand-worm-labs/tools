tool_id: token.nansen_tgm_flow_intelligence
g1: token
description: Net flow, average flow, and wallet count for a token broken down by trader segment (public figure, top PnL, whale, smart trader, exchange, fresh wallets), with the dominant segment flagged, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_flow_intelligence
g4: Flow intelligence
g5: Nansen Token God Mode flow intelligence
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: chain
  type: string
- name: token_address
  type: string
- name: timeframe
  type: string
- name: public_figure_net_flow_usd
  type: number
- name: public_figure_avg_flow_usd
  type: number
- name: public_figure_wallet_count
  type: number
- name: top_pnl_net_flow_usd
  type: number
- name: top_pnl_avg_flow_usd
  type: number
- name: top_pnl_wallet_count
  type: number
- name: whale_net_flow_usd
  type: number
- name: whale_avg_flow_usd
  type: number
- name: whale_wallet_count
  type: number
- name: smart_trader_net_flow_usd
  type: number
- name: smart_trader_avg_flow_usd
  type: number
- name: smart_trader_wallet_count
  type: number
- name: exchange_net_flow_usd
  type: number
- name: exchange_avg_flow_usd
  type: number
- name: exchange_wallet_count
  type: number
- name: fresh_wallets_net_flow_usd
  type: number
- name: fresh_wallets_avg_flow_usd
  type: number
- name: fresh_wallets_wallet_count
  type: number
- name: total_net_flow_usd
  type: number
- name: dominant_segment
  type: string
inputs:
- key: chain
  type: text
  label: Chain
  required: true
  placeholder: ethereum
  description: "Allowed values: arbitrum, arc, avalanche, base, bnb, ethereum, hyperevm, injective, linea, mantle, mantra, monad, near, optimism, plasma, polygon, robinhood, sei, solana, sonic, starknet, sui, ton, tron."
- key: token_address
  type: text
  label: Token address
  required: true
  placeholder: 0x... or token contract address
- key: timeframe
  type: select
  label: Timeframe
  required: false
  default: "1d"
  options:
  - label: 5 minutes
    value: 5m
  - label: 1 hour
    value: 1h
  - label: 6 hours
    value: 6h
  - label: 12 hours
    value: 12h
  - label: 1 day
    value: 1d
  - label: 7 days
    value: 7d
