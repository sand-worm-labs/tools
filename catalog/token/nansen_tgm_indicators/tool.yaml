tool_id: token.nansen_tgm_indicators
g1: token
description: Risk indicators (liquidity, concentration, supply inflation, BTC reflexivity) and reward indicators (momentum, funding rate, TVL, fees, CEX flows) for a single token, rolled up into a composite risk/reward tier, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_indicators
g4: Nansen indicators
g5: Nansen Token God Mode risk/reward indicators
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: token_address
  type: string
- name: chain
  type: string
- name: market_cap_usd
  type: number
- name: market_cap_group
  type: string
- name: is_stablecoin
  type: boolean
- name: indicator_category
  type: string
- name: indicator_type
  type: string
- name: score
  type: string
- name: signal
  type: number
- name: signal_percentile
  type: number
- name: last_trigger_on
  type: string
- name: composite_risk_tier
  type: string
- name: composite_reward_tier
  type: string
inputs:
- key: chain
  type: text
  label: Chain
  required: true
  placeholder: ethereum
  description: "Allowed values: arbitrum, arc, avalanche, base, bnb, ethereum, hyperevm, hyperliquid, injective, iotaevm, linea, mantle, mantra, monad, near, optimism, plasma, polygon, robinhood, sei, solana, sonic, starknet, sui, ton, tron."
- key: token_address
  type: text
  label: Token address
  required: true
  placeholder: 0x... or token contract address
