tool_id: token.nansen_tgm_perp_positions
g1: token
description: Open Hyperliquid perp positions for a token, with each position's distance from its liquidation price as a % of mark price and a flag for large positions sitting close to liquidation — a cascade-risk read the raw liquidation price alone doesn't give, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_perp_positions
g4: Perp positions
g5: Nansen Token God Mode perp positions
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: address
  type: string
- name: address_label
  type: string
- name: side
  type: string
- name: position_value_usd
  type: number
- name: position_size
  type: number
- name: leverage
  type: string
- name: leverage_type
  type: string
- name: entry_price
  type: number
- name: mark_price
  type: number
- name: liquidation_price
  type: number
- name: funding_usd
  type: number
- name: upnl_usd
  type: number
- name: liquidation_distance_pct
  type: number
- name: liquidation_risk_flag
  type: boolean
inputs:
- key: token_symbol
  type: text
  label: Perp symbol
  required: true
  placeholder: BTC
- key: label_type
  type: select
  label: Trader cohort
  required: false
  default: all_traders
  options:
  - label: All traders
    value: all_traders
  - label: Smart money
    value: smart_money
  - label: Whale
    value: whale
  - label: Public figure
    value: public_figure
- key: side
  type: select
  label: Side
  required: false
  options:
  - label: Any
    value: ""
  - label: Long
    value: Long
  - label: Short
    value: Short
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: position_value_usd
  options:
  - label: Position value (USD)
    value: position_value_usd
  - label: Size (absolute)
    value: size_base
  - label: Leverage
    value: leverage
  - label: Unrealized PnL (USD)
    value: upnl_usd
  - label: Funding (USD)
    value: funding_usd
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
