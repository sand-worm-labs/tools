tool_id: token.nansen_tgm_perp_screener
g1: token
description: Hyperliquid perp market screener by cohort (all traders, smart money, whale, public figure, high-winrate), flagging tokens where the cohort's order flow/positioning direction disagrees with where price actually moved — a divergence the raw flow or price columns alone don't show.
g2: token_god_mode
g3: nansen_tgm_perp_screener
g4: Perp screener
g5: Nansen Token God Mode perp screener
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: token_symbol
  type: string
- name: volume
  type: number
- name: buy_volume
  type: number
- name: sell_volume
  type: number
- name: buy_sell_pressure
  type: number
- name: net_position_change
  type: number
- name: trader_count
  type: number
- name: mark_price
  type: number
- name: funding
  type: number
- name: open_interest
  type: number
- name: previous_price_usd
  type: number
- name: window_end_price_usd
  type: number
- name: price_change
  type: number
- name: current_position_longs_usd
  type: number
- name: current_position_shorts_usd
  type: number
- name: longs_count
  type: number
- name: shorts_count
  type: number
- name: flow_price_divergence
  type: boolean
- name: divergence_magnitude
  type: number
inputs:
- key: date_from
  type: date
  label: Start date
  required: true
- key: date_to
  type: date
  label: End date
  required: true
- key: trader_type
  type: select
  label: Trader cohort
  required: false
  default: all
  options:
  - label: All traders
    value: all
  - label: Smart money
    value: sm
  - label: Whale
    value: whale
  - label: Public figure
    value: public_figure
  - label: High winrate HL perps trader
    value: high_winrate_hl_perps_trader
- key: token_symbol
  type: text
  label: Token symbol
  required: false
  placeholder: BTC
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
