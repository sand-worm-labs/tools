tool_id: token.nansen_tgm_position_intelligence
g1: token
description: Aggregated long/short/total Hyperliquid perp position sizes for a token by trader cohort (smart trader, whale, public figure), with a long/short skew per cohort and a flag for when smart traders are positioned against whales, via the Nansen Token God Mode API.
g2: token_god_mode
g3: nansen_tgm_position_intelligence
g4: Position intelligence
g5: Nansen Token God Mode position intelligence
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: smart_trader_longs_usd
  type: number
- name: smart_trader_shorts_usd
  type: number
- name: smart_trader_total_usd
  type: number
- name: whale_longs_usd
  type: number
- name: whale_shorts_usd
  type: number
- name: whale_total_usd
  type: number
- name: public_figure_longs_usd
  type: number
- name: public_figure_shorts_usd
  type: number
- name: public_figure_total_usd
  type: number
- name: smart_trader_skew
  type: number
- name: whale_skew
  type: number
- name: public_figure_skew
  type: number
- name: smart_vs_whale_divergence
  type: boolean
inputs:
- key: token_address
  type: text
  label: Token address
  required: true
  placeholder: "0x... or token symbol"
  description: Token or Hyperliquid perp market identifier.
