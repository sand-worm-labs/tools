tool_id: token.narrative_weekly_performance
g1: token
description: Tracks weekly price returns for predefined token narratives like real
  yield or L2.
g2: price
g3: narrative_weekly_performance
g4: Weekly Basket Returns
g5: Dune prices.usd
scope: protocol:prices.usd
returns:
- name: week
  type: date
- name: symbol
  type: string
- name: price_initial
  type: number
- name: price_end
  type: number
- name: return_pct
  type: number
inputs:
- key: narrative
  type: text
  label: Narrative
  default: real_yield
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
