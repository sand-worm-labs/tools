tool_id: token.network_health_metrics
g1: token
description: Calculates daily transfers, unique addresses, volume, average size.
g2: network
g3: network_health_metrics
g4: Daily Activity Metrics
g5: ERC20 Transfers
scope: generic
returns:
- name: day
  type: date
- name: transfers
  type: number
- name: unique_senders
  type: number
- name: unique_receivers
  type: number
- name: total_unique
  type: number
- name: volume
  type: number
- name: avg_size
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
