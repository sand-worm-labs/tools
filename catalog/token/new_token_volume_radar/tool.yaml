tool_id: token.new_token_volume_radar
g1: token
description: Detects and ranks new tokens by first-trade volume in lookback period.
g2: dex
g3: new_token_volume_radar
g4: New Token Radar
g5: dex.trades first-trade
scope: generic
returns:
- name: token_address
  type: string
- name: first_seen
  type: timestamp
- name: volume
  type: number
- name: rank
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '100000'
  required: true
