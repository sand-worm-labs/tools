tool_id: token.new_token_volume_radar
g1: token
description: Detects and ranks new tokens by first-trade volume in lookback period.
g2: dex
g3: new_token_volume_radar
g4: New Token Radar
g5: dex.trades first-trade
scope: generic
returns:
- name: token_address
  type: string
- name: first_seen
  type: string
- name: volume
  type: number
- name: rank
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '100000'
  required: true
