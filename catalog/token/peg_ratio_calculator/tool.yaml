tool_id: token.peg_ratio_calculator
g1: token
description: Computes daily peg ratio (stETH/ETH) from directional DEX trades.
g2: price
g3: peg_ratio_calculator
g4: LST Peg Deviation
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: steth_eth_ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: token_a
  type: address
  label: Base token
  default: '0xae7ab96520DE3A18E5e111b5eAAb095312D7fE84'
  required: true
- key: token_b
  type: address
  label: Quote token
  default: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
  required: true
