tool_id: token.post_airdrop_whale_staking
g1: token
description: Detects whale staking activity post-airdrop with accumulation signals.
g2: holders
g3: post_airdrop_whale_staking
g4: Whale Staking Patterns
g5: Kaito Airdrop Claims
scope: protocol:kaito
returns:
- name: whale_address
  type: string
- name: claimed
  type: number
- name: staked
  type: number
- name: accumulation_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: token_address
  type: token_address
  label: Airdrop Token Address
  required: true
  placeholder: 0x...
- key: claim_contract
  type: address
  label: Claim Distributor Address
  required: true
  placeholder: 0x...
- key: staking_contract
  type: address
  label: Staking Contract
  required: true
  placeholder: 0x...
- key: min_claim
  type: number
  label: Min Claim Threshold
  default: '10000'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
