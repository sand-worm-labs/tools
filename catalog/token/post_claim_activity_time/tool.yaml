tool_id: token.post_claim_activity_time
g1: token
description: Measures time from claim to first post-claim transaction.
g2: airdrop
g3: post_claim_activity_time
g4: Reward Activity Gap
g5: ERC20 Transfers
scope: generic
returns:
- name: user
  type: string
- name: claim_time
  type: timestamp
- name: first_tx_time
  type: timestamp
- name: days_gap
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: claim_from
  type: address
  label: Claim From Address
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_date
  type: date
  label: Min Claim Date
  required: true
