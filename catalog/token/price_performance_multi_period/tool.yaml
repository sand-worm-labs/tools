tool_id: token.price_performance_multi_period
g1: token
description: Computes token price performance across multiple lookback periods.
g2: price
g3: price_performance_multi_period
g4: Multi-Period Returns
g5: prices.usd
scope: generic
returns:
- name: symbol
  type: string
- name: init_30d
  type: number
- name: init_6m
  type: number
- name: current
  type: number
- name: perf_30d
  type: number
- name: perf_6m
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: list_symbols
  type: text
  label: Symbols List
  required: true
  placeholder: WETH,USDC,WBTC
