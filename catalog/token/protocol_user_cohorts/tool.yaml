tool_id: token.protocol_user_cohorts
g1: token
description: Computes new users and cumulative growth for any protocol.
g2: holders
g3: protocol_user_cohorts
g4: New vs Cumulative Users
g5: Cohort user growth
scope: protocol
returns:
- name: day
  type: date
- name: new_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: protocol
  type: text
  label: Protocol
  description: Protocol contract address (0x...)
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
