tool_id: token.pumpfun_creation_trends
g1: token
description: Computes daily token launches, dev counts, and 30-day moving averages
  on an EVM bonding-curve launchpad factory.
g2: launchpad
g3: pumpfun_creation_trends
g4: Daily launches & devs
g5: EVM launchpad factory events
scope: protocol:launchpad
returns:
- name: block_date
  type: date
- name: token_cnt
  type: number
- name: dev_cnt
  type: number
- name: dev_moving_avg
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: factory_address
  type: address
  label: Launchpad Factory Address
  required: true
  placeholder: 0x...
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
