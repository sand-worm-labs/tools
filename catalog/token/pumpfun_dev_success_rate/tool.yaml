tool_id: token.pumpfun_dev_success_rate
g1: token
description: Measures developer success as graduated tokens over created on an
  EVM launchpad factory.
g2: launchpad
g3: pumpfun_dev_success_rate
g4: Developer success ratio
g5: EVM launchpad creation/graduation events
scope: protocol:launchpad
returns:
- name: dev_address
  type: string
- name: tokens_created
  type: number
- name: tokens_graduated
  type: number
- name: success_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: factory_address
  type: address
  label: Launchpad Factory Address
  required: true
  placeholder: 0x...
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_tokens
  type: number
  label: Min tokens created
  default: '1'
  required: false
