tool_id: token.reward_recipient_activity
g1: token
description: Tracks initial reward recipients and their subsequent token activity.
g2: wallet
g3: reward_recipient_activity
g4: Post-reward flows
g5: ERC20 transfers
scope: protocol:ARB
returns:
- name: recipient
  type: string
- name: first_activity
  type: timestamp
- name: total_out
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
- key: reward_from
  type: address
  label: Reward distributor address
  required: true
- key: contract_address
  type: address
  label: Contract Address
  default: '0x912ce59144191c1204e64559fe8253a0e49e6548'
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
