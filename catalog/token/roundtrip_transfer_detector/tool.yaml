tool_id: token.roundtrip_transfer_detector
g1: token
description: Identifies circular transfers indicating wash trading.
g2: wallet
g3: roundtrip_transfer_detector
g4: Reversal cycles
g5: Transaction self-joins
scope: generic
returns:
- name: from_forward
  type: string
- name: to_forward
  type: string
- name: cycle_count
  type: number
- name: total_value
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_value
  type: number
  label: Min value USD
  default: '0'
  required: false
