tool_id: token.sector_weekly_returns
g1: token
description: Calculates weekly price changes for sector tokens.
g2: price
g3: sector_weekly_returns
g4: Weekly Performance
g5: Multi-token prices
scope: generic
returns:
- name: week
  type: date
- name: symbol
  type: string
- name: price_initial
  type: number
- name: price
  type: number
- name: weekly_return
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
- key: symbols
  type: text
  label: Token Symbols
  placeholder: 'ETH,ARB,OP'
  description: Comma-separated token symbols.
  required: true
