tool_id: token.significant_supply_transfer_detector
g1: token
description: Flags transfers exceeding percentage of total minted supply with confidence.
g2: holders
g3: significant_supply_transfer_detector
g4: Large Supply % Transfers
g5: tokens.transfers
scope: generic
returns:
- name: wallet
  type: string
- name: percent_supply
  type: number
- name: tx_id
  type: string
- name: is_significant
  type: boolean
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_percent
  type: number
  label: Min % Threshold
  default: '1'
  required: false
