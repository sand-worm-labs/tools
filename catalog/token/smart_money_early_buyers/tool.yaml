tool_id: token.smart_money_early_buyers
g1: token
description: Identifies high-PnL wallets accumulating new tokens early.
g2: holders
g3: smart_money_early_buyers
g4: Profit Signals
g5: Profitable wallet screening
scope: generic
returns:
- name: wallet
  type: string
- name: net_pnl
  type: number
- name: early_token_count
  type: number
- name: win_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_pnl_usd
  type: number
  label: Min PnL Threshold
  default: '1000'
  required: false
