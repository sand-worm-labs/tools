tool_id: token.smart_wallet_detector
g1: token
description: Classifies smart wallets by 30-day volume, unique tokens bought, and
  active days with thresholds.
g2: holders
g3: smart_wallet_detector
g4: Smart Wallet Metrics
g5: dex_solana.trades
scope: generic
returns:
- name: wallet_address
  type: string
- name: total_volume_30d
  type: number
- name: unique_tokens_bought
  type: number
- name: active_days
  type: number
inputs:
- key: lookback_days
  type: number
