tool_id: token.supply_timeseries
g1: token
description: Computes daily mints, burns, net change, cumulative supply.
g2: supply
g3: supply_timeseries
g4: Daily Supply
g5: ERC20 Transfers
scope: generic
returns:
- name: date
  type: date
- name: minted
  type: number
- name: burned
  type: number
- name: net_change
  type: number
- name: cumulative
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
