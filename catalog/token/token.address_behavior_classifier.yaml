tool_id: token.address_behavior_classifier
g1: token
description: Classifies addresses as market_maker, cex, whale, retail using tx volume,
  frequency, days active.
g2: wallet
g3: address_behavior_classifier
g4: Wallet Classification
g5: Transfer activity
scope: generic
returns:
- name: address
  type: string
- name: classification
  type: string
- name: tx_count
  type: number
- name: volume
  type: number
- name: active_days
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
