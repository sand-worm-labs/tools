description: Calculates daily burns with moving averages for trends.
g2: burns
g3: burn_moving_averages
g4: Burn trends
g5: ERC20 transfers
scope: generic
returns:
- name: block_time
  type: timestamp
- name: total_burn
  type: number
- name: ma46
  type: number
- name: ma200
  type: number
inputs:
- key: contract_address
