tool_id: token.cex_dispatch_detector
g1: token
description: Detects wallets receiving from CEX then dispatching small SOL amounts.
g2: wallet
g3: cex_dispatch_detector
g4: CEX Dispatch Patterns
g5: tokens_solana.transfers
scope: generic
returns:
- name: wallet
  type: string
- name: dispatch_score
  type: number
- name: dispatch_count
  type: number
- name: suspicious
  type: boolean
inputs:
- key: days_back
  type: number
  label: Days Back
  default: '7'
  required: true
- key: min_transfer_in_sum_amount
  type: number
  label: Min Inflow SOL
  default: '50'
  required: false
- key: single_transfer_out_min_amount
  type: number
  label: Min Outflow SOL
  default: '0.1'
  required: false
