tool_id: token.cex_net_flow_daily
g1: token
description: Aggregates daily inflows minus outflows to CEX wallets.
g2: cex
g3: cex_net_flow_daily
g4: CEX Net Flow Daily
g5: ERC20 Transfers Polygon
scope: generic
returns:
- name: day
  type: date
- name: net_flow
  type: number
- name: inflow
  type: number
- name: outflow
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: cex_addresses
  type: address[]
  label: CEX Addresses
  default: []
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
