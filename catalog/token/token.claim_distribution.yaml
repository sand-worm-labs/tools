tool_id: token.claim_distribution
g1: token
description: Summarizes top claim recipients and totals from airdrop distributor.
g2: airdrop_claims
g3: claim_distribution
g4: Airdrop claim stats
g5: ERC20 claim transfers
scope: generic
returns:
- name: address
  type: string
- name: amount
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: from_address
  type: address
  label: Distributor address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
