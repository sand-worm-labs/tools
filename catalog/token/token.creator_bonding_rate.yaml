tool_id: token.creator_bonding_rate
g1: token
g2: launch
g3: creator_bonding_rate
g4: Launch to Bonding %
g5: Pump.fun Launches
description: Measures % of token creators who bond launched tokens post-launch with ranking.
scope: protocol:pump.fun
returns:
- name: creator
  type: string
- name: launch_date
  type: string
- name: bonding_pct
  type: number
- name: rank
  type: number
inputs:
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '60'
- key: top_n
  label: Top N
  type: number
  required: false
  default: '100'
