tool_id: token.creator_bonding_rate
g1: token
description: Measures % of token creators who bond launched tokens post-launch with
  ranking.
g2: launch
g3: creator_bonding_rate
g4: Launch to Bonding %
g5: Pump.fun Launches
scope: protocol:pump.fun
returns:
- name: creator
  type: string
- name: launch_date
  type: date
- name: bonding_pct
  type: number
- name: rank
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '60'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
