tool_id: token.cumulative_active_users
g1: token
description: Calculates daily active users and cumulative total for token.
g2: holders
g3: cumulative_active_users
g4: Cumulative Users
g5: Dune tokens_solana.transfers
scope: generic
returns:
- name: evt_block_time
  type: timestamp
- name: total_user
  type: number
- name: cumulative_total
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
