tool_id: token.daily_holder_count
g1: token
g2: holders
g3: daily_holder_count
g4: Holder Growth
g5: Cumulative window
description: Tracks daily unique holder count using running balance snapshots.
scope: generic
returns:
- name: day
  type: date
- name: holder_count
  type: number
- name: growth_rate
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
