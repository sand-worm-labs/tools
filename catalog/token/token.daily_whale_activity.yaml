tool_id: token.daily_whale_activity
g1: token
g2: holders
g3: daily_whale_activity
g4: Whale daily volume
g5: ethereum.transactions
description: Identifies whale addresses by daily ETH transfer volume exceeding threshold.
scope: generic
returns:
- name: day
  type: string
- name: whale_address
  type: string
- name: eth_transferred
  type: number
- name: transaction_count
  type: number
inputs:
- key: threshold_eth
  label: Min daily ETH threshold
  type: number
  required: true
- key: date
  label: Date
  type: date_range
  required: false
