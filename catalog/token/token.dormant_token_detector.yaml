tool_id: token.dormant_token_detector
g1: token
description: Detects dormant tokens awakening via recent vs historical activity spike.
g2: holders
g3: dormant_token_detector
g4: Awakening score
g5: Dune dex.trades anomaly
scope: generic
returns:
- name: token
  type: string
- name: txs_last_24h
  type: number
- name: vol_last_24h
  type: number
- name: awakening_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
