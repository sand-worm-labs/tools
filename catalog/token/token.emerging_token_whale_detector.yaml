tool_id: token.emerging_token_whale_detector
g1: token
g2: holders
g3: emerging_token_whale_detector
g4: Emerging Token Whales
g5: Dune dex.trades
description: Detects whales accumulating emerging tokens.
scope: generic
returns:
- name: token
  type: string
- name: whale_count
  type: number
- name: total_usd
  type: number
- name: whale_score
