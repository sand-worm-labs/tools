tool_id: token.erc20_holder_distribution
g1: token
description: Computes current token balances across all holders with labels.
g2: holders
g3: erc20_holder_distribution
g4: Holder Balances
g5: ERC20 transfers
scope: generic
returns:
- name: address
  type: string
- name: labels
  type: string
- name: balance
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: threshold
  type: number
  label: Min balance
  default: '0'
  required: false
- key: decimals
  type: number
  label: Token decimals
  default: '18'
  required: false
