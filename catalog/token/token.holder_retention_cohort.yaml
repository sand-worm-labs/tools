tool_id: token.holder_retention_cohort
g1: token
g2: holders
g3: holder_retention_cohort
g4: Holders >30 Days
g5: First trade to retention check
description: Classifies holders by retention beyond threshold days.
scope: generic
returns:
- name: wallet
  type: string
- name: first_trade
  type: date
- name: retained
  type: boolean
- name: hold_days
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: chain
  label: Chain
  type: chain
  required: true
- key: threshold_days
  label: Retention Days
  type: number
  required: false
  default: '30'
