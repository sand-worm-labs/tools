tool_id: token.holder_retention_cohort
g1: token
description: Classifies holders by retention beyond threshold days.
g2: holders
g3: holder_retention_cohort
g4: Holders >30 Days
g5: First trade to retention check
scope: generic
returns:
- name: wallet
  type: string
- name: first_trade
  type: date
- name: retained
  type: boolean
- name: hold_days
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: threshold_days
  type: number
  label: Retention Days
  default: '30'
  required: false
