tool_id: token.inscription_holder_ranker
g1: token
description: Ranks wallets by inscription mint count and total amount for BSC-20 tick.
g2: holders
g3: inscription_holder_ranker
g4: holder distribution
g5: bnb inscriptions
scope: generic
returns:
- name: rank
  type: number
- name: wallet
  type: string
- name: inscriptions
  type: number
- name: total_amount
  type: number
inputs:
- key: tick
  type: text
  label: '"BSC-20 Tick"'
  required: true
- key: chain
  type: chain
  label: Chain
  default: bsc
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: amt
  type: number
  label: '"Mint Amount"'
  default: '1000'
  required: false
- key: min_date
  type: date
  label: '"From Date"'
  required: false
