tool_id: token.inscription_holder_ranking
g1: token
description: Ranks wallets by inscription mint count and total amount.
g2: holders
g3: inscription_holder_ranking
g4: PRC-20 holder distribution
g5: Inscription mint parser
scope: generic
returns:
- name: rank
  type: number
- name: wallet_address
  type: string
- name: mint_count
  type: number
- name: total_amount
  type: number
inputs:
- key: data_filter
  type: text
  label: Mint Data Filter
  required: true
- key: amt
  type: number
  label: Amount per Mint
  default: '100'
  required: false
- key: chain
  type: chain
  label: Chain
  default: polygon
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
