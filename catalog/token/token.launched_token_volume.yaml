tool_id: token.launched_token_volume
g1: token
g2: launchpad
g3: launched_token_volume
g4: Token Launch Volumes
g5: Virtuals Protocol Logs
description: Tracks daily trading volume for recently launched tokens post-graduation.
scope: protocol:virtuals
returns:
- name: day
  type: string
- name: token_address
  type: string
- name: volume
  type: number
- name: launch_time
  type: string
inputs:
- key: date_from
  label: Start Date
  type: date
  required: true
- key: protocol
  label: Protocol
  type: text
  required: false
  default: virtuals
- key: top_n
  label: Top N
  type: number
  required: false
  default: '10'
