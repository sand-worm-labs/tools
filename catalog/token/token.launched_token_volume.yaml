tool_id: token.launched_token_volume
g1: token
description: Tracks daily trading volume for recently launched tokens post-graduation.
g2: launchpad
g3: launched_token_volume
g4: Token Launch Volumes
g5: Virtuals Protocol Logs
scope: protocol:virtuals
returns:
- name: day
  type: date
- name: token_address
  type: string
- name: volume
  type: number
- name: launch_time
  type: timestamp
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: protocol
  type: text
  label: Protocol
  default: virtuals
  required: false
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
