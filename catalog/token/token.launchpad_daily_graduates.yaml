tool_id: token.launchpad_daily_graduates
g1: token
description: Counts distinct tokens graduated daily by launchpad protocol.
g2: launchpad
g3: launchpad_daily_graduates
g4: Daily Token Graduates
g5: Solana memecoin launchpads
scope: generic
returns:
- name: day
  type: date
- name: graduates
  type: number
- name: protocol
  type: string
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
