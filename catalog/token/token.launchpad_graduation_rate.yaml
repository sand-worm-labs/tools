tool_id: token.launchpad_graduation_rate
g1: token
g2: launchpad
g3: launchpad_graduation_rate
g4: Daily Launches vs Graduates
g5: tokens_solana.transfers
description: Tracks daily tokens launched vs graduated (burn/migrate) on launchpads.
scope: protocol:pumpfun
returns:
- name: date
  type: date
- name: launched
  type: number
- name: graduated
  type: number
- name: graduation_rate
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
  default: pumpfun
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '30'
