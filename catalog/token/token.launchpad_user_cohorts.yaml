tool_id: token.launchpad_user_cohorts
g1: token
g2: launchpad
g3: launchpad_user_cohorts
g4: New vs Returning Creators
g5: tokens_solana.transfers
description: Computes daily new, active, cumulative creators on launchpads like pump.fun.
scope: protocol:pumpfun
returns:
- name: date
  type: date
- name: new_users
  type: number
- name: active_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: protocol
  label: Protocol
  type: text
  required: true
  default: pumpfun
- key: date_from
  label: Start Date
  type: date
  required: false
