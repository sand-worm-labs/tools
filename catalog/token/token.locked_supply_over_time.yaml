tool_id: token.locked_supply_over_time
g1: token
g2: holders
g3: locked_supply_over_time
g4: Cumulative Locked Supply
g5: ERC20 Transfers + Fill
description: Computes locked token supply with cumulative total over time.
scope: generic
returns:
- name: date
  type: string
- name: locked
  type: number
- name: total_locked
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: locker_address
  label: Locker Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '365'
