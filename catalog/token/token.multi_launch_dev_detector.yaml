tool_id: token.multi_launch_dev_detector
g1: token
description: Detects developers launching multiple tokens on launchpads using latest
  N per dev.
g2: identity
g3: multi_launch_dev_detector
g4: Multi-Launch Devs
g5: Dune tokens_solana.transfers
scope: generic
returns:
- name: dev_wallet
  type: string
- name: token_count
  type: number
- name: bot_score
  type: number
inputs:
- key: outer_executing_account
  type: address
  label: Launchpad Program
  required: true
- key: top_n
  type: number
  label: Top N
  default: '3'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
