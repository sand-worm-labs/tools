tool_id: token.multi_launch_dev_detector
g1: token
g2: identity
g3: multi_launch_dev_detector
g4: Multi-Launch Devs
g5: Dune tokens_solana.transfers
description: Detects developers launching multiple tokens on launchpads using latest N per dev.
scope: generic
returns:
- name: dev_wallet
  type: string
- name: token_count
  type: number
- name: bot_score
  type: number
inputs:
- key: outer_executing_account
  label: Launchpad Program
  type: address
  required: true
- key: top_n
  label: Top N
  type: number
  required: false
  default: '3'
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '30'
