tool_id: token.net_holder_accumulation
g1: token
g2: holders
g3: net_holder_accumulation
g4: Net Positive Holders
g5: Wallet net holdings trends
description: Computes net token holdings for wallets over time.
scope: generic
returns:
- name: series_date
  type: string
- name: net_holding
  type: number
inputs:
- key: pool_address
  label: Pool Address
  type: address
