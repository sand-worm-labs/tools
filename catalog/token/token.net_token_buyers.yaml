tool_id: token.net_token_buyers
g1: token
description: Finds wallets that bought but never sold token in period.
g2: holders
g3: net_token_buyers
g4: Net Token Buyers
g5: dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: total_buy_usd
  type: number
- name: buy_count
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '100'
  required: false
