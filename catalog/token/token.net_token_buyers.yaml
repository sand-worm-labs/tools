tool_id: token.net_token_buyers
g1: token
g2: holders
g3: net_token_buyers
g4: Net Token Buyers
g5: dex_solana.trades
description: Finds wallets that bought but never sold token in period.
scope: generic
returns:
- name: wallet
  type: string
- name: total_buy_usd
  type: number
- name: buy_count
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: date
  label: Date
  type: date_range
  required: true
- key: min_usd
  label: Min USD
  type: number
  required: false
  default: '100'
