tool_id: token.new_returning_token_traders
g1: token
description: Classifies daily traders as new or returning based on first trade date.
g2: holders
g3: new_returning_token_traders
g4: Daily New/Returning Traders
g5: dex_solana.trades CTEs
scope: generic
returns:
- name: day
  type: date
- name: new
  type: number
- name: returning
  type: number
- name: total
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: '"NOW() - INTERVAL ''30'' DAY"'
  required: false
