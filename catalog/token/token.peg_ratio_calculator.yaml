tool_id: token.peg_ratio_calculator
g1: token
description: Computes daily peg ratio (stETH/ETH) from directional DEX trades.
g2: price
g3: peg_ratio_calculator
g4: LST Peg Deviation
g5: Dune dex.trades
scope: generic
returns:
- name: day
  type: date
- name: steth_eth_ratio
  type: number
inputs:
- key: token_a
  type: address
  label: Base token
  default: stETH
  required: true
- key: token_b
  type: address
  label: Quote token
  default: WETH
  required: true
