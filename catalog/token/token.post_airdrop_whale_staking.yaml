tool_id: token.post_airdrop_whale_staking
g1: token
description: Detects whale staking activity post-airdrop with accumulation signals.
g2: holders
g3: post_airdrop_whale_staking
g4: Whale Staking Patterns
g5: Kaito Airdrop Claims
scope: protocol:kaito
returns:
- name: whale_address
  type: string
- name: claimed
  type: number
- name: staked
  type: number
- name: accumulation_score
  type: number
inputs:
- key: min_claim
  type: number
  label: Min Claim Threshold
  default: '10000'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
