tool_id: token.pumpfun_dev_success_rate
g1: token
description: Measures developer success as graduated tokens over created.
g2: launchpad
g3: pumpfun_dev_success_rate
g4: Developer success ratio
g5: Pump.fun creates/withdraws
scope: protocol:pumpfun
returns:
- name: dev_address
  type: string
- name: tokens_created
  type: number
- name: tokens_graduated
  type: number
- name: success_rate
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_tokens
  type: number
  label: Min tokens created
  default: '1'
  required: false
