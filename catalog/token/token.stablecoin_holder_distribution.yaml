tool_id: token.stablecoin_holder_distribution
g1: token
description: Computes net holder balances and counts above USD thresholds.
g2: holders
g3: stablecoin_holder_distribution
g4: Holders Above Threshold
g5: Stablecoin net balances
scope: protocol:USDT
returns:
- name: holder_count
  type: number
- name: whale_count
  type: number
- name: threshold_usd
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '1000'
  required: true
