tool_id: token.staker_behavior_classifier
g1: token
g2: staking
g3: staker_behavior_classifier
g4: Staker Activity Profile
g5: Stakes to staking contract
description: Classifies stakers by stake frequency, size stats, and buckets.
scope: protocol:staking
returns:
- name: address
  type: string
- name: total_stakes
  type: number
- name: avg_stake_size
  type: number
- name: bucket
  type: string
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: staking_contract
  label: Staking Contract
  type: address
  required: true
- key: min_stakes
  label: Min Stakes
  type: number
  required: false
  default: '1'
