tool_id: token.successful_early_buyers
g1: token
g2: wallet
g3: successful_early_buyers
g4: Early Buyer ROI
g5: dex_solana.trades
description: Detects wallets buying new tokens early with high ROI based on inception metrics.
scope: generic
returns:
- name: wallet
  type: string
- name: token
  type: string
- name: inception_time
  type: string
- name: roi
  type: number
- name: first_hour_vol
  type: number
inputs:
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '14'
- key: min_roi
  label: Min ROI Threshold
  type: number
  required: false
  default: '2'
