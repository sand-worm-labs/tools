tool_id: token.successful_early_buyers
g1: token
description: Detects wallets buying new tokens early with high ROI based on inception
  metrics.
g2: wallet
g3: successful_early_buyers
g4: Early Buyer ROI
g5: dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: token
  type: string
- name: inception_time
  type: timestamp
- name: roi
  type: number
- name: first_hour_vol
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '14'
