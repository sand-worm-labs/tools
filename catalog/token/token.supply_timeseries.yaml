tool_id: token.supply_timeseries
g1: token
g2: supply
g3: supply_timeseries
g4: Daily Supply
g5: ERC20 Transfers
description: Computes daily mints, burns, net change, cumulative supply.
scope: generic
returns:
- name: date
  type: string
- name: minted
  type: number
- name: burned
  type: number
- name: net_change
  type: number
- name: cumulative
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: date_from
  label: Start Date
  type: date
  required: false
