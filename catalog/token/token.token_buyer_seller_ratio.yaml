tool_id: token.token_buyer_seller_ratio
g1: token
description: Computes buyer-to-seller ratio per token.
g2: holders
g3: token_buyer_seller_ratio
g4: Buyer Seller Ratio
g5: Distinct trader counts
scope: generic
returns:
- name: token_symbol
  type: string
- name: buyers
  type: number
- name: sellers
  type: number
- name: ratio
  type: number
inputs:
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: min_trades
  type: number
  label: Min Traders
  default: '10'
  required: false
