tool_id: token.token_dca_performance
g1: token
description: Calculates dollar-cost averaging returns over periodic buys.
g2: price
g3: token_dca_performance
g4: DCA Return
g5: prices.usd
scope: generic
returns:
- name: dt
  type: date
- name: avg_price
  type: number
- name: current_price
  type: number
- name: dca_return
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
