tool_id: token.token_net_accumulator_count
g1: token
g2: holders
g3: token_net_accumulator_count
g4: Accumulator Count
g5: dex.trades large buys
description: Counts wallets net accumulating a token via large trades excluding stables.
scope: generic
returns:
- name: token_address
  type: string
- name: token_symbol
  type: string
- name: accumulator_count
  type: number
inputs:
- key: chain
  label: Chain
  type: chain
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '7'
- key: min_usd
  label: Min USD
  type: number
  required: true
  default: '10000'
