tool_id: token.token_net_balance_tiers
g1: token
description: Calculates wallet counts in net balance tiers from buy/sell trades.
g2: holders
g3: token_net_balance_tiers
g4: Whale Holder Tiers
g5: Dune dex.trades net flows
scope: generic
returns:
- name: tier
  type: string
- name: wallet_count
  type: number
- name: min_balance
  type: number
- name: max_balance
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_from
  type: date
  label: Start Date
  required: false
- key: min_usd
  type: number
  label: Min USD
  default: '5000'
  required: false
