tool_id: token.token_price_ratio
g1: token
description: Computes price ratio between two tokens over time.
g2: price
g3: token_price_ratio
g4: Token Ratio
g5: prices.usd
scope: generic
returns:
- name: time
  type: timestamp
- name: ratio
  type: number
inputs:
- key: symbol_a
  type: text
  label: Token A
  required: true
- key: symbol_b
  type: text
  label: Token B
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
