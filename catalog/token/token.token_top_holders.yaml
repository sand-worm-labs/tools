tool_id: token.token_top_holders
g1: token
description: Ranks top holders by net balance.
g2: holders
g3: token_top_holders
g4: Top Token Holders
g5: ERC20 Transfers
scope: generic
returns:
- name: address
  type: string
- name: balance
  type: number
- name: rank
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
- key: min_balance
  type: number
  label: Min Balance (wei)
  default: '0'
  required: false
