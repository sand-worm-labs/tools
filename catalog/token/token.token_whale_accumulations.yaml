tool_id: token.token_whale_accumulations
g1: token
g2: holders
g3: token_whale_accumulations
g4: Whale Accumulation Rank
g5: Solana transfers
description: Ranks tokens by daily whale accumulation events using 99th percentile threshold.
scope: generic
returns:
- name: day
  type: string
- name: token_mint_address
  type: string
- name: whale_count
  type: number
inputs:
- key: threshold_percentile
  label: Whale Percentile
  type: number
  required: false
  default: '0.99'
- key: date
  label: Date
  type: date_range
  required: true
- key: top_n
  label: Top N
  type: number
  required: false
  default: '10'
