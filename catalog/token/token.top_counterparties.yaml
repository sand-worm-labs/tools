tool_id: token.top_counterparties
g1: token
g2: holders
g3: top_counterparties
g4: Top counterparties by net flow
g5: ERC20 transfers
description: Ranks counterparties by net received/sent volume over lookback.
scope: generic
returns:
- name: address
  type: string
- name: net_flow
  type: number
- name: direction
  type: string
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '30'
- key: decimals
  label: Token Decimals
  type: number
  required: true
  default: '18'
