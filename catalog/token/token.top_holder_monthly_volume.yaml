tool_id: token.top_holder_monthly_volume
g1: token
description: Aggregates monthly sent/received volumes for top token holders.
g2: holders
g3: top_holder_monthly_volume
g4: Top Holder Monthly Flows
g5: Holder-specific volume aggregation
scope: generic
returns:
- name: month
  type: date
- name: holder
  type: string
- name: sent
  type: number
- name: received
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
