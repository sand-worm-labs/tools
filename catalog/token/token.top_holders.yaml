tool_id: token.top_holders
g1: token
description: Computes net balances and ranks top holders for any token.
g2: holders
g3: top_holders
g4: Top token holders
g5: ERC20 transfer balances
scope: generic
returns:
- name: rank
  type: number
- name: address
  type: string
- name: balance
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '20'
  required: false
