tool_id: token.top_holders_by_balance
g1: token
description: Ranks wallets by latest known token balance using most recent activity.
g2: holders
g3: top_holders_by_balance
g4: Top holders ranked
g5: Latest balances
scope: generic
returns:
- name: rank
  type: number
- name: address
  type: string
- name: balance
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
