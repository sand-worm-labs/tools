tool_id: token.top_holders_holdings_change
g1: token
description: Computes percentage change in holdings for top holders across periods.
g2: holders
g3: top_holders_holdings_change
g4: Top holders change
g5: Dune query 3073653
scope: generic
returns:
- name: holder_address
  type: string
- name: current_hold
  type: number
- name: previous_hold
  type: number
- name: pct_change
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n
  type: number
  label: Top N
  default: '1000'
  required: false
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: false
