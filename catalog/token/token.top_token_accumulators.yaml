tool_id: token.top_token_accumulators
g1: token
g2: holders
g3: top_token_accumulators
g4: Top inflows
g5: Recent accumulators
description: Ranks top net accumulators over lookback period.
scope: generic
returns:
- name: wallet
  type: string
- name: net_inflow
  type: number
- name: rank
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: lookback_days
  label: Lookback Days
  type: number
  required: true
  default: '30'
- key: top_n
  label: Top N
  type: number
  required: false
  default: '100'
