tool_id: token.trader_cluster_detector
g1: token
description: Detects clusters of traders exchanging tokens among themselves from protocol
  activity.
g2: wallet
g3: trader_cluster_detector
g4: Inter-Trader Connections
g5: tokens_solana.transfers
scope: protocol:pump.fun
returns:
- name: wallet
  type: string
- name: cluster_size
  type: number
- name: connections
  type: number
inputs:
- key: protocol
  type: text
