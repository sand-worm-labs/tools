tool_id: token.transfer_graph
g1: token
description: Traces multi-level token transfers from a starting wallet.
g2: wallet
g3: transfer_graph
g4: Transfer Tracing
g5: Recursive transfers
scope: generic
returns:
- name: level
  type: number
- name: from
  type: string
- name: to
  type: string
- name: value
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: max_levels
  type: number
  label: Max Depth
  default: '5'
  required: false
