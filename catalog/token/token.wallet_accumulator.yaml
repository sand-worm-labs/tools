tool_id: token.wallet_accumulator
g1: token
description: Identifies wallets with net accumulation exceeding threshold.
g2: holders
g3: wallet_accumulator
g4: Net Accumulation
g5: Buy minus sell volume
scope: generic
returns:
- name: net_usd
  type: number
- name: is_accumulating
  type: boolean
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '500'
  required: false
