tool_id: token.wallet_net_token_balance
g1: token
description: Computes net token balance (bought - sold) for wallets across multiple
  chains.
g2: holders
g3: wallet_net_token_balance
g4: Net Token Holdings
g5: erc20 transfers union
scope: generic
returns:
- name: wallet
  type: string
- name: net_balance
  type: number
inputs:
- key: chain1
  type: chain
  label: Chain 1
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: chain2
  type: chain
  label: Chain 2
  default: polygon
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
