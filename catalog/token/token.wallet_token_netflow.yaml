tool_id: token.wallet_token_netflow
g1: token
g2: wallet
g3: wallet_token_netflow
g4: Net In/Out Flow
g5: ERC20 wallet deltas
description: Computes hourly net token flow for wallet.
scope: generic
returns:
- name: period
  type: string
- name: inflow
  type: number
- name: outflow
  type: number
- name: netflow
  type: number
inputs:
- key: contract_address
  label: Contract Address
  type: address
  required: true
- key: wallet_address
  label: Wallet Address
  type: address
  required: true
- key: interval
  label: Interval
  type: text
  required: false
  default: hour
