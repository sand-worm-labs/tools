tool_id: token.wallet_volume_leaderboard
g1: token
description: Ranks wallets by daily volume, trades, buys/sells, and tokens traded.
g2: wallet
g3: wallet_volume_leaderboard
g4: Top Wallet Volumes
g5: Dune dex.trades + prices
scope: generic
returns:
- name: wallet
  type: string
- name: total_volume_usd
  type: number
- name: daily_trades
  type: number
- name: daily_buys
  type: number
- name: daily_sells
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
