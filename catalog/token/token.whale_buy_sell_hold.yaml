tool_id: token.whale_buy_sell_hold
g1: token
description: Detects whales with buy/sell volumes and current net holdings.
g2: holders
g3: whale_buy_sell_hold
g4: Whale Portfolio
g5: Buy/sell net hold
scope: generic
returns:
- name: address
  type: string
- name: total_bought
  type: number
- name: total_sold
  type: number
- name: net_hold
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: true
