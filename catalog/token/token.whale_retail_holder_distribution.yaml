tool_id: token.whale_retail_holder_distribution
g1: token
description: Classifies holders as whales or retail with counts and percentages.
g2: holders
g3: whale_retail_holder_distribution
g4: Whale vs Retail Holders
g5: ERC20 balance aggregation
scope: generic
returns:
- name: holder_type
  type: string
- name: number_of_holders
  type: number
- name: total_balance
  type: number
- name: percentage
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '1000000'
  required: false
