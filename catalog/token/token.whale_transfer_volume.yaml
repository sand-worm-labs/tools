tool_id: token.whale_transfer_volume
g1: token
description: Aggregates large ETH transfers into whale categories monthly.
g2: holders
g3: whale_transfer_volume
g4: Monthly Whale Transfers
g5: Ethereum Transactions
scope: generic
returns:
- name: month
  type: date
- name: whale_category
  type: string
- name: num_transactions
  type: number
- name: eth_transfer
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_eth
  type: number
  label: Min ETH threshold
  default: '1000'
  required: false
