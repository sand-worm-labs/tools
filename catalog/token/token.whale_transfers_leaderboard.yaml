tool_id: token.whale_transfers_leaderboard
g1: token
description: Leaderboard of large ETH transfers by recipient daily.
g2: whale
g3: whale_transfers_leaderboard
g4: Whale ETH Transfers
g5: Threshold filter
scope: generic
returns:
- name: day
  type: date
- name: to_address
  type: string
- name: total_eth
  type: number
- name: tx_count
  type: number
inputs:
- key: min_usd
  type: number
  label: Min USD
  default: '1000000'
  required: true
- key: date_from
  type: date
  label: Start Date
  default: '7'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
