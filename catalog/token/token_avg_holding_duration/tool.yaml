tool_id: token.token_avg_holding_duration
g1: token
description: Calculates average holding duration from buy to sell trades.
g2: holders
g3: token_avg_holding_duration
g4: Avg Holding Duration
g5: Buy-sell time delta
scope: generic
returns:
- name: avg_duration
  type: number
- name: trader_count
  type: number
inputs:
- key: token_mint
  type: address
  label: Token Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
