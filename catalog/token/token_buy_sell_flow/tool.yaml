tool_id: token.token_buy_sell_flow
g1: token
description: Aggregates daily buy, sell volumes and net flow for token.
g2: dex
g3: token_buy_sell_flow
g4: Buy Sell Net Flow
g5: DEX trades buys/sells
scope: generic
returns:
- name: day
  type: date
- name: buy_usd
  type: number
- name: sell_usd
  type: number
- name: net_usd
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: false
