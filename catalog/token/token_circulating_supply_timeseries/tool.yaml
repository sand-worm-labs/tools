tool_id: token.token_circulating_supply_timeseries
g1: token
description: Computes daily circulating supply from mint and burn events.
g2: supply
g3: token_circulating_supply_timeseries
g4: Circulating Supply
g5: ERC20 mint-burn cumulative
scope: generic
returns:
- name: day
  type: date
- name: supply
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
