tool_id: token.token_cumulative_holders
g1: token
description: Computes daily new and cumulative unique holders.
g2: holders
g3: token_cumulative_holders
g4: Holder Growth
g5: ERC20 Transfers
scope: generic
returns:
- name: date
  type: date
- name: daily_new
  type: number
- name: cumulative_holders
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
