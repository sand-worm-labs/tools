tool_id: token.token_daily_new_holders
g1: token
description: Counts daily new token holders based on first receive or send.
g2: holders
g3: token_daily_new_holders
g4: New Holders Daily
g5: ERC20 Transfers
scope: generic
returns:
- name: date
  type: date
- name: new_holders
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
