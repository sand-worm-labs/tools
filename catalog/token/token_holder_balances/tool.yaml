tool_id: token.token_holder_balances
g1: token
description: Computes current balances across all token holders.
g2: holders
g3: token_holder_balances
g4: Holder balances
g5: ERC20 transfers
scope: generic
returns:
- name: address
  type: string
- name: balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: min_balance
  type: number
  label: Min balance threshold
  default: '0'
  required: false
