tool_id: token.token_holder_cohort_timeseries
g1: token
description: Tracks cumulative holders by first interaction date.
g2: holders
g3: token_holder_cohort_timeseries
g4: Holder cohorts
g5: First hold date
scope: generic
returns:
- name: address
  type: string
- name: first_date
  type: date
- name: balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
