tool_id: token.token_holder_growth_over_time
g1: token
description: Tracks cumulative unique token holders over time from first transfer
  interaction.
g2: holders
g3: token_holder_growth_over_time
g4: Holder Growth
g5: ERC20 Transfers
scope: generic
returns:
- name: date
  type: date
- name: daily_new
  type: number
- name: cumulative_holders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
