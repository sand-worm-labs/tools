tool_id: token.token_holder_leaderboard
g1: token
description: Ranks addresses by net token balance.
g2: holders
g3: token_holder_leaderboard
g4: Top Holders by Balance
g5: ERC20 net balances
scope: generic
returns:
- name: rank
  type: number
- name: address
  type: string
- name: balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
