tool_id: token.token_holder_net
g1: token
description: Computes net token balances for all holders.
g2: holders
g3: token_holder_net
g4: Net Holder Balances
g5: ERC20 transfer logs
scope: generic
returns:
- name: holder
  type: string
- name: net_balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
