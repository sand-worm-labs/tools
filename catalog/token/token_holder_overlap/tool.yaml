tool_id: token.token_holder_overlap
g1: token
description: Counts holders common to two tokens and overlap percentage.
g2: holders
g3: token_holder_overlap
g4: Overlapping holders
g5: ERC20 transfers
scope: generic
returns:
- name: overlap_count
  type: number
- name: holders_token1
  type: number
- name: holders_token2
  type: number
- name: overlap_pct
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: token_address1
  type: address
  label: Token 1 Address
  required: true
- key: token_address2
  type: address
  label: Token 2 Address
  required: true
