tool_id: token.token_holder_ranking
g1: token
description: Ranks wallets by net token balance from inflows minus outflows.
g2: holders
g3: token_holder_ranking
g4: Top holders
g5: transfers net balance
scope: generic
returns:
- name: holder
  type: string
- name: token_balance
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '20'
  required: false
