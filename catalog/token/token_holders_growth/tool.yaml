tool_id: token.token_holders_growth
g1: token
description: Tracks cumulative and daily new token holders.
g2: holders
g3: token_holders_growth
g4: Holder Growth
g5: ERC20 Transfers
scope: generic
returns:
- name: date
  type: date
- name: new_holders
  type: number
- name: total_holders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
