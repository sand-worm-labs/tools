tool_id: token.token_holders_over_time
g1: token
description: Computes daily unique holders with net change.
g2: holders
g3: token_holders_over_time
g4: Holders Over Time
g5: ERC20 transfers
scope: generic
returns:
- name: day
  type: date
- name: unique_wallets
  type: number
- name: daily_change
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
