tool_id: token.token_holders_timeseries
g1: token
description: Counts daily unique holders using cumulative net balances over time.
g2: holders
g3: token_holders_timeseries
g4: Holders count daily
g5: Cumulative balance
scope: generic
returns:
- name: date
  type: date
- name: daily_holders
  type: number
- name: cumulative_holders
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
