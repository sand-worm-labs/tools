tool_id: token.token_lifespan_analyzer
g1: token
description: Buckets tokens by trading lifespan days with trade counts.
g2: dex
g3: token_lifespan_analyzer
g4: Token Lifespan Buckets
g5: Dune dex.trades
scope: generic
returns:
- name: blockchain
  type: string
- name: lifespan_bucket
  type: string
- name: trades
  type: number
- name: first_trade
  type: date
- name: last_trade
  type: date
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
