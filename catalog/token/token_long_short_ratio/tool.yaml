tool_id: token.token_long_short_ratio
g1: token
description: Computes hourly long/short positions and ratio per trader.
g2: dex
g3: token_long_short_ratio
g4: Long/Short ratio
g5: Dune dex.trades
scope: generic
returns:
- name: hour
  type: timestamp
- name: trader
  type: string
- name: net_position
  type: number
- name: ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: start_timestamp
  type: date
  label: Start timestamp
  required: true
