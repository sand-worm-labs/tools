tool_id: token.token_net_accumulator_count
g1: token
description: Counts wallets net accumulating a token via large trades excluding stables.
g2: holders
g3: token_net_accumulator_count
g4: Accumulator Count
g5: dex.trades large buys
scope: generic
returns:
- name: token_address
  type: string
- name: token_symbol
  type: string
- name: accumulator_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '10000'
  required: true
