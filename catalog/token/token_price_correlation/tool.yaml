tool_id: token.token_price_correlation
g1: token
description: Computes rolling correlation of daily prices between two tokens.
g2: price
g3: token_price_correlation
g4: Price Correlation
g5: Dune prices.usd
scope: generic
returns:
- name: date
  type: date
- name: token1_price
  type: number
- name: token2_price
  type: number
- name: correlation
  type: number
inputs:
- key: token1
  type: text
  label: First Token Symbol
  required: true
- key: token2
  type: text
  label: Second Token Symbol
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
