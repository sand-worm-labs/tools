tool_id: token.token_risk_metrics
g1: token
description: Calculates Sharpe, Sortino, Calmar ratios for tokens.
g2: price
g3: token_risk_metrics
g4: Sharpe Sortino Calmar
g5: Multi-token price stats
scope: generic
returns:
- name: token
  type: string
- name: sharpe
  type: number
- name: sortino
  type: number
- name: calmar
  type: number
- name: stdev
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: true
