tool_id: token.token_supply_change
g1: token
description: Computes daily minted, burned, and cumulative circulating supply changes.
g2: supply
g3: token_supply_change
g4: Supply Dynamics
g5: solana.account_activity
scope: generic
returns:
- name: day
  type: date
- name: daily_minted
  type: number
- name: daily_burned
  type: number
- name: cumulative_supply
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  default: '"365 days ago"'
  required: false
