tool_id: token.token_supply_timeseries
g1: token
description: Tracks mint/burn net supply over time.
g2: holders
g3: token_supply_timeseries
g4: Cumulative Supply
g5: ERC20 Transfers
scope: generic
returns:
- name: day
  type: date
- name: supply
  type: number
- name: minted
  type: number
- name: burned
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
