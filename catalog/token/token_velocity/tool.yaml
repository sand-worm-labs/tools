tool_id: token.token_velocity
g1: token
description: Computes daily transferred volume, tx count, cumulative.
g2: transfer
g3: token_velocity
g4: Transfer Velocity
g5: ERC20 Transfers
scope: generic
returns:
- name: day
  type: date
- name: daily_volume
  type: number
- name: tx_count
  type: number
- name: cumulative_volume
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: decimals
  type: number
  label: Decimals
  required: true
- key: days_limit
  type: number
  label: Days Limit
  required: false
