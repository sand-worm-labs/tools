tool_id: token.token_wallet_pnl
g1: token
description: Calculates net PNL for wallets trading a token.
g2: wallet
g3: token_wallet_pnl
g4: Per-Wallet Profit Loss
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: buy_usd
  type: number
- name: sell_usd
  type: number
- name: net_pnl
  type: number
- name: token_held
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
