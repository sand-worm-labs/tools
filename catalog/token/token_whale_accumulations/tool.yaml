tool_id: token.token_whale_accumulations
g1: token
description: Ranks tokens by daily whale accumulation events using 99th percentile
  threshold.
g2: holders
g3: token_whale_accumulations
g4: Whale Accumulation Rank
g5: EVM ERC20 transfers
scope: generic
returns:
- name: day
  type: date
- name: token_address
  type: string
- name: whale_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: threshold_percentile
  type: number
  label: Whale Percentile
  default: '0.99'
  required: false
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
