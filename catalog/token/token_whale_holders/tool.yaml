tool_id: token.token_whale_holders
g1: token
description: Counts holders above balance threshold.
g2: holders
g3: token_whale_holders
g4: Whale Count
g5: ERC20 Transfers
scope: generic
returns:
- name: whale_count
  type: number
- name: threshold
  type: string
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_balance
  type: number
  label: Min Balance
  default: '1000'
  required: true
