tool_id: token.top_counterparties
g1: token
description: Ranks counterparties by net received/sent volume over lookback.
g2: holders
g3: top_counterparties
g4: Top counterparties by net flow
g5: ERC20 transfers
scope: generic
returns:
- name: address
  type: string
- name: net_flow
  type: number
- name: direction
  type: string
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: decimals
  type: number
  label: Token Decimals
  default: '18'
  required: true
