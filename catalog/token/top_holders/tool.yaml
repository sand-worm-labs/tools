tool_id: token.top_holders
g1: token
description: Computes net balances and ranks top holders for any token.
g2: holders
g3: top_holders
g4: Top token holders
g5: ERC20 transfer balances
scope: generic
returns:
- name: rank
  type: number
- name: address
  type: string
- name: balance
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: top_n
  type: number
  label: Top N
  default: '20'
  required: false
