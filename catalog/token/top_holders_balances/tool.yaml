tool_id: token.top_holders_balances
g1: token
description: Ranks wallets by most recent token balance.
g2: holders
g3: top_holders_balances
g4: Holder Balances
g5: Latest snapshot
scope: generic
returns:
- name: owner
  type: string
- name: token_balance
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
