tool_id: token.top_holders_net_balance
g1: token
description: Ranks wallets by net token balance using inflows minus outflows.
g2: holders
g3: top_holders_net_balance
g4: Top Holders Balance
g5: tokens_solana.transfers net flows
scope: generic
returns:
- name: wallet
  type: string
- name: net_balance
  type: number
- name: rank
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n
  type: number
  label: Top N
  default: '10'
  required: false
