tool_id: token.top_minters_leaderboard
g1: token
description: Ranks minters by total minted with timestamps.
g2: holders
g3: top_minters_leaderboard
g4: Minter Rankings
g5: Mint Events
scope: generic
returns:
- name: minter_address
  type: string
- name: total_minted
  type: number
- name: first_mint
  type: date
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
