tool_id: token.top_token_accumulators
g1: token
description: Ranks top net accumulators over lookback period.
g2: holders
g3: top_token_accumulators
g4: Top inflows
g5: Recent accumulators
scope: generic
returns:
- name: wallet
  type: string
- name: net_inflow
  type: number
- name: rank
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
