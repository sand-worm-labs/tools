tool_id: token.top_token_holders
g1: token
description: Ranks top holders by token balance at snapshot date.
g2: holders
g3: top_token_holders
g4: Holder Ranking Snapshot
g5: ERC20 transfer balances
scope: generic
returns:
- name: rank
  type: number
- name: address
  type: string
- name: holding
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
- key: date_to
  type: date
  label: End Date
  required: false
