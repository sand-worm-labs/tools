tool_id: token.trader_size_classification
g1: token
description: Classifies traders by average USD volume per trade into whale, dolphin,
  fish, shrimp.
g2: wallet
g3: trader_size_classification
g4: Whale Dolphin Segmentation
g5: dex.trades
scope: generic
returns:
- name: trader_id
  type: string
- name: classification
  type: string
- name: avg_usd_vol
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
