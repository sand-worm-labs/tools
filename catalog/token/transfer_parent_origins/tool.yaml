tool_id: token.transfer_parent_origins
g1: token
description: Classifies ERC20 transfers by originating parent trace caller.
g2: transfer
g3: transfer_parent_origins
g4: Transfer Caller Breakdown
g5: Parent Trace Analysis
scope: generic
returns:
- name: time
  type: timestamp
- name: caller
  type: string
- name: calls
  type: number
- name: volume
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
