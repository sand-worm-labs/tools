tool_id: token.user_cohort_analyzer
g1: token
description: Analyzes new vs returning user cohorts over time for token.
g2: wallet
g3: user_cohort_analyzer
g4: New vs Returning Users
g5: Dune dex.trades
scope: generic
returns:
- name: cohort_date
  type: date
- name: new_users
  type: number
- name: returning_users
  type: number
- name: retention
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
