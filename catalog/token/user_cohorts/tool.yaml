tool_id: token.user_cohorts
g1: token
description: Classifies users by first interaction block.
g2: holders
g3: user_cohorts
g4: Cohort Counts
g5: Dune Query 5928321
scope: generic
returns:
- name: cohort
  type: string
- name: user_count
  type: number
- name: first_block
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: cohort_blocks
  type: text
  label: Cohort Blocks
  required: false
  description: Comma-separated ascending block numbers marking cohort boundaries (e.g. "15000000,17000000,19000000"). Leave blank to split wallets into even quartiles by first-interaction block.
