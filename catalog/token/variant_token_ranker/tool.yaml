tool_id: token.variant_token_ranker
g1: token
description: Ranks tokens matching symbol pattern by recent volume.
g2: dex
g3: variant_token_ranker
g4: Variant token volume
g5: DEX trades
scope: generic
returns:
- name: symbol
  type: string
- name: volume
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: base_symbol
  type: text
  label: Base symbol
  default: BTC
  required: false
  description: Matches any token whose symbol contains this substring (e.g. "BTC" also finds WBTC, renBTC, HBTC).
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
