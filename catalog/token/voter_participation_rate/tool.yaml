tool_id: token.voter_participation_rate
g1: token
description: Calculates unique voters share among total holders at snapshots.
g2: holders
g3: voter_participation_rate
g4: Voter vs Holder Share
g5: On-chain governance metrics
scope: protocol:uniswap
returns:
- name: snapshot
  type: string
- name: total_holders
  type: number
- name: unique_voters
  type: number
- name: share_voters
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Governor Contract Address
  required: true
  description: Address of the on-chain governance contract (OpenZeppelin Governor / GovernorBravo) emitting VoteCast events.
