tool_id: token.wallet_native_balance_usd
g1: token
description: Computes net native token balance in USD for wallet.
g2: wallet
g3: wallet_native_balance_usd
g4: Native Balance USD
g5: Ethereum transactions + prices
scope: generic
returns:
- name: balance
  type: number
- name: token_price
  type: number
- name: balance_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: native_token
  type: text
  label: Native Token
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
