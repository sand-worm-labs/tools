tool_id: token.wallet_netflow_daily
g1: token
description: Calculates daily inflows, outflows, netflow for wallet.
g2: wallet
g3: wallet_netflow_daily
g4: Wallet Netflow
g5: Ethereum Transactions
scope: generic
returns:
- name: day
  type: date
- name: inflow
  type: number
- name: outflow
  type: number
- name: netflow
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
