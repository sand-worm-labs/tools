tool_id: token.wallet_realized_pnl
g1: token
description: Calculates realized PnL, win-rate for wallets trading token over period.
g2: wallet
g3: wallet_realized_pnl
g4: Wallet PnL and Win Rate
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: pnl_usd
  type: number
- name: win_rate
  type: number
- name: buy_volume
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
