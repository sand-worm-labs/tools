tool_id: token.wallet_retention_cohort
g1: token
description: Tracks daily unique wallets relative to total for retention analysis.
g2: holders
g3: wallet_retention_cohort
g4: Retention Metrics
g5: Daily vs total wallets
scope: generic
returns:
- name: day
  type: date
- name: unique_wallets
  type: number
- name: total_unique
  type: number
- name: retention_rate
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '200'
  required: true
