tool_id: token.wallet_token_flow_timeseries
g1: token
description: Computes daily net token inflows and outflows for a specific wallet.
g2: wallet
g3: wallet_token_flow_timeseries
g4: Daily inflow/outflow
g5: ERC20 transfers
scope: generic
returns:
- name: time
  type: timestamp
- name: category
  type: string
- name: raw_amt
  type: number
inputs:
- key: token_contract
  type: address
  label: Token contract
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: token_decimals
  type: number
  label: Token decimals
  default: '18'
  required: true
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
