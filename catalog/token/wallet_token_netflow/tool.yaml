tool_id: token.wallet_token_netflow
g1: token
description: Computes hourly net token flow for wallet.
g2: wallet
g3: wallet_token_netflow
g4: Net In/Out Flow
g5: ERC20 wallet deltas
scope: generic
returns:
- name: period
  type: string
- name: inflow
  type: number
- name: outflow
  type: number
- name: netflow
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: interval
  type: select
  label: Interval
  default: hour
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
