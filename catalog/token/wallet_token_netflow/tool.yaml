tool_id: token.wallet_token_netflow
g1: token
description: Computes hourly net token flow for wallet.
g2: wallet
g3: wallet_token_netflow
g4: Net In/Out Flow
g5: ERC20 wallet deltas
scope: generic
returns:
- name: period
  type: string
- name: inflow
  type: number
- name: outflow
  type: number
- name: netflow
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: interval
  type: select
  label: Interval
  default: hour
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
