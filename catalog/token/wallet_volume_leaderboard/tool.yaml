tool_id: token.wallet_volume_leaderboard
g1: token
description: Ranks wallets by daily volume, trades, buys/sells, and tokens traded.
g2: wallet
g3: wallet_volume_leaderboard
g4: Top Wallet Volumes
g5: Dune dex.trades + prices
scope: generic
returns:
- name: wallet
  type: string
- name: total_volume_usd
  type: number
- name: daily_trades
  type: number
- name: daily_buys
  type: number
- name: daily_sells
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
