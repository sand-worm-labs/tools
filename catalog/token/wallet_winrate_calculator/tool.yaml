tool_id: token.wallet_winrate_calculator
g1: token
description: Computes FIFO-based win-rate, realized ROI, and PNL for wallet batches
  on input tokens.
g2: wallet
g3: wallet_winrate_calculator
g4: FIFO Winrate
g5: dex_solana.trades
scope: generic
returns:
- name: wallet
  type: string
- name: winrate
  type: number
- name: roi
  type: number
- name: total_pnl
  type: number
- name: trade_count
  type: number
inputs:
- key: query_id
  type: number
  label: '"Input Pairs Query ID"'
  required: true
- key: days_back
  type: number
  label: '"Days Back"'
  default: '30'
  required: true
- key: min_cost_usd
  type: number
  label: '"Min Cost USD"'
  default: 1e-6
  required: false
