tool_id: token.wallet_winrate_calculator
g1: token
description: Computes FIFO-based win-rate, realized ROI, and PNL for wallet batches
  on input tokens.
g2: wallet
g3: wallet_winrate_calculator
g4: FIFO Winrate
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: winrate
  type: number
- name: roi
  type: number
- name: total_pnl
  type: number
- name: trade_count
  type: number
inputs:
- key: query_id
  type: number
  label: '"Input Pairs Query ID"'
  required: true
- key: days_back
  type: number
  label: '"Days Back"'
  default: '30'
  required: true
- key: min_cost_usd
  type: number
  label: '"Min Cost USD"'
  default: 1e-6
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
