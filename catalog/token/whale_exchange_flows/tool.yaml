tool_id: token.whale_exchange_flows
g1: token
description: Detects whale transfers to exchanges.
g2: holders
g3: whale_exchange_flows
g4: Whale Deposits to Exchanges
g5: Ethereum Transactions
scope: generic
returns:
- name: from_address
  type: string
- name: to_address
  type: string
- name: eth_amount
  type: number
- name: block_time
  type: timestamp
- name: transaction_hash
  type: string
inputs:
- key: threshold_eth
  type: number
  label: Minimum ETH threshold
  required: true
- key: date_to
  type: date
  label: End Date
  required: false
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: false
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
