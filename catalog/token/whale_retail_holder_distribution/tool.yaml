tool_id: token.whale_retail_holder_distribution
g1: token
description: Classifies holders as whales or retail with counts and percentages.
g2: holders
g3: whale_retail_holder_distribution
g4: Whale vs Retail Holders
g5: ERC20 balance aggregation
scope: generic
returns:
- name: holder_type
  type: string
- name: number_of_holders
  type: number
- name: total_balance
  type: number
- name: percentage
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '1000000'
  required: false
