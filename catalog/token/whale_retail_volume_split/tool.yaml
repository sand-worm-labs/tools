tool_id: token.whale_retail_volume_split
g1: token
description: Splits buy/sell volume by whale (>threshold) vs retail.
g2: dex
g3: whale_retail_volume_split
g4: Whale vs retail by period
g5: Dune dex_solana.trades
scope: generic
returns:
- name: date
  type: date
- name: user_type
  type: string
- name: buy_volume
  type: number
- name: sell_volume
  type: number
inputs:
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
- key: threshold_usd
  type: number
  label: Min USD Threshold
  default: '10000'
  required: true
