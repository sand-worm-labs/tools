tool_id: token.whale_transfer_volume
g1: token
description: Aggregates large ETH transfers into whale categories monthly.
g2: holders
g3: whale_transfer_volume
g4: Monthly Whale Transfers
g5: Ethereum Transactions
scope: generic
returns:
- name: month
  type: date
- name: whale_category
  type: string
- name: num_transactions
  type: number
- name: eth_transfer
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_eth
  type: number
  label: Min ETH threshold
  default: '1000'
  required: false
