tool_id: token.whale_transfers_leaderboard
g1: token
description: Leaderboard of large ETH transfers by recipient daily.
g2: whale
g3: whale_transfers_leaderboard
g4: Whale ETH Transfers
g5: Threshold filter
scope: generic
returns:
- name: day
  type: date
- name: to_address
  type: string
- name: total_eth
  type: number
- name: tx_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '1000000'
  required: true
- key: date_from
  type: date
  label: Start Date
  default: '7'
  required: false
- key: top_n
  type: number
  label: Top N
  default: '100'
  required: false
