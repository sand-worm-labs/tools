tool_id: token.wrapped_token_price_ratio
g1: token
description: Derives wrapped token price from underlying/wrapped transfer ratios on
  same tx.
g2: price
g3: wrapped_token_price_ratio
g4: Wrapped Price Ratio
g5: Wrap transfer join
scope: generic
returns:
- name: time
  type: timestamp
- name: ratio
  type: number
- name: wrapped_amount
  type: number
- name: underlying_amount
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
    icon: https://icons.llamao.fi/icons/chains/rsz_ethereum.jpg
  - label: Base
    value: base
    icon: https://icons.llamao.fi/icons/chains/rsz_base.jpg
  - label: Optimism
    value: optimism
    icon: https://icons.llamao.fi/icons/chains/rsz_optimism.jpg
  - label: Arbitrum
    value: arbitrum
    icon: https://icons.llamao.fi/icons/chains/rsz_arbitrum.jpg
  - label: Polygon
    value: polygon
    icon: https://icons.llamao.fi/icons/chains/rsz_polygon.jpg
  - label: BSC
    value: bsc
    icon: https://icons.llamao.fi/icons/chains/rsz_bsc.jpg
  - label: Avalanche
    value: avalanche
    icon: https://icons.llamao.fi/icons/chains/rsz_avalanche.jpg
  - label: Celo
    value: celo
    icon: https://icons.llamao.fi/icons/chains/rsz_celo.jpg
  required: true
- key: wrapped_contract
  type: address
  label: Wrapped Token
  required: true
- key: underlying_contract
  type: address
  label: Underlying Token
  required: true
