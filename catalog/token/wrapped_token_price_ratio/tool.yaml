tool_id: token.wrapped_token_price_ratio
g1: token
description: Derives wrapped token price from underlying/wrapped transfer ratios on
  same tx.
g2: price
g3: wrapped_token_price_ratio
g4: Wrapped Price Ratio
g5: Wrap transfer join
scope: generic
returns:
- name: time
  type: timestamp
- name: ratio
  type: number
- name: wrapped_amount
  type: number
- name: underlying_amount
  type: number
inputs:
- key: wrapped_contract
  type: address
  label: Wrapped Token
  required: true
- key: underlying_contract
  type: address
  label: Underlying Token
  required: true
