tool_id: wallet.activity_timeline
g1: wallet
description: Daily transaction activity for a wallet — identifies active periods and
  dormancy.
g2: activity
g3: activity_timeline
g4: Activity timeline
g5: Wallet transaction timeline
scope: generic
returns:
- name: day
  type: timestamp
- name: tx_count
  type: number
- name: sent_count
  type: number
- name: received_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
- key: days
  type: number
  label: Time range (days)
  default: 365
  required: true
