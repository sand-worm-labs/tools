tool_id: wallet.bot_activity_detector
g1: wallet
description: Detects potential bots via average transactions per signer in 5-minute
  intervals.
g2: identity
g3: bot_activity_detector
g4: Bot Activity Score
g5: 5min tx bursts
scope: generic
returns:
- name: month
  type: date
- name: signer
  type: string
- name: bot_score
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
