tool_id: wallet.bot_nonbot_daily_fees
g1: wallet
description: Classifies wallets as bots (100+ daily txs) vs non-bots and splits fees/volume
  by day.
g2: gas
g3: bot_nonbot_daily_fees
g4: Bot vs Non-Bot Fees
g5: Dune Solana Txs
scope: generic
returns:
- name: day
  type: date
- name: bot_fees
  type: number
- name: nonbot_fees
  type: number
- name: bot_txs
  type: number
- name: nonbot_txs
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
- key: bot_threshold
  type: number
  label: Bot Tx Threshold
  default: '100'
  required: false
