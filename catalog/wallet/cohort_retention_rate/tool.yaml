tool_id: wallet.cohort_retention_rate
g1: wallet
description: Computes retention rate for defined user cohort over period.
g2: cohort
g3: cohort_retention_rate
g4: Retention Rate
g5: User Retention
scope: generic
returns:
- name: initial_users
  type: number
- name: retained_users
  type: number
- name: retention_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_range_1
  type: date_range
  label: Date Range 1
  default:
    to: ''
    from: ''
  required: true
- key: date_range_2
  type: date_range
  label: Date Range 2
  default:
    to: ''
    from: ''
  required: true
