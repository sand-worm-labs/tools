tool_id: wallet.contract_stickiness_score
g1: wallet
description: Measures contract interaction stickiness via DAU/MAU ratios.
g2: retention
g3: contract_stickiness_score
g4: Stickiness Metrics
g5: DAU/MAU Analysis
scope: generic
returns:
- name: contract
  type: string
- name: dau
  type: number
- name: mau
  type: number
- name: stickiness_ratio
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
