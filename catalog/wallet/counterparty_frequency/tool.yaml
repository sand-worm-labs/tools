tool_id: wallet.counterparty_frequency
g1: wallet
description: Most frequent addresses a wallet interacts with — surfaces key relationships.
g2: identity
g3: counterparty_frequency
g4: Counterparty frequency
g5: Wallet counterparty frequency
scope: generic
returns:
- name: counterparty
  type: string
- name: interaction_count
  type: number
- name: first_seen
  type: timestamp
- name: last_seen
  type: timestamp
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
- key: days
  type: number
  label: Time range (days)
  default: 90
  required: true
- key: top_n
  type: select
  label: Top N counterparties
  default: '25'
  options:
  - label: Top 10
    value: '10'
  - label: Top 25
    value: '25'
  - label: Top 50
    value: '50'
  - label: Top 100
    value: '100'
  required: true
