tool_id: wallet.cumulative_new_protocol_users
g1: wallet
description: Computes daily new users by first interaction date and cumulative total.
g2: identity
g3: cumulative_new_protocol_users
g4: Cumulative new users
g5: transactions first tx cohort
scope: protocol
returns:
- name: date
  type: date
- name: new_users
  type: number
- name: cumulative_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol
  type: text
  label: Protocol
  required: true
- key: date_from
  type: date
  label: Start Date
  required: false
