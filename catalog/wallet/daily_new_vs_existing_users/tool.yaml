tool_id: wallet.daily_new_vs_existing_users
g1: wallet
description: Segments daily users into new and returning based on first interaction.
g2: cohort
g3: daily_new_vs_existing_users
g4: User Segmentation
g5: Deposit Transactions
scope: generic
returns:
- name: time
  type: timestamp
- name: new
  type: number
- name: existing
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: protocol_address
  type: address
  label: '"Protocol Address"'
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '60'
  required: false
