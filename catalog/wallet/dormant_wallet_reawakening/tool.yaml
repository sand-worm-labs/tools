tool_id: wallet.dormant_wallet_reawakening
g1: wallet
description: Identifies wallets dormant over 30 days now active.
g2: wallet
g3: dormant_wallet_reawakening
g4: Reawakened Wallets
g5: Ethereum Transactions
scope: generic
returns:
- name: wallet
  type: string
- name: days_dormant
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
