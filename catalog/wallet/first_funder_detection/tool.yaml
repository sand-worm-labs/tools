tool_id: wallet.first_funder_detection
g1: wallet
description: Identifies first funder for recently created addresses.
g2: identity
g3: first_funder_detection
g4: First Funder Analysis
g5: New Address Funding
scope: generic
returns:
- name: block_time
  type: timestamp
- name: sender_address
  type: string
- name: recipient_address
  type: string
- name: amount
  type: number
- name: tx_hash
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
