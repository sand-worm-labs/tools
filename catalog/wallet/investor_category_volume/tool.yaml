tool_id: wallet.investor_category_volume
g1: wallet
description: Categorizes transactions by investor size thresholds.
g2: wallet
g3: investor_category_volume
g4: Tx by Category
g5: Ethereum Transactions
scope: generic
returns:
- name: category
  type: string
- name: tx_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: min_usd
  type: number
  label: Min USD
  default: '1000'
  required: false
