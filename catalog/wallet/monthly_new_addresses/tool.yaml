tool_id: wallet.monthly_new_addresses
g1: wallet
description: Counts unique addresses by month of first transaction appearance.
g2: cohort
g3: monthly_new_addresses
g4: New Addresses Monthly
g5: First appearance union
scope: generic
returns:
- name: month
  type: date
- name: new_addresses
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
