tool_id: wallet.monthly_top_outbound_recipients
g1: wallet
description: Ranks top ETH outbound recipient addresses monthly by volume.
g2: transfers
g3: monthly_top_outbound_recipients
g4: Monthly outbound ranking
g5: Ethereum traces
scope: generic
returns:
- name: month
  type: date
- name: to_address
  type: string
- name: token_out
  type: number
- name: tx_count
  type: number
- name: rank
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
