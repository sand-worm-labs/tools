tool_id: wallet.multi_wallet_compare
g1: wallet
description: Side-by-side activity metrics for a set of wallets — cohort and team
  analysis.
g2: cohort
g3: multi_wallet_compare
g4: Multi-wallet comparison
g5: Wallet cohort comparison
scope: generic
returns:
- name: wallet
  type: string
- name: transfer_count
  type: number
- name: total_amount
  type: number
- name: unique_counterparties
  type: number
- name: first_activity
  type: timestamp
- name: last_activity
  type: timestamp
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallets
  type: address[]
  label: Wallet addresses
  required: true
  placeholder: 0x...
- key: days
  type: number
  label: Time range (days)
  default: 30
  required: true
