tool_id: wallet.nansen_agent_query
g1: wallet
description: Ask the Nansen AI research agent a free-form on-chain question; returns a free-form AI-generated answer (not structured rows), via the Nansen API.
g2: agent
g3: nansen_agent_query
g4: Nansen agent
g5: Nansen AI agent query
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: answer
  type: string
- name: conversation_id
  type: string
- name: tool_calls
  type: string
- name: tool_call_count
  type: number
- name: answer_word_count
  type: number
inputs:
- key: text
  type: text
  label: Question
  required: true
  placeholder: What are smart money wallets buying on Solana this week?
  description: Research query or question for the Nansen AI agent.
- key: agent_mode
  type: select
  label: Agent mode
  required: false
  default: fast
  options:
  - label: Fast
    value: fast
  - label: Expert
    value: expert
- key: conversation_id
  type: text
  label: Conversation ID
  required: false
  description: Optional conversation ID for multi-turn interactions, returned in a previous response's finish event. Omit to start a new conversation.
