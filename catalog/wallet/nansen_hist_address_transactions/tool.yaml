tool_id: wallet.nansen_hist_address_transactions
g1: wallet
description: The most recent token transfer transactions for a wallet address as of a historical snapshot date, with temporally-correct counterparty labels, via the Nansen API.
g2: backtesting
g3: nansen_hist_address_transactions
g4: Historical address transactions
g5: Nansen historical address transactions
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: source_type
  type: string
- name: method
  type: string
- name: transaction_hash
  type: string
- name: tokens_received
  type: string
- name: tokens_sent
  type: string
- name: volume_usd
  type: number
- name: block_timestamp
  type: string
- name: chain
  type: string
inputs:
- key: address
  type: text
  label: Wallet address
  required: true
  placeholder: 0x... or Solana base58 address
  description: EVM hex or Solana base58 wallet address.
- key: chain
  type: select
  label: Chain
  required: true
  options:
  - label: Base
    value: base
  - label: BNB Chain
    value: bnb
  - label: Ethereum
    value: ethereum
  - label: Solana
    value: solana
- key: as_of_date
  type: date
  label: As of date
  required: true
  description: Historical snapshot date; only transactions on or before this date are returned, with counterparty labels resolved as of this date.
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 20
  min: 1
  max: 20
  description: The endpoint returns at most 20 rows total; paging beyond that yields empty results.
