tool_id: wallet.nansen_hist_smart_money_positions
g1: wallet
description: Aggregate smart money token balances and 24h change as of a historical snapshot date, via the Nansen API.
g2: backtesting
g3: nansen_hist_smart_money_positions
g4: Historical smart money positions
g5: Nansen historical smart money positions
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: chain
  type: string
- name: token_address
  type: string
- name: token_symbol
  type: string
- name: token_sectors
  type: string
- name: value_usd
  type: number
- name: balance_24h_percent_change
  type: number
- name: holders_count
  type: number
- name: share_of_holdings_percent
  type: number
- name: token_age_days
  type: number
- name: market_cap_usd
  type: number
inputs:
- key: as_of_date
  type: date
  label: As of date
  required: true
  description: Historical snapshot date to query smart money balances for.
- key: chains
  type: text
  label: Chains
  required: false
  placeholder: ethereum,solana
  description: "Comma-separated; empty includes all chains. Allowed values: all, arbitrum, arc, avalanche, base, bnb, ethereum, hyperevm, iotaevm, linea, mantle, monad, optimism, plasma, polygon, robinhood, sei, solana, sonic."
- key: sm_filter
  type: text
  label: Smart money labels
  required: false
  placeholder: Fund,Smart Trader
  description: "Comma-separated; empty includes all smart money labels. Allowed values: Fund, Smart Trader, 30D Smart Trader, 90D Smart Trader, 180D Smart Trader, Smart Dex Trader, 30D Smart Dex Trader, 90D Smart Dex Trader, 180D Smart Dex Trader, Smart HL Perps Trader."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
