tool_id: wallet.nansen_profiler_address_historical_balances
g1: wallet
description: Historical token balance snapshots for a wallet address (or Nansen entity) over a date range, flagging swings relative to each token's own typical balance size, via the Nansen API.
g2: profiler
g3: nansen_profiler_address_historical_balances
g4: Address historical balances
g5: Nansen profiler historical balances
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: block_timestamp
  type: string
- name: chain
  type: string
- name: token_address
  type: string
- name: token_symbol
  type: string
- name: token_amount
  type: number
- name: value_usd
  type: number
- name: swing_vs_own_avg_pct
  type: number
inputs:
- key: chain
  type: select
  label: Chain
  required: true
  default: ethereum
  options:
  - label: All
    value: all
  - label: Arbitrum
    value: arbitrum
  - label: Arc
    value: arc
  - label: Avalanche
    value: avalanche
  - label: Base
    value: base
  - label: Bitcoin
    value: bitcoin
  - label: BNB Chain
    value: bnb
  - label: Ethereum
    value: ethereum
  - label: HyperEVM
    value: hyperevm
  - label: Injective
    value: injective
  - label: IoTeX EVM
    value: iotaevm
  - label: Linea
    value: linea
  - label: Mantle
    value: mantle
  - label: MANTRA
    value: mantra
  - label: Monad
    value: monad
  - label: NEAR
    value: near
  - label: Optimism
    value: optimism
  - label: Plasma
    value: plasma
  - label: Polygon
    value: polygon
  - label: Robinhood
    value: robinhood
  - label: Sei
    value: sei
  - label: Solana
    value: solana
  - label: Sonic
    value: sonic
  - label: Starknet
    value: starknet
  - label: Sui
    value: sui
  - label: TON
    value: ton
  - label: Tron
    value: tron
- key: address
  type: text
  label: Wallet address
  required: false
  placeholder: 0x... or a Solana address
  description: Wallet address to look up. Provide this or entity_name.
- key: entity_name
  type: text
  label: Entity name
  required: false
  description: Nansen entity name to look up instead of a raw address.
- key: date_from
  type: date
  label: From date
  required: true
  placeholder: '2025-01-01'
- key: date_to
  type: date
  label: To date
  required: true
  placeholder: '2025-01-31'
- key: hide_spam_tokens
  type: text
  label: Hide spam tokens
  required: false
  default: 'true'
  placeholder: 'true'
  description: "'true' or 'false'."
- key: token_symbol
  type: text
  label: Token symbol filter
  required: false
  placeholder: USDC
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: block_timestamp
  options:
  - label: Timestamp
    value: block_timestamp
  - label: Position value (USD)
    value: value_usd
  - label: Token symbol
    value: token_symbol
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
