tool_id: wallet.nansen_profiler_perp_pnl_summary
g1: wallet
description: Realized perp PnL summary for a Hyperliquid address over a date range (top 5 coins, win rate, fees), with each top coin's share of total realized PnL, via the Nansen API.
g2: profiler
g3: nansen_profiler_perp_pnl_summary
g4: Perp PnL summary
g5: Nansen profiler perp PnL summary
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: coin
  type: string
- name: realized_pnl_usd
  type: number
- name: realized_roi
  type: number
- name: closed_trade_count
  type: number
- name: fees_usd
  type: number
- name: account_realized_pnl_usd
  type: number
- name: account_win_rate
  type: number
- name: pct_of_account_realized_pnl
  type: number
inputs:
- key: address
  type: text
  label: Hyperliquid address
  required: true
  placeholder: '0x...'
  description: 42-character hexadecimal Hyperliquid user address.
- key: date_from
  type: date
  label: From date
  required: false
  placeholder: '2025-05-01'
- key: date_to
  type: date
  label: To date
  required: false
  placeholder: '2025-05-31'
