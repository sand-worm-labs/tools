tool_id: wallet.nansen_smart_money_netflows
g1: wallet
description: Ranks tokens by smart-money conviction (flow per trader, flow as % of market cap) and classifies each as accumulation, distribution, or a trend reversal, from Nansen smart-money netflow data.
g2: smart_money
g3: nansen_smart_money_netflows
g4: Smart money conviction & trend
g5: Nansen smart money netflow analysis
scope: generic
required_env:
- name: NANSEN_API_KEY
  description: Nansen API key (https://api.nansen.ai)
returns:
- name: token_address
  type: string
- name: token_symbol
  type: string
- name: chain
  type: string
- name: net_flow_1h_usd
  type: number
- name: net_flow_24h_usd
  type: number
- name: net_flow_7d_usd
  type: number
- name: net_flow_30d_usd
  type: number
- name: token_sectors
  type: string
- name: trader_count
  type: number
- name: token_age_days
  type: number
- name: market_cap_usd
  type: number
- name: flow_per_trader_24h_usd
  type: number
- name: flow_intensity_30d_pct_mcap
  type: number
- name: smart_money_trend
  type: string
inputs:
- key: chains
  type: text
  label: Chains
  required: true
  default: all
  placeholder: ethereum,solana
  description: "Comma-separated. Allowed values: all, arbitrum, arc, avalanche, base, bnb, ethereum, hyperevm, iotaevm, linea, mantle, monad, optimism, plasma, polygon, robinhood, sei, solana, sonic."
- key: token_address
  type: text
  label: Token address or symbol
  required: false
  placeholder: 0x... or ETH
- key: include_smart_money_labels
  type: text
  label: Smart money labels
  required: false
  placeholder: Fund,Smart Trader
  description: "Comma-separated. Allowed values: Fund, Smart Trader, 30D Smart Trader, 90D Smart Trader, 180D Smart Trader, Smart HL Perps Trader."
- key: per_page
  type: number
  label: Results per page
  required: false
  default: 10
  min: 1
  max: 1000
- key: sort_field
  type: select
  label: Sort by
  required: false
  default: net_flow_24h_usd
  options:
  - label: 1h net flow (USD)
    value: net_flow_1h_usd
  - label: 24h net flow (USD)
    value: net_flow_24h_usd
  - label: 7d net flow (USD)
    value: net_flow_7d_usd
  - label: 30d net flow (USD)
    value: net_flow_30d_usd
  - label: Trader count
    value: trader_count
  - label: Token age (days)
    value: token_age_days
  - label: Market cap (USD)
    value: market_cap_usd
- key: sort_direction
  type: select
  label: Sort direction
  required: false
  default: DESC
  options:
  - label: Descending
    value: DESC
  - label: Ascending
    value: ASC
