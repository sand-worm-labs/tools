tool_id: wallet.new_vs_returning_daily_users
g1: wallet
description: Counts new users and total active users daily.
g2: wallet
g3: new_vs_returning_daily_users
g4: User cohort analysis
g5: ethereum.transactions
scope: generic
returns:
- name: date
  type: date
- name: new_users
  type: number
- name: total_active_users
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  required: true
