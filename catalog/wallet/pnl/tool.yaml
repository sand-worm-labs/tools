tool_id: wallet.pnl
g1: wallet
description: Realised profit/loss for a wallet across all ERC20 tokens in a time window.
g2: pnl
g3: pnl
g4: Wallet PnL tracker
g5: ERC20 buy/sell cost basis
scope: generic
returns:
- name: contract_address
  type: string
- name: bought_amount
  type: number
- name: sold_amount
  type: number
- name: bought_usd
  type: number
- name: sold_usd
  type: number
- name: realized_pnl_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
- key: days
  type: number
  label: Time range (days)
  default: 30
  required: true
