tool_id: wallet.portfolio_snapshot
g1: wallet
description: Current ERC20 token holdings for a wallet with USD values.
g2: balance
g3: portfolio_snapshot
g4: Portfolio snapshot
g5: Current ERC20 holdings
scope: generic
returns:
- name: contract_address
  type: string
- name: token_symbol
  type: string
- name: balance
  type: number
- name: price_usd
  type: number
- name: value_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
