tool_id: wallet.protocol_cohort_retention
g1: wallet
description: Computes weekly cohort retention for protocol users.
g2: retention
g3: protocol_cohort_retention
g4: Retention Rates
g5: Transaction Cohorts
scope: protocol
returns:
- name: cohort_week
  type: date
- name: retention_day
  type: number
- name: active_users
  type: number
- name: retention_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '35'
  required: false
