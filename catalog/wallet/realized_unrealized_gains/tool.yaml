tool_id: wallet.realized_unrealized_gains
g1: wallet
description: Token-level cost basis vs current value — which positions are in profit.
g2: pnl
g3: realized_unrealized_gains
g4: Realised vs unrealised gains
g5: Cost basis vs current value
scope: generic
returns:
- name: token_address
  type: string
- name: net_balance
  type: number
- name: avg_cost_basis
  type: number
- name: realized_gain_usd
  type: number
- name: unrealized_gain_usd
  type: number
- name: current_price_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet
  type: address
  label: Wallet address
  required: true
  placeholder: 0x...
