tool_id: wallet.reverse_tx_detector
g1: wallet
description: Detects A-to-B followed by B-to-A tx pairs as potential cycles.
g2: identity
g3: reverse_tx_detector
g4: Paired reverse transfers
g5: Circular flow signals
scope: generic
returns:
- name: wallet
  type: string
- name: pair_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
