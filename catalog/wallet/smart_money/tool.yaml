tool_id: wallet.smart_money
g1: wallet
description: Top profitable wallets trading a token — find who's consistently early.
g2: whale
g3: smart_money
g4: Smart money tracker
g5: Early-trader profit ranking
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: token_address
  type: token_address
  label: Token address
  required: true
  placeholder: 0x...
- key: days
  type: number
  label: Time range (days)
  default: 30
  required: true
- key: top_n
  type: select
  label: Top N wallets
  default: '25'
  options:
  - label: Top 10
    value: '10'
  - label: Top 25
    value: '25'
  - label: Top 50
    value: '50'
  - label: Top 100
    value: '100'
  required: true
