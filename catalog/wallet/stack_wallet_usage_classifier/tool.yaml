tool_id: wallet.stack_wallet_usage_classifier
g1: wallet
description: Classifies Stack wallet usage by post-creation events like liquidations
  and supplies.
g2: stack
g3: stack_wallet_usage_classifier
g4: Wallet Activity Score
g5: Post-Creation Events
scope: protocol:stack
returns:
- name: wallet
  type: string
- name: creation_time
  type: timestamp
- name: activity_score
  type: number
- name: signals
  type: string
inputs:
- key: top_n
  type: number
  label: Top N
  default: '250'
  required: false
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
