tool_id: wallet.sustained_activity_bots
g1: wallet
description: Flags addresses with sustained high activity (12+ hours/day).
g2: bot
g3: sustained_activity_bots
g4: Bot Detection
g5: Hourly activity threshold
scope: generic
returns:
- name: address
  type: string
- name: active_hours
  type: number
- name: bot_score
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: threshold_hours
  type: number
  label: Min Hours/Day
  default: '12'
  required: false
