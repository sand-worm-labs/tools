tool_id: wallet.top_balance_increasers
g1: wallet
description: Ranks wallets by net positive SOL balance change since date.
g2: whales
g3: top_balance_increasers
g4: Top Gainers
g5: Native balance change
scope: generic
returns:
- name: address
  type: string
- name: balance_change
  type: number
- name: link
  type: string
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n
  type: number
  label: Top N
  default: '1000'
  required: false
