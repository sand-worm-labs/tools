tool_id: wallet.tx_count_cdf
g1: wallet
description: Computes cumulative distribution of wallet transaction counts.
g2: activity
g3: tx_count_cdf
g4: Activity Distribution
g5: Wallet Cohorts
scope: generic
returns:
- name: total_txs
  type: number
- name: addresses
  type: number
- name: percentile
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
