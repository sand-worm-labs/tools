tool_id: wallet.tx_flow_tracer
g1: wallet
description: Traces transaction flows from start wallet through intermediate hops
  to target.
g2: identity
g3: tx_flow_tracer
g4: multi-hop tracer
g5: address path analysis
scope: generic
returns:
- name: block_time
  type: timestamp
- name: from
  type: string
- name: to
  type: string
- name: value
  type: number
- name: hop
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: start_wallet
  type: address
  label: '"Start Wallet"'
  required: true
- key: target_contract
  type: address
  label: '"Target Contract"'
  required: true
- key: max_hops
  type: number
  label: '"Max Hops"'
  default: '5'
  required: false
