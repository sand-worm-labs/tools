tool_id: wallet.tx_frequency_distribution
g1: wallet
description: Buckets wallets by transaction count in lookback period revealing power
  user distribution.
g2: activity
g3: tx_frequency_distribution
g4: Transaction Frequency Buckets
g5: Ethereum Transactions
scope: generic
returns:
- name: bucket
  type: string
- name: wallet_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: true
