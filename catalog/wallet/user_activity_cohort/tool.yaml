tool_id: wallet.user_activity_cohort
g1: wallet
description: Classifies users into cohorts by lifetime transaction count.
g2: behavior
g3: user_activity_cohort
g4: User Activity Buckets
g5: Transaction frequency cohorts
scope: protocol:bridge
returns:
- name: cohort
  type: string
- name: address_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
