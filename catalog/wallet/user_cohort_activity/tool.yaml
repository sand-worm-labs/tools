tool_id: wallet.user_cohort_activity
g1: wallet
description: 'Computes monthly cohort metrics by initial active date: avg txs, gas,
  ETH transferred.'
g2: cohort
g3: user_cohort_activity
g4: Cohort metrics
g5: Monthly user summary
scope: generic
returns:
- name: block_date
  type: date
- name: user_count
  type: number
- name: avg_tx_count
  type: number
- name: avg_gas
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
