tool_id: wallet.bot_nonbot_daily_fees
g1: wallet
g2: gas
g3: bot_nonbot_daily_fees
g4: Bot vs Non-Bot Fees
g5: Dune Solana Txs
description: Classifies wallets as bots (100+ daily txs) vs non-bots and splits fees/volume by day.
scope: generic
returns:
- name: day
  type: string
- name: bot_fees
  type: number
- name: nonbot_fees
  type: number
- name: bot_txs
  type: number
- name: nonbot_txs
  type: number
inputs:
- key: lookback_days
  label: Lookback Days
  type: number
  required: false
  default: '30'
- key: bot_threshold
  label: Bot Tx Threshold
  type: number
  required: false
  default: '100'
