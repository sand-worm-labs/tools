tool_id: wallet.common_funder
g1: wallet
description: Finds wallets that funded a set of addresses — common-input heuristic
  for clustering.
g2: identity
g3: common_funder
g4: Common funder / clustering
g5: Common-input funding heuristic
scope: generic
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallets
  type: address[]
  label: Target addresses
  required: true
  placeholder: 0x...
- key: days
  type: select
  label: Look-back window
  default: '365'
  options:
  - label: Last 7 days
    value: '7'
  - label: Last 30 days
    value: '30'
  - label: Last 90 days
    value: '90'
  - label: Last 180 days
    value: '180'
  - label: Last year
    value: '365'
  - label: All time
    value: all
  required: true
