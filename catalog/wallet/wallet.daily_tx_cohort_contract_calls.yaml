tool_id: wallet.daily_tx_cohort_contract_calls
g1: wallet
description: Classifies users into daily transaction volume cohorts and counts their
  contract calls.
g2: cohort
g3: daily_tx_cohort_contract_calls
g4: Cohort Contract Calls
g5: tx cohorts + labels
scope: generic
returns:
- name: block_date
  type: date
- name: cohort
  type: string
- name: contract
  type: string
- name: call_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: tx_success
  type: text
  label: Success Only
  default: 'true'
  required: false
