tool_id: wallet.daily_user_cohorts
g1: wallet
description: Computes daily new, returning, and total active users.
g2: wallet
g3: daily_user_cohorts
g4: New vs returning users
g5: Polygon tx analysis
scope: generic
returns:
- name: date
  type: date
- name: new_users
  type: number
- name: returning_users
  type: number
- name: total_users
  type: number
inputs:
- key: protocol
  type: text
  label: Protocol
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: interval
  type: select
  label: Interval
  default: day
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: false
