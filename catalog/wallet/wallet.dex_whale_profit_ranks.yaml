tool_id: wallet.dex_whale_profit_ranks
g1: wallet
description: Ranks top wallets by estimated profit from stablecoin trades.
g2: dex
g3: dex_whale_profit_ranks
g4: Whale Profit Ranking
g5: Dune dex.trades
scope: generic
returns:
- name: wallet
  type: string
- name: total_volume
  type: number
- name: total_trades
  type: number
- name: profit_usd
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  required: true
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
- key: min_usd
  type: number
  label: Min USD
  default: '100000'
  required: false
