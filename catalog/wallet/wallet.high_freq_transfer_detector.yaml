tool_id: wallet.high_freq_transfer_detector
g1: wallet
description: Detects wallets with >=3000 transfers to same address in rolling 1-day
  window.
g2: bot
g3: high_freq_transfer_detector
g4: Bot signals
g5: Rolling transfers
scope: generic
returns:
- name: wallet
  type: string
- name: recipient
  type: string
- name: transfers
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: threshold number of transfers
  type: number
  label: Threshold Number Of Transfers
  default: '3000'
  required: false
