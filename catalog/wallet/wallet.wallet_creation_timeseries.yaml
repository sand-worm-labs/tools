tool_id: wallet.wallet_creation_timeseries
g1: wallet
description: Counts wallet creations over time from deployers.
g2: identity
g3: wallet_creation_timeseries
g4: Wallet Creations
g5: Ethereum Traces
scope: generic
returns:
- name: month
  type: date
- name: created_wallets
  type: number
- name: cumulative_wallets
  type: number
inputs:
- key: deployers
  type: address
  label: Deployer Addresses
  required: true
- key: interval
  type: select
  label: Interval
  default: month
  options:
  - label: Minute
    value: minute
  - label: Hour
    value: hour
  - label: Day
    value: day
  - label: Week
    value: week
  - label: Month
    value: month
  required: true
