tool_id: wallet.whale_top_destinations
g1: wallet
g2: whale
g3: whale_top_destinations
g4: Whale Counterparties
g5: Top spenders top tos
description: Identifies top N value-sending wallets in period and ranks their top M destinations by total
  value.
scope: generic
returns:
- name: whale_from
  type: string
- name: top_to
  type: string
- name: total_value
  type: number
- name: destination_rank
  type: number
inputs:
- key: date_from
  label: Start Date
  type: date
  required: true
- key: top_n_whales
  label: Top Whale Tx Count
  type: number
  required: false
  default: '10'
- key: top_n_dests
  label: Top Dest per Whale
  type: number
  required: false
  default: '5'
