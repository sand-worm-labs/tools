tool_id: wallet.wallet_activity_cohorts
g1: wallet
description: Computes daily/weekly/monthly active unique wallets.
g2: activity
g3: wallet_activity_cohorts
g4: DAU/WAU/MAU
g5: ethereum.traces unique callers
scope: protocol
returns:
- name: period
  type: string
- name: dau
  type: number
- name: wau
  type: number
- name: mau
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
