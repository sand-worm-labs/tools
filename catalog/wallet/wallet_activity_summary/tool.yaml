tool_id: wallet.wallet_activity_summary
g1: wallet
description: Summarizes total transactions, activity span, and current balance.
g2: activity
g3: wallet_activity_summary
g4: Lifetime Metrics
g5: solana.account_activity
scope: generic
returns:
- name: total_transactions
  type: number
- name: first_activity
  type: date
- name: last_activity
  type: date
- name: current_balance_sol
  type: number
inputs:
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '7'
  required: false
