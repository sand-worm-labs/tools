tool_id: wallet.wallet_age_calculator
g1: wallet
description: Computes wallet creation date, age in days, and inactivity period.
g2: wallet
g3: wallet_age_calculator
g4: Wallet Age Metrics
g5: ethereum.transactions
scope: generic
returns:
- name: wallet_address
  type: string
- name: first_transaction_date
  type: date
- name: wallet_age_days
  type: number
- name: inactive_since_in_days
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
