tool_id: wallet.wallet_age_distribution
g1: wallet
description: Classifies wallets into age cohorts based on days since first transaction.
g2: cohort
g3: wallet_age_distribution
g4: Age cohorts
g5: First tx cohort
scope: generic
returns:
- name: cohort
  type: string
- name: wallet_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_to
  type: date
  label: End Date
  required: true
