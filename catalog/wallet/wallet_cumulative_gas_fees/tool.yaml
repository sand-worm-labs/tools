tool_id: wallet.wallet_cumulative_gas_fees
g1: wallet
description: Cumulative ETH spent on gas fees by wallet over time.
g2: gas
g3: wallet_cumulative_gas_fees
g4: Cumulative Gas Fees
g5: Wallet Transactions
scope: generic
returns:
- name: block_time
  type: timestamp
- name: cumulative_eth
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '30'
  required: false
