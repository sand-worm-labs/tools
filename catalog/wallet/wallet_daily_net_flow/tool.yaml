tool_id: wallet.wallet_daily_net_flow
g1: wallet
description: Computes daily net ETH inflow, outflow, and balance change per wallet.
g2: balance
g3: wallet_daily_net_flow
g4: Daily net ETH flow
g5: Ethereum traces
scope: generic
returns:
- name: wallet_address
  type: string
- name: day
  type: date
- name: inflow
  type: number
- name: outflow
  type: number
- name: net
  type: number
inputs:
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: false
