tool_id: wallet.wallet_inflow_outflow
g1: wallet
description: Computes inflows and outflows for specified wallet over date range.
g2: wallet
g3: wallet_inflow_outflow
g4: Inflow/Outflow Summary
g5: Ethereum transactions
scope: generic
returns:
- name: type
  type: string
- name: count
  type: number
- name: sum_value
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: date_range
  type: date_range
  label: Date Range
  default:
    to: ''
    from: ''
  required: true
