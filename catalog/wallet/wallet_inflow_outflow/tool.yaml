tool_id: wallet.wallet_inflow_outflow
g1: wallet
description: Computes inflows and outflows for specified wallet over date range.
g2: wallet
g3: wallet_inflow_outflow
g4: Inflow/Outflow Summary
g5: Ethereum transactions
scope: generic
returns:
- name: type
  type: string
- name: count
  type: number
- name: sum_value
  type: number
inputs:
