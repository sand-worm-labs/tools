tool_id: wallet.wallet_inflow_timeseries
g1: wallet
description: Aggregates daily incoming transactions and SOL volume for wallet.
g2: inflows
g3: wallet_inflow_timeseries
g4: Daily Inflows
g5: solana.account_activity
scope: generic
returns:
- name: day
  type: date
- name: daily_in_txs
  type: number
- name: daily_in_sol
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: wallet_address
  type: address
  label: Wallet Address
  required: true
- key: date_from
  type: date
  label: Start Date
  default: '"365 days ago"'
  required: false
