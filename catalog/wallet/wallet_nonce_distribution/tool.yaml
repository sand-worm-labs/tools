tool_id: wallet.wallet_nonce_distribution
g1: wallet
description: Classifies bridge users into tiers by maximum nonce revealing tx sophistication
  levels.
g2: bridge
g3: wallet_nonce_distribution
g4: User Experience Tiers
g5: Bridge tx nonce analysis
scope: generic
returns:
- name: nonce_range
  type: string
- name: wallet_count
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: contract_address
  type: address
  label: Contract Address
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '365'
  required: false
