tool_id: wallet.weekly_user_retention_cohort
g1: wallet
description: Computes weekly cohort retention for active users.
g2: cohort
g3: weekly_user_retention_cohort
g4: Weekly Retention Matrix
g5: Ethereum Txs
scope: generic
returns:
- name: cohort_week
  type: date
- name: activity_week
  type: date
- name: retention_rate
  type: number
inputs:
- key: chain
  type: chain
  label: Chain
  default: ethereum
  options:
  - label: Ethereum
    value: ethereum
  - label: Base
    value: base
  - label: Optimism
    value: optimism
  - label: Arbitrum
    value: arbitrum
  - label: Polygon
    value: polygon
  - label: BSC
    value: bsc
  - label: Avalanche
    value: avalanche
  - label: Celo
    value: celo
  required: true
- key: date_from
  type: date
  label: Start Date
  required: true
- key: lookback_days
  type: number
  label: Lookback Days
  default: '90'
  required: true
