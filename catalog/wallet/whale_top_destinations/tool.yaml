tool_id: wallet.whale_top_destinations
g1: wallet
description: Identifies top N value-sending wallets in period and ranks their top
  M destinations by total value.
g2: whale
g3: whale_top_destinations
g4: Whale Counterparties
g5: Top spenders top tos
scope: generic
returns:
- name: whale_from
  type: string
- name: top_to
  type: string
- name: total_value
  type: number
- name: destination_rank
  type: number
inputs:
- key: date_from
  type: date
  label: Start Date
  required: true
- key: top_n_whales
  type: number
  label: Top Whale Tx Count
  default: '10'
  required: false
- key: top_n_dests
  type: number
  label: Top Dest per Whale
  default: '5'
  required: false
